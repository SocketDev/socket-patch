[package]
name = "socket-patch-core"
description = "Core library for socket-patch: manifest, hash, crawlers, patch engine, API client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
toml_edit = { workspace = true }
once_cell = { workspace = true }
qbsdiff = { workspace = true }
rayon = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
same-file = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true }
semver = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Self-update only needs the rename-dance helper on Windows: a running .exe
# cannot be overwritten there, while Unix swaps are a plain atomic rename we
# do ourselves (mode-preserving, setuid-refusing — see update/swap.rs).
[target.'cfg(windows)'.dependencies]
self-replace = { workspace = true }

# sha2 0.10 compiles its aarch64 SHA-256 hardware path only under the `asm`
# feature (x86/x86_64 already select SHA-NI at runtime without it); the
# soft fallback is 3-5x slower on every git-sha256 in apply, verify and
# vendor. The digests are identical. Windows-on-ARM is left on the soft
# path: the feature also builds sha2-asm, whose GNU-syntax assembly the
# MSVC toolchain does not assemble.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

# All ecosystems (npm, PyPI, Ruby gems, Go, Cargo, NuGet, Maven, Composer,
# Deno) are unconditionally compiled in AND enabled at runtime — there are
# no ecosystem feature gates and no runtime env gates (the old
# SOCKET_EXPERIMENTAL_MAVEN/NUGET opt-ins are retired).

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
serial_test = { workspace = true }
wiremock = { workspace = true }
