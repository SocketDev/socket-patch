[package]
name = "socket-patch-node"
description = "Node addon that runs the socket-patch hosted redirect engine in-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "socket_patch_node"
path = "src/lib.rs"
crate-type = ["cdylib"]
# A cdylib that links against the host's `napi_*` symbols has nothing to
# test outside Node; the engine's tests live in socket-patch-cli and the
# addon's in npm/test/smoke.mjs.
test = false
doctest = false

[dependencies]
socket-patch-cli = { path = "../socket-patch-cli" }
socket-patch-core = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
