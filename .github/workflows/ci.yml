name: CI

on:
  push:
    # Only main. A landing on the v5 integration branch runs through the
    # pull_request event of its PR into main instead: the full-tier jobs
    # below also run for `head_ref == release/v5-prerelease`. A push trigger
    # on a release-named branch makes zizmor audit this as a release
    # workflow (cache-poisoning).
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue tests each queued PR merged onto the tip of main (plus
  # the PRs ahead of it) before it lands. `ci-ok` below is the required
  # check, so this event has to run the same pull_request-tier job set.
  merge_group:
    types: [checks_requested]
  schedule:
    # Nightly on main: the `full` tier (e2e-full, cargo-vex-matrix-full,
    # yarn-berry-full) and e2e-docker, which pull_request runs skip.
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      hosted_e2e:
        # Underscored on purpose: `inputs.hosted-e2e` is not valid expression
        # syntax (a hyphenated name needs `inputs['hosted-e2e']`).
        description: 'hosted-e2e: auto (obey vars.HOSTED_E2E_DISABLED) | force | skip'
        type: choice
        default: auto
        options: [auto, force, skip]

permissions:
  contents: read

env:
  # Keep backtrace file/line information without linking full debug symbols
  # into every integration binary. Shared dev caches use the same setting.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to the same PR supersedes its older run; nothing else is
# cancelled. Push runs are grouped per commit: a concurrency group holds only
# ONE pending run, so a shared `refs/heads/main` group silently cancelled every
# queued push but the newest during a merge burst, and most main commits never
# got a verdict. Merge-group refs (gh-readonly-queue/...) are unique per queue
# entry already. The nightly keeps its own group so it never queues behind (or
# cancels) a push.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required independently of ci-ok so the merge queue sees a compile/lint
  # failure immediately. Expensive jobs also depend on this preflight.
  clippy:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.merge-queue.outputs.reuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Main remains the cache writer. Skip duplicate test execution only
      # when this workflow passed in the merge queue on the identical SHA.
      - name: Check merge-queue validation
        id: merge-queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-reuse-merge-group.py

      - name: Install Rust
        # rustup is pre-installed on GitHub-hosted runners. `rustup show`
        # reads rust-toolchain.toml in the repo root, then installs the
        # pinned channel + listed components if missing. No third-party
        # action dependency needed for toolchain setup.
        run: rustup show

      - name: Cache cargo
        # Swatinem/rust-cache instead of a raw actions/cache of the whole
        # target/ dir: it prunes the cache to dependency artifacts (~5-10x
        # smaller), which keeps this repo's total cache footprint inside
        # GitHub's 10 GiB budget (a raw target/ cache let every PR save evict
        # main's caches). save-if restricts writes to main so PR branches
        # restore without churning the budget. Compatible build jobs use
        # shared-key by profile + runner image (not job or package-manager
        # version). rust-cache also hashes the toolchain, Cargo manifests
        # and Rust environment. Check/coverage/release keep separate caches.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-features -- -D warnings

      - name: Check every test target before starting expensive jobs
        # Clippy above checks the shipped targets. This catches errors in
        # cfg(test), integration tests and feature-gated targets without
        # linking hundreds of executables or waiting for the E2E fan-out.
        run: cargo check --locked --workspace --all-targets --all-features

  # Cargo's tests do not link the addon's test=false cdylib. Build it once
  # per OS alongside the test shards; serializing it ahead of shard 1 left
  # that shard waiting on a separate production-profile compilation.
  # Linux also exercises the JS loader and engine/provider boundary.
  node-addon:
    if: github.event.pull_request.draft != true
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # The addon uses production features; the test shards enable dev
          # features. Keep both cache writers instead of racing to save a
          # partial dependency set under one key.
          shared-key: addon-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Build addon
        env:
          SOCKET_PATCH_NODE_CARGO_PROFILE: dev
        run: node crates/socket-patch-node/npm/scripts/build-addon.mjs

      - name: Smoke-test addon
        if: matrix.os == 'ubuntu-latest' && needs.clippy.outputs.reuse != 'true'
        run: node --test crates/socket-patch-node/npm/test/smoke.mjs

  # Check the standalone installer, release scripts, and native installer
  # test harnesses.
  lint-ecosystems:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python — test native installer harnesses
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Shell — shellcheck the curl|sh installer
        # shellcheck is pre-installed on ubuntu-latest.
        run: shellcheck --shell=sh scripts/install.sh

      - name: Shell — run the installer end to end
        # shellcheck proves the script parses; this proves it installs. The
        # script is what install.socket.dev/patch serves and what the README
        # tells people to pipe into a shell, so "it downloads the latest
        # release, verifies SHA256SUMS, and produces a binary that runs" is
        # worth asserting on every PR rather than discovering from a user.
        # Installs the LATEST RELEASE, not this checkout — on a version-bump PR
        # that is deliberately the previous version.
        run: |
          sh scripts/install.sh
          command -v socket-patch
          socket-patch --version

      - name: Shell — run the installer against an alternate origin
        # Exercises SOCKET_PATCH_BASE_URL (and SOCKET_PATCH_INSTALL_DIR) with a
        # base that is not the default. Uses GitHub's own releases base, which
        # is the same URL shape install.socket.dev serves, so the template the
        # script builds is covered regardless of whether the Socket relay is
        # deployed yet. The dedicated Socket-origin check is the next step.
        run: |
          SOCKET_PATCH_BASE_URL=https://github.com/SocketDev/socket-patch/releases \
          SOCKET_PATCH_INSTALL_DIR="$RUNNER_TEMP/alt-origin" \
            sh scripts/install.sh
          "$RUNNER_TEMP/alt-origin/socket-patch" --version

      - name: Shell — install through install.socket.dev, once it exists
        # The whole point of the relay is that a client never has to reach
        # github.com. That is only assertable against the deployed host, so this
        # step skips itself until the host resolves rather than being red from
        # the day it merges (same posture as the installer-drift workflow).
        run: |
          if ! curl -sfI -m 20 https://install.socket.dev/patch/latest >/dev/null 2>&1; then
            echo "::notice::install.socket.dev/patch/latest does not answer yet — skipping the Socket-origin install."
            exit 0
          fi
          latest=$(curl -fsSL -m 20 https://install.socket.dev/patch/latest)
          echo "install.socket.dev reports latest=$latest"
          SOCKET_PATCH_BASE_URL=https://install.socket.dev/patch/SocketDev/socket-patch/releases \
          SOCKET_PATCH_INSTALL_DIR="$RUNNER_TEMP/socket-origin" \
            sh scripts/install.sh
          installed=$("$RUNNER_TEMP/socket-origin/socket-patch" --version | awk '{print $NF}')
          if [ "$installed" != "$latest" ]; then
            echo "::error::install.socket.dev says latest is $latest but installed $installed" >&2
            exit 1
          fi

      - name: Shell — the installer URL is consistent across the docs
        # The README, the script's own usage comment, and the hosting runbook
        # all name the canonical URL. Keeping them in lockstep is the whole
        # promise of install.socket.dev/patch being "a copy of this file".
        run: |
          for f in README.md scripts/install.sh docs/installer-hosting.md; do
            if ! grep -qF 'https://install.socket.dev/patch' "$f"; then
              echo "Error: $f no longer references https://install.socket.dev/patch" >&2
              exit 1
            fi
          done

      - name: Shell — shellcheck the release scripts
        run: shellcheck scripts/version-sync.sh scripts/release-lint.sh scripts/dispatch-publish.sh

  # Release-readiness gate (scripts/release-lint.sh — the same checks the
  # Release workflow's `version` job runs before publishing anything):
  #   - every PR/push: version coherence — version-sync.sh must be a no-op,
  #     so a hand-edited version in any single packaging site fails CI here
  #     instead of surfacing mid-release;
  #   - the release train's rolling `release-sync` PR (docs/release-train/
  #     DESIGN.md §3.7), which moves main to the newest cut tag (rc or
  #     stable): CHANGELOG has a non-empty section for that version and the
  #     tag already exists. Only a same-repo `release-sync` branch targeting
  #     main gets this path; the same branch name from a fork (or aimed at
  #     another base) gets the full gate below;
  #   - any other PR that bumps the workspace version: the full gate —
  #     CHANGELOG has a dated, non-empty section for the new version and the
  #     tag doesn't already exist.
  release-readiness:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint release readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" = "release-sync" ] \
              && [ "$HEAD_REPO" = "$REPO" ] && [ "$BASE_REF" = "main" ]; then
            bash scripts/release-lint.sh --tag-exists
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare the workspace version against the PR base to detect a
            # version bump. The shallow checkout doesn't have the base
            # commit; fetch just that object.
            git fetch --quiet --depth 1 origin "$BASE_SHA"
            BASE_VERSION="$(git show "$BASE_SHA:Cargo.toml" | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')"
            HEAD_VERSION="$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
            if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
              echo "Version bump PR detected ($BASE_VERSION -> $HEAD_VERSION); running the full release gate."
              bash scripts/release-lint.sh --tag-check
              exit 0
            fi
          fi
          bash scripts/release-lint.sh --sync-only

  test:
    if: github.event.pull_request.draft != true
    needs: clippy
    # No ubuntu-latest leg: `coverage` runs this same `cargo test
    # --workspace` (debug, default features, plus Go and vexctl) on ubuntu,
    # instrumented, and fails on any test failure. A plain ubuntu leg ran
    # every Linux test a second time for ~12 job-minutes per run.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # Two legs per OS (scripts/ci-test-shard.py): one leg linked ~240
        # test binaries and ran them serially for ~26 min. Windows balances
        # measured runtime plus linking work; macOS keeps the count split.
        # Shard 1 also owns unit tests and doctests.
        shard: [1, 2]
        exclude:
          # macOS legs run on main, the merge queue and nightly, not per PR push.
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
          # One compile-only writer per OS is enough for an already tested SHA.
          - shard: ${{ needs.clippy.outputs.reuse == 'true' && 2 || 0 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      VEXCTL_VERSION: v0.3.0
      CI_TEST_TIMINGS: ${{ matrix.os == 'windows-latest' && 'scripts/ci-test-durations.json' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        # rustup is pre-installed on GitHub-hosted runners. `rustup show`
        # reads rust-toolchain.toml in the repo root, then installs the
        # pinned channel + listed components if missing. No third-party
        # action dependency needed for toolchain setup.
        run: rustup show

      - name: Cache cargo
        # Swatinem/rust-cache, main-only saves: see the first `Cache cargo`
        # step in this file.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: dev-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Warm the test cache after merge-queue validation
        if: needs.clippy.outputs.reuse == 'true'
        run: cargo test --locked --workspace --no-run

      - name: Install Go (for vexctl)
        if: needs.clippy.outputs.reuse != 'true'
        id: go
        # The `vex` subcommand emits OpenVEX documents; tests/e2e_vex.rs
        # validates the output with vexctl when it's on PATH. vexctl is
        # a Go binary distributed via `go install`. Setting up Go here
        # is the cheapest way to give every test job a usable vexctl.
        # Go must be >= 1.24: its linker only began emitting an LC_UUID load
        # command then, and the macOS-latest runner's dyld (Sequoia+) refuses
        # to load a Mach-O binary without one ("missing LC_UUID load command"),
        # so a 1.22-built vexctl crashes on launch and every e2e_vex assertion
        # fails. ubuntu/windows are unaffected, but the matrix shares this pin.
        # SHA pin resolved from `gh api repos/actions/setup-go/git/refs/tags/v6.4.0`.
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'
          cache: false

      - name: Restore vexctl (macOS)
        # The macOS compile below took a median 110s (max 168s) of every
        # macOS `test` job and is the step's only network flake source
        # (sum.golang.org resets). Its output depends only on the vexctl
        # version, the Go toolchain and the runner, so it is cached under
        # exactly those. Saved from main only, like the cargo cache.
        id: vexctl-cache
        if: needs.clippy.outputs.reuse != 'true' && runner.os == 'macOS'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/vexctl-bin
          key: vexctl-${{ env.VEXCTL_VERSION }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install vexctl
        if: needs.clippy.outputs.reuse != 'true'
        # Linux / Windows: the v0.3.0 release binary, checked against the
        # sha256 pinned here (from the release's vexctl_checksums.txt).
        # Compiling it took ~80s on ubuntu and ~180s on windows, the
        # slowest job in this workflow.
        #
        # macOS still compiles: the release's darwin binaries are built
        # with go1.22.7 and have no LC_UUID, so the runner's dyld refuses
        # them (see the Go step above). The compile is retried: it builds
        # sigstore/cosign, whose module verification reads dozens of
        # sum.golang.org checksum tiles, and transient INTERNAL_ERROR
        # stream resets there have failed this step on otherwise-green
        # runs. The backoff rides out short resets; a persistent outage
        # still fails loudly on the last attempt. A binary restored by the
        # step above skips the compile.
        #
        # --ssl-revoke-best-effort: Windows curl (schannel) otherwise fails
        # the TLS handshake with CRYPT_E_REVOCATION_OFFLINE whenever the
        # CA's revocation server is unreachable. A revoked certificate still
        # fails, and the sha256 check follows. A no-op on other OSes.
        #
        # Either way the binary's directory goes on PATH so
        # `Command::new("vexctl")` in the tests resolves.
        shell: bash
        env:
          VEXCTL_SHA256_LINUX_AMD64: cd7f8b57d20642166ed4eb3dd1fd849bbb30bbd7c5b9f5b0316b6003b57ceaba
          VEXCTL_SHA256_WINDOWS_AMD64: 346fb3104b656fe1a407cbae88ea29a636b36f4569ec58a5a8dadca7343993ed
          CACHE_HIT: ${{ steps.vexctl-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/vexctl-bin"
          mkdir -p "$dir"
          case "$RUNNER_OS" in
            Linux) asset=vexctl-linux-amd64 bin=vexctl sha="$VEXCTL_SHA256_LINUX_AMD64" ;;
            Windows) asset=vexctl-windows-amd64.exe bin=vexctl.exe sha="$VEXCTL_SHA256_WINDOWS_AMD64" ;;
            *) asset='' ;;
          esac
          if [ -n "$asset" ]; then
            curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort -o "$dir/$bin" \
              "https://github.com/openvex/vexctl/releases/download/$VEXCTL_VERSION/$asset"
            echo "$sha  $dir/$bin" | sha256sum -c -
            chmod +x "$dir/$bin"
            "$dir/$bin" version
            echo "$dir" >> "$GITHUB_PATH"
            exit 0
          fi
          if [ "$CACHE_HIT" != true ]; then
            for attempt in 1 2 3 4 5; do
              if GOBIN="$dir" go install "github.com/openvex/vexctl@$VEXCTL_VERSION"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::go install vexctl failed on all 5 attempts"
                exit 1
              fi
              echo "::warning::go install vexctl attempt $attempt failed; retrying"
              sleep $((attempt * 20))
            done
          fi
          "$dir/vexctl" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Save vexctl (macOS)
        if: >-
          needs.clippy.outputs.reuse != 'true'
          && runner.os == 'macOS'
          && github.ref == 'refs/heads/main'
          && steps.vexctl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/vexctl-bin
          key: ${{ steps.vexctl-cache.outputs.cache-primary-key }}

      - name: Run tests
        if: needs.clippy.outputs.reuse != 'true'
        # Default features only: `--all-features` would also RUN the
        # docker-e2e suites, which soft-skip as "ok" here (no images, and
        # macOS/Windows have no Docker) — fake greens hiding a broken
        # skip-guard. Their compile rot is caught on every OS by e2e-build,
        # which compiles every CLI test target with --all-features; one
        # feature set here means one compile.
        #
        # `--no-fail-fast`: without it cargo stops at the first failing test
        # BINARY, so one bad file hides every later binary's result on that
        # OS. Run them all and fail at the end instead.
        shell: bash
        env:
          # The real-go hosted/vendored suites (`#![cfg(unix)]`) ride the Go
          # installed above for vexctl: fail instead of skip without `go` /
          # `zip`, and assert the pinned release.
          SOCKET_PATCH_GO_E2E_REQUIRED: '1'
          SOCKET_PATCH_GO_E2E_VERSION: '1.24'
          TEST_SHARD: ${{ matrix.shard }}
        # This leg's share of `cargo test --workspace --no-fail-fast`; the
        # shards together run exactly that selection (test_ci_test_shard.py).
        run: |
          python3 scripts/ci-test-shard.py "$TEST_SHARD" 2

  test-release:
    # Each PR and main push runs the complete release-mode suite. The merge
    # queue already skips this job because each constituent PR ran it.
    if: github.event.pull_request.draft != true && github.event_name != 'merge_group'
    needs: clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Warm-cache runs still spend 20-23 minutes compiling ~240 optimized
    # test binaries, followed by 5-6 minutes executing them. Split both
    # compilation and execution with the same partitioner as `test`:
    # shard 1 owns the unit tests/doctests and fewer integration targets.
    # `ci-ok` waits for every shard and fails if any shard fails.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        # rustup is pre-installed on GitHub-hosted runners. `rustup show`
        # reads rust-toolchain.toml in the repo root, then installs the
        # pinned channel + listed components if missing. No third-party
        # action dependency needed for toolchain setup.
        run: rustup show

      - name: Cache cargo
        # Swatinem/rust-cache, main-only saves: see the first `Cache cargo`
        # step in this file.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests (release)
        # `ci-release` = [profile.release] minus the full-LTO link (see the
        # profile's comment in Cargo.toml). Same opt-level/debug-assertion
        # semantics this job exists to validate; ~23m of LTO relinking gone.
        # Default features for the same reason as the `test` job; the
        # feature-gated suites' compile rot is e2e-build's.
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: ${{ strategy.job-total }}
        run: python3 scripts/ci-test-shard.py "$TEST_SHARD" "$TEST_SHARD_COUNT" --locked --profile ci-release

  coverage:
    if: github.event.pull_request.draft != true
    needs: clippy
    # Code coverage via cargo-llvm-cov (LLVM source-based instrumentation).
    # Reports as a markdown table in the job summary and uploads the raw
    # lcov.info file as a workflow artifact. No threshold gating — the
    # numbers are report-only so contributors get visibility without flaky
    # CI when coverage shifts naturally with test edits. A failing TEST
    # fails the job: this is the Linux leg of `test`.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        # `rustup show` installs the rust-toolchain.toml channel + listed
        # components; `rustup component add` adds the llvm-tools-preview
        # bits cargo-llvm-cov needs to merge .profraw files into lcov.
        run: |
          rustup show
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        # taiki-e/install-action ships precompiled binaries — much faster
        # than `cargo install` and avoids a per-CI-run compile.
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Cache cargo
        # Swatinem/rust-cache, main-only saves: see the first `Cache cargo`
        # step in this file.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Warm the coverage cache after merge-queue validation
        if: needs.clippy.outputs.reuse == 'true'
        run: |
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/coverage-env.sh"
          source "$RUNNER_TEMP/coverage-env.sh"
          cargo test --locked --workspace --no-run

      - name: Install Go (for vexctl and the real-go suites)
        if: needs.clippy.outputs.reuse != 'true'
        # This job is the Linux leg of `test` (see there): same Go pin.
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'
          cache: false

      - name: Install vexctl
        if: needs.clippy.outputs.reuse != 'true'
        # The v0.3.0 Linux release binary, as in `test`'s vexctl step.
        env:
          VEXCTL_VERSION: v0.3.0
          VEXCTL_SHA256_LINUX_AMD64: cd7f8b57d20642166ed4eb3dd1fd849bbb30bbd7c5b9f5b0316b6003b57ceaba
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/vexctl-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/vexctl" \
            "https://github.com/openvex/vexctl/releases/download/$VEXCTL_VERSION/vexctl-linux-amd64"
          echo "$VEXCTL_SHA256_LINUX_AMD64  $dir/vexctl" | sha256sum -c -
          chmod +x "$dir/vexctl"
          "$dir/vexctl" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run tests with coverage
        if: needs.clippy.outputs.reuse != 'true'
        # Two-step pattern: `--no-report` runs instrumented tests and
        # collects raw profiles, then one `report` exports LCOV. Derive
        # line/function/branch totals from that file instead of merging
        # profiles and scanning objects a second time. The filename matches the `*.lcov`
        # gitignore pattern so a stray local run can't accidentally
        # commit a 600 KB report.
        #
        # Default features (instead of --all-features) exclude the
        # docker-e2e feature — those tests need Docker images this job
        # doesn't build. The coverage-docker matrix covers them
        # separately, and coverage-merge stitches everything together.
        #
        # This is also the gating Linux test run (`test` has no ubuntu
        # leg), hence `test`'s Go env and `--no-fail-fast`.
        env:
          SOCKET_PATCH_GO_E2E_REQUIRED: '1'
          SOCKET_PATCH_GO_E2E_VERSION: '1.24'
        run: |
          cargo llvm-cov --workspace --no-fail-fast \
            --no-report
          cargo llvm-cov report --lcov --output-path coverage-host.lcov
          python3 scripts/ci-lcov-summary.py coverage-host.lcov > coverage-summary.txt

      - name: Publish coverage summary to job summary
        if: needs.clippy.outputs.reuse != 'true'
        # Render the per-file LCOV totals as a fenced
        # block in the GitHub Actions job summary so reviewers don't
        # need to crack open the artifact for a quick look.
        run: |
          {
            echo "## Host coverage summary"
            echo ""
            echo "(In-process tests only. See coverage-merge for the"
            echo "full picture including docker-e2e binary coverage.)"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload host LCOV artifact
        if: needs.clippy.outputs.reuse != 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-host
          path: coverage-host.lcov
          if-no-files-found: error
          retention-days: 30

  # Dockerfile.base compiles the full-LTO release binary inside Docker, with
  # no cache. Build it once per run and hand the image to every docker leg.
  docker-base:
    if: github.event.pull_request.draft != true && needs.clippy.outputs.reuse != 'true'
    needs: clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # `driver: docker`: see coverage-docker's matching step.
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - name: Build base image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: tests/docker/Dockerfile.base
          tags: socket-patch-test-base:latest
          load: true

      - name: Save base image
        run: |
          mkdir -p docker-base
          docker save --output docker-base/socket-patch-test-base.tar socket-patch-test-base:latest

      - uses: ./.github/actions/upload-artifact
        with:
          name: docker-base-image
          path: docker-base/socket-patch-test-base.tar
          if-no-files-found: error
          retention-days: 3

  coverage-docker:
    # Per-ecosystem coverage for the Docker-driven e2e suite. Mirrors
    # the e2e-docker matrix but builds an instrumented socket-patch
    # binary and mounts it into the container along with a host-
    # visible profraw directory, so the in-container code paths
    # contribute to the lcov merge.
    #
    # Hooks: docker_e2e_<eco>.rs reads SOCKET_PATCH_COV_BIN +
    # SOCKET_PATCH_COV_PROFRAW_DIR. Both unset is the no-op default
    # (used by the e2e-docker matrix below). Every per-push docker_e2e
    # suite runs here; e2e-docker is the nightly run of the same suites
    # against the base image's full-LTO release binary.
    #
    # Pin to ubuntu-22.04 (glibc 2.35) instead of ubuntu-latest
    # (currently 24.04, glibc 2.39). The instrumented binary built
    # here gets mounted into the debian:12-slim test container
    # (glibc 2.36); a binary linked against a newer glibc than the
    # container ships fails to load. ubuntu-22.04's older glibc is
    # the highest base that's forward-compatible with debian:12.
    needs: docker-base
    runs-on: ubuntu-22.04
    # sbt's image bakes three JDKs and warm sbt / Mill / scala-cli caches.
    timeout-minutes: ${{ matrix.ecosystem == 'sbt' && 45 || 30 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [npm, pypi, gem, cargo, golang, maven, composer, nuget, deno, sbt]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # `driver: docker` makes buildx use the host docker daemon directly
        # rather than running BuildKit in its own container. This is what
        # lets the per-ecosystem image build see the locally-tagged
        # `socket-patch-test-base:latest` from the previous step (with the
        # default container driver, BuildKit runs in a sandbox that cannot
        # see the host daemon's image store and tries to pull base from
        # docker.io, which fails). The trade-off is that `type=gha` cache
        # exports aren't supported under the docker driver — we accept
        # rebuilding the images per job for correctness.
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - name: Install Rust
        # `rustup show` consumes rust-toolchain.toml; the explicit
        # `component add` covers llvm-tools-preview for cargo-llvm-cov.
        run: |
          rustup show
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-llvm-cov@0.8.7

      # No `actions/cache` here intentionally. This job builds Docker
      # images and would be flagged by zizmor's cache-poisoning audit
      # (a PR-poisoned cargo cache could compromise the instrumented
      # binary we mount into the container).

      - name: Download base image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-base-image*
          merge-multiple: true
          path: docker-base

      - name: Load base image
        run: docker load --input docker-base/socket-patch-test-base.tar

      - name: Build ${{ matrix.ecosystem }} image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: tests/docker/Dockerfile.${{ matrix.ecosystem }}
          tags: socket-patch-test-${{ matrix.ecosystem }}:latest
          load: true
          # Match the blocking agent_sbt_ slice below. The nightly and
          # compatibility workflows retain Dockerfile.sbt's full defaults.
          build-args: |
            ${{ matrix.ecosystem == 'sbt' && 'SBT_WARM_VERSIONS=1.2.8 1.13.0' || '' }}
            ${{ matrix.ecosystem == 'sbt' && 'SBT_WARM_TOOLS=0' || '' }}

      - name: Configure docker-e2e coverage hooks
        # Mount the instrumented socket-patch that the test step's own
        # `cargo llvm-cov` builds for the integration tests (cargo builds
        # a package's bins before running its integration tests), and
        # write the in-container profraws next to the test processes'
        # ones. `cargo llvm-cov report` reads only
        # target/llvm-cov-target/*.profraw and objects built there, so a
        # separately built binary or profraws elsewhere in target/ never
        # reach the lcov.
        run: |
          echo "SOCKET_PATCH_COV_BIN=$PWD/target/llvm-cov-target/debug/socket-patch" >> "$GITHUB_ENV"
          echo "SOCKET_PATCH_COV_PROFRAW_DIR=$PWD/target/llvm-cov-target" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.ecosystem }} Docker e2e test with coverage
        run: |
          # Vendor build-proof capstones ride the same image as their
          # ecosystem's main suite (extend the case as new vendor suites land).
          EXTRA=""
          # libtest arguments after `--`.
          FILTER=""
          case "${{ matrix.ecosystem }}" in
            composer) EXTRA="--test docker_e2e_vendor_composer" ;;
            gem)      EXTRA="--test docker_e2e_vendor_gem" ;;
            maven)    EXTRA="--test docker_e2e_vendor_maven" ;;
            nuget)    EXTRA="--test docker_e2e_vendor_nuget" ;;
            pypi)     EXTRA="--test docker_e2e_vendor_pypi_pm" ;;
            # The blocking sbt slice: the agent cells on 1.2.8 (Ivy) and
            # 1.13.0 (Coursier, plus the `useCoursier := false` Ivy cell).
            # Mill, scala-cli and the other sbt lines run nightly in
            # e2e-docker and in sbt-compatibility.yml.
            sbt)
              export SOCKET_PATCH_SBT_DOCKER_VERSIONS="1.2.8 1.13.0"
              export SOCKET_PATCH_DOCKER_E2E_REQUIRED=1
              FILTER="agent_sbt_ --test-threads=1" ;;
          esac
          # shellcheck disable=SC2086 # EXTRA and FILTER are intentionally word-split
          cargo llvm-cov \
            --features docker-e2e \
            --no-report \
            --test docker_e2e_${{ matrix.ecosystem }} $EXTRA \
            -- $FILTER

      - name: Generate per-ecosystem lcov
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path coverage-docker-${{ matrix.ecosystem }}.lcov

      - name: Upload per-ecosystem LCOV artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-docker-${{ matrix.ecosystem }}
          path: coverage-docker-${{ matrix.ecosystem }}.lcov
          if-no-files-found: error
          retention-days: 30

  coverage-merge:
    # Merge the host coverage and per-ecosystem docker coverage into a
    # single lcov.info. lcov(1) handles the union — same files are
    # summed line-by-line so a line covered by ANY test counts.
    needs: [coverage, coverage-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download all coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: coverage-artifacts
          pattern: coverage-{host*,docker-*}
          # Retries have distinct artifact names. Their LCOV filenames stay
          # stable, so a lost finalization response cannot double the counts.
          merge-multiple: true

      - name: Merge LCOV files
        # `--add-tracefile` is repeated per input. lcov sums hit counts
        # for identical source/line keys, so files covered by both host
        # and docker tests report the higher (union) count.
        # `find` (not bash globstar) for portability across runners.
        run: |
          set -e
          ARGS=()
          while IFS= read -r f; do
            ARGS+=(--add-tracefile "$f")
          done < <(find coverage-artifacts -name '*.lcov' -type f)
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "No lcov files found to merge" >&2
            exit 1
          fi
          lcov "${ARGS[@]}" --output-file coverage.lcov

      - name: Render summary
        # `lcov --summary` prints a per-file rollup we tee into the job
        # summary, same shape as cargo-llvm-cov's own.
        run: |
          {
            echo "## Coverage (host + docker-e2e merged)"
            echo ""
            echo '```'
            lcov --summary coverage.lcov 2>&1 | tail -20
            echo '```'
            echo ""
            echo "Full merged LCOV uploaded as the \`coverage-lcov\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged LCOV artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 30

  dispatch-tests:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Run npm dispatch tests
        run: node --test npm/socket-patch/bin/socket-patch.test.mjs

      - name: Run npm schema tests
        # The `./schema` export's zod tests. `npm install --no-save`, not
        # `npm ci`, for the reason publish-npm.yml gives (a version-synced
        # lock can name platform packages not yet on the registry); the
        # platform binaries are optional and not needed here. The pack
        # test runs again once `npm test` has built dist/, so it also
        # checks that the compiled schema ships.
        working-directory: npm/socket-patch
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --omit=optional
          npm test
          node --test --test-name-pattern="npm package contents" bin/socket-patch.test.mjs

  # Independent OS producers compile the CLI and every CLI test target
  # once per OS (--all-features, so this also checks feature-gated suites)
  # and upload the binaries the e2e, e2e-full and cargo-vex legs run.
  # The legs run the
  # test binaries directly from the same checkout path, so `CARGO_BIN_EXE_*`
  # and `CARGO_MANIFEST_DIR` resolve as they did under `cargo test`.
  e2e-build:
    outputs:
      reuse: ${{ needs.clippy.outputs.reuse }}
    if: github.event.pull_request.draft != true
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env: &e2e-build-env
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps: &e2e-build-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: e2e-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile the CLI and every CLI test target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p socket-patch-cli --all-features --tests --no-run --message-format=json-render-diagnostics > target-build.json

      - name: Bundle the binaries the legs run
        if: needs.clippy.outputs.reuse != 'true' || matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          BUNDLE_OS: ${{ matrix.os }}
        run: python3 scripts/ci-e2e-bundle.py --os "$BUNDLE_OS" --cargo-json target-build.json --dest target/e2e-bin

      - name: Compress the e2e binaries
        if: needs.clippy.outputs.reuse != 'true' || matrix.os == 'ubuntu-latest'
        # Compress the bundle as one stream so identical Rust code across
        # test binaries shares a dictionary. Zstd is on every runner image.
        # The 128 MiB window cuts the Linux artifact from ~200 MB to ~94 MB;
        # ZIP compresses each binary separately and repeats the common code.
        shell: bash
        run: |
          set -euo pipefail
          tar -C target/e2e-bin -cf - . | zstd -q -f -10 --long=27 -o target/e2e-bin.tar.zst

      - uses: ./.github/actions/upload-artifact
        if: needs.clippy.outputs.reuse != 'true' || matrix.os == 'ubuntu-latest'
        with:
          name: e2e-bin-${{ matrix.os }}
          path: target/e2e-bin.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  e2e-build-windows:
    outputs:
      reuse: ${{ needs.clippy.outputs.reuse }}
    if: github.event.pull_request.draft != true
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env: *e2e-build-env
    steps: *e2e-build-steps

  e2e-build-macos:
    outputs:
      reuse: ${{ needs.clippy.outputs.reuse }}
    if: github.event_name != 'pull_request'
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env: *e2e-build-env
    steps: *e2e-build-steps

  # Short cases share setup and artifact downloads. `cases` preserves each
  # original suite/filter/toolchain row; ci-e2e-run.py isolates its environment
  # and checks every result. The Gradle agent leg overlaps its three suites
  # with isolated Gradle homes. Repack with scripts/ci-e2e-groups.py --write.
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.ci_group }})
    if: needs.e2e-build.outputs.reuse != 'true'
    # These jobs consume e2e-build's binaries and can run alongside unit tests.
    needs: [e2e-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: 'ubuntu-latest', suite: 'e2e_vendor_composer_build e2e_redirect_composer_build', composer: '2', ci_group: 'e2e_vendor_composer_build e2e_redirect_composer_build-2-1'}
          - {os: 'ubuntu-latest', suite: 'e2e_vendor_composer_build e2e_redirect_composer_build', composer: '2.2', ci_group: 'e2e_vendor_composer_build e2e_redirect_composer_build-2.2-2'}
          - {os: 'ubuntu-latest', suite: 'e2e_vendor_composer_build e2e_redirect_composer_build', composer: '1', ci_group: 'e2e_vendor_composer_build e2e_redirect_composer_build-1-3'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.1', bundler: '1.17.3', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.1-1.17.3-4'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.1', bundler: '2.1.4', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.1-2.1.4-5'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.1', bundler: '2.2.33', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.1-2.2.33-6'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.3', bundler: '2.5.23', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.3-2.5.23-7'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.3', bundler: '2.6.9', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.3-2.6.9-8'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.4', bundler: '4.0.15', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.4-4.0.15-9'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.4', bundler: '4.0.21', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.4-4.0.21-10'}
          - {os: 'ubuntu-latest', bun: '1.4.2', suite: 'e2e_safety_pnpm e2e_redirect_npm_build e2e_redirect_rush_sim e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun', cases: '[{"os":"ubuntu-latest","suite":"e2e_safety_pnpm"},{"os":"ubuntu-latest","suite":"e2e_redirect_npm_build","npm_required":"1"},{"os":"ubuntu-latest","suite":"e2e_redirect_rush_sim"},{"os":"ubuntu-latest","suite":"e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun","bun":"1.4.2","test_filter":"--include-ignored"}]', ci_group: 'node20-1.4.2-11'}
          - {os: 'ubuntu-latest', bun: '1.1.45', suite: 'e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun e2e_bun_lockb', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun","bun":"1.1.45","test_filter":"--include-ignored"},{"os":"ubuntu-latest","suite":"e2e_bun_lockb","bun":"1.1.45","test_filter":"--include-ignored"}]', ci_group: 'node20-1.1.45-12'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun', bun: '1.2.23', test_filter: '--include-ignored', ci_group: 'node20-1.2.23-13'}
          - {os: 'ubuntu-latest', bun: '1.3.14', suite: 'e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun e2e_bun_lockb', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun","bun":"1.3.14","test_filter":"--include-ignored"},{"os":"ubuntu-latest","suite":"e2e_bun_lockb","bun":"1.3.14","test_filter":"--include-ignored workspace_late_dependent"}]', ci_group: 'node20-1.3.14-14'}
