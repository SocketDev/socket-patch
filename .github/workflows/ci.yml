name: CI

on:
  push:
    # Only main. A landing on the v5 integration branch runs through the
    # pull_request event of its PR into main instead: the full-tier jobs
    # below also run for `head_ref == release/v5-prerelease`. A push trigger
    # on a release-named branch makes zizmor audit this as a release
    # workflow (cache-poisoning).
    branches: [main]
  pull_request:
  schedule:
    # Nightly on main: the `full` tier (e2e-full, cargo-vex-matrix-full,
    # yarn-berry-full) and e2e-docker, which pull_request runs skip.
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      hosted_e2e:
        # Underscored on purpose: `inputs.hosted-e2e` is not valid expression
        # syntax (a hyphenated name needs `inputs['hosted-e2e']`).
        description: 'hosted-e2e: auto (obey vars.HOSTED_E2E_DISABLED) | force | skip'
        type: choice
        default: auto
        options: [auto, force, skip]

permissions:
  contents: read

# A newer push to the same PR supersedes its older run; nothing else is
# cancelled. Push, dispatch and schedule runs always finish: main runs are
# the ONLY rust-cache writers (save-if) and must not die mid-save, and a
# dispatched base-branch run is the base's only CI verdict. The nightly
# gets its own group: a group holds one pending run, so sharing main's would
# let a queued push and the nightly cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        # rustup is pre-installed on GitHub-hosted runners. `rustup show`
        # reads rust-toolchain.toml in the repo root, then installs the
        # pinned channel + listed components if missing. No third-party
        # action dependency needed for toolchain setup.
        run: rustup show

      - name: Cache cargo
        # Swatinem/rust-cache instead of a raw actions/cache of the whole
        # target/ dir: it prunes the cache to dependency artifacts (~5-10x
        # smaller), which keeps this repo's total cache footprint inside
        # GitHub's 10 GiB budget (a raw target/ cache let every PR save evict
        # main's caches). save-if restricts writes to main so PR branches
        # restore without churning the budget.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  # The napi addon is only ever loaded by Node, so cargo's own tests never
  # exercise its JS loader or the engine/provider boundary.
  node-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Build addon
        env:
          SOCKET_PATCH_NODE_CARGO_PROFILE: dev
        run: node crates/socket-patch-node/npm/scripts/build-addon.mjs

      - name: Smoke-test addon
        run: node --test crates/socket-patch-node/npm/test/smoke.mjs

  # Check the standalone installer, release scripts, and native installer
  # test harnesses.
  lint-ecosystems:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python — test native installer harnesses
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Shell — shellcheck the curl|sh installer
        # shellcheck is pre-installed on ubuntu-latest.
        run: shellcheck --shell=sh scripts/install.sh

      - name: Shell — run the installer end to end
        # shellcheck proves the script parses; this proves it installs. The
        # script is what install.socket.dev/patch serves and what the README
        # tells people to pipe into a shell, so "it downloads the latest
        # release, verifies SHA256SUMS, and produces a binary that runs" is
        # worth asserting on every PR rather than discovering from a user.
        # Installs the LATEST RELEASE, not this checkout — on a version-bump PR
        # that is deliberately the previous version.
        run: |
          sh scripts/install.sh
          command -v socket-patch
          socket-patch --version

      - name: Shell — run the installer against an alternate origin
        # Exercises SOCKET_PATCH_BASE_URL (and SOCKET_PATCH_INSTALL_DIR) with a
        # base that is not the default. Uses GitHub's own releases base, which
        # is the same URL shape install.socket.dev serves, so the template the
        # script builds is covered regardless of whether the Socket relay is
        # deployed yet. The dedicated Socket-origin check is the next step.
        run: |
          SOCKET_PATCH_BASE_URL=https://github.com/SocketDev/socket-patch/releases \
          SOCKET_PATCH_INSTALL_DIR="$RUNNER_TEMP/alt-origin" \
            sh scripts/install.sh
          "$RUNNER_TEMP/alt-origin/socket-patch" --version

      - name: Shell — install through install.socket.dev, once it exists
        # The whole point of the relay is that a client never has to reach
        # github.com. That is only assertable against the deployed host, so this
        # step skips itself until the host resolves rather than being red from
        # the day it merges (same posture as the installer-drift workflow).
        run: |
          if ! curl -sfI -m 20 https://install.socket.dev/patch/latest >/dev/null 2>&1; then
            echo "::notice::install.socket.dev/patch/latest does not answer yet — skipping the Socket-origin install."
            exit 0
          fi
          latest=$(curl -fsSL -m 20 https://install.socket.dev/patch/latest)
          echo "install.socket.dev reports latest=$latest"
          SOCKET_PATCH_BASE_URL=https://install.socket.dev/patch/SocketDev/socket-patch/releases \
          SOCKET_PATCH_INSTALL_DIR="$RUNNER_TEMP/socket-origin" \
            sh scripts/install.sh
          installed=$("$RUNNER_TEMP/socket-origin/socket-patch" --version | awk '{print $NF}')
          if [ "$installed" != "$latest" ]; then
            echo "::error::install.socket.dev says latest is $latest but installed $installed" >&2
            exit 1
          fi

      - name: Shell — the installer URL is consistent across the docs
        # The README, the script's own usage comment, and the hosting runbook
        # all name the canonical URL. Keeping them in lockstep is the whole
        # promise of install.socket.dev/patch being "a copy of this file".
        run: |
          for f in README.md scripts/install.sh docs/installer-hosting.md; do
            if ! grep -qF 'https://install.socket.dev/patch' "$f"; then
              echo "Error: $f no longer references https://install.socket.dev/patch" >&2
              exit 1
            fi
          done

      - name: Shell — shellcheck the release scripts
        run: shellcheck scripts/version-sync.sh scripts/release-lint.sh scripts/dispatch-publish.sh

  # Release-readiness gate (scripts/release-lint.sh — the same checks the
  # Release workflow's `version` job runs before publishing anything):
  #   - every PR/push: version coherence — version-sync.sh must be a no-op,
  #     so a hand-edited version in any single packaging site fails CI here
  #     instead of surfacing mid-release;
  #   - the release train's rolling `release-sync` PR (docs/release-train/
  #     DESIGN.md §3.7), which moves main to the newest cut tag (rc or
  #     stable): CHANGELOG has a non-empty section for that version and the
  #     tag already exists. Only a same-repo `release-sync` branch targeting
  #     main gets this path; the same branch name from a fork (or aimed at
  #     another base) gets the full gate below;
  #   - any other PR that bumps the workspace version: the full gate —
  #     CHANGELOG has a dated, non-empty section for the new version and the
  #     tag doesn't already exist.
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint release readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" = "release-sync" ] \
              && [ "$HEAD_REPO" = "$REPO" ] && [ "$BASE_REF" = "main" ]; then
            bash scripts/release-lint.sh --tag-exists
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare the workspace version against the PR base to detect a
            # version bump. The shallow checkout doesn't have the base
            # commit; fetch just that object.
            git fetch --quiet --depth 1 origin "$BASE_SHA"
            BASE_VERSION="$(git show "$BASE_SHA:Cargo.toml" | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')"
            HEAD_VERSION="$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
            if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
              echo "Version bump PR detected ($BASE_VERSION -> $HEAD_VERSION); running the full release gate."
              bash scripts/release-lint.sh --tag-check
              exit 0
            fi
          fi
          bash scripts/release-lint.sh --sync-only

  test:
    # No ubuntu-latest leg: `coverage` runs this same `cargo test
    # --workspace` (debug, default features, plus Go and vexctl) on ubuntu,
    # instrumented, and fails on any test failure. A plain ubuntu leg ran
    # every Linux test a second time for ~12 job-minutes per run.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      VEXCTL_VERSION: v0.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        # rustup is pre-installed on GitHub-hosted runners. `rustup show`
        # reads rust-toolchain.toml in the repo root, then installs the
        # pinned channel + listed components if missing. No third-party
        # action dependency needed for toolchain setup.
        run: rustup show

      - name: Cache cargo
        # Swatinem/rust-cache, main-only saves: see the first `Cache cargo`
        # step in this file.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --workspace

      - name: Install Go (for vexctl)
        id: go
        # The `vex` subcommand emits OpenVEX documents; tests/e2e_vex.rs
        # validates the output with vexctl when it's on PATH. vexctl is
        # a Go binary distributed via `go install`. Setting up Go here
        # is the cheapest way to give every test job a usable vexctl.
        # Go must be >= 1.24: its linker only began emitting an LC_UUID load
        # command then, and the macOS-latest runner's dyld (Sequoia+) refuses
        # to load a Mach-O binary without one ("missing LC_UUID load command"),
        # so a 1.22-built vexctl crashes on launch and every e2e_vex assertion
        # fails. ubuntu/windows are unaffected, but the matrix shares this pin.
        # SHA pin resolved from `gh api repos/actions/setup-go/git/refs/tags/v6.4.0`.
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'
          cache: false

      - name: Restore vexctl (macOS)
        # The macOS compile below took a median 110s (max 168s) of every
        # macOS `test` job and is the step's only network flake source
        # (sum.golang.org resets). Its output depends only on the vexctl
        # version, the Go toolchain and the runner, so it is cached under
        # exactly those. Saved from main only, like the cargo cache.
        id: vexctl-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/vexctl-bin
          key: vexctl-${{ env.VEXCTL_VERSION }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install vexctl
        # Linux / Windows: the v0.3.0 release binary, checked against the
        # sha256 pinned here (from the release's vexctl_checksums.txt).
        # Compiling it took ~80s on ubuntu and ~180s on windows, the
        # slowest job in this workflow.
        #
        # macOS still compiles: the release's darwin binaries are built
        # with go1.22.7 and have no LC_UUID, so the runner's dyld refuses
        # them (see the Go step above). The compile is retried: it builds
        # sigstore/cosign, whose module verification reads dozens of
        # sum.golang.org checksum tiles, and transient INTERNAL_ERROR
        # stream resets there have failed this step on otherwise-green
        # runs. The backoff rides out short resets; a persistent outage
        # still fails loudly on the last attempt. A binary restored by the
        # step above skips the compile.
        #
        # --ssl-revoke-best-effort: Windows curl (schannel) otherwise fails
        # the TLS handshake with CRYPT_E_REVOCATION_OFFLINE whenever the
        # CA's revocation server is unreachable. A revoked certificate still
        # fails, and the sha256 check follows. A no-op on other OSes.
        #
        # Either way the binary's directory goes on PATH so
        # `Command::new("vexctl")` in the tests resolves.
        shell: bash
        env:
          VEXCTL_SHA256_LINUX_AMD64: cd7f8b57d20642166ed4eb3dd1fd849bbb30bbd7c5b9f5b0316b6003b57ceaba
          VEXCTL_SHA256_WINDOWS_AMD64: 346fb3104b656fe1a407cbae88ea29a636b36f4569ec58a5a8dadca7343993ed
          CACHE_HIT: ${{ steps.vexctl-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/vexctl-bin"
          mkdir -p "$dir"
          case "$RUNNER_OS" in
            Linux) asset=vexctl-linux-amd64 bin=vexctl sha="$VEXCTL_SHA256_LINUX_AMD64" ;;
            Windows) asset=vexctl-windows-amd64.exe bin=vexctl.exe sha="$VEXCTL_SHA256_WINDOWS_AMD64" ;;
            *) asset='' ;;
          esac
          if [ -n "$asset" ]; then
            curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort -o "$dir/$bin" \
              "https://github.com/openvex/vexctl/releases/download/$VEXCTL_VERSION/$asset"
            echo "$sha  $dir/$bin" | sha256sum -c -
            chmod +x "$dir/$bin"
            "$dir/$bin" version
            echo "$dir" >> "$GITHUB_PATH"
            exit 0
          fi
          if [ "$CACHE_HIT" != true ]; then
            for attempt in 1 2 3 4 5; do
              if GOBIN="$dir" go install "github.com/openvex/vexctl@$VEXCTL_VERSION"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::go install vexctl failed on all 5 attempts"
                exit 1
              fi
              echo "::warning::go install vexctl attempt $attempt failed; retrying"
              sleep $((attempt * 20))
            done
          fi
          "$dir/vexctl" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Save vexctl (macOS)
        if: >-
          runner.os == 'macOS'
          && github.ref == 'refs/heads/main'
          && steps.vexctl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/vexctl-bin
          key: ${{ steps.vexctl-cache.outputs.cache-primary-key }}

      - name: Run tests
        # Default features only: `--all-features` would also RUN the
        # docker-e2e suites, which soft-skip as "ok" here (no images, and
        # macOS/Windows have no Docker) — fake greens hiding a broken
        # skip-guard. Their compile rot is caught on every OS by e2e-build,
        # which compiles every CLI test target with --all-features; one
        # feature set here means one compile.
        #
        # `--no-fail-fast`: without it cargo stops at the first failing test
        # BINARY, so one bad file hides every later binary's result on that
        # OS. Run them all and fail at the end instead.
        shell: bash
        env:
          # The real-go hosted/vendored suites (`#![cfg(unix)]`) ride the Go
          # installed above for vexctl: fail instead of skip without `go` /
          # `zip`, and assert the pinned release.
          SOCKET_PATCH_GO_E2E_REQUIRED: '1'
          SOCKET_PATCH_GO_E2E_VERSION: '1.24'
        run: |
          cargo test --workspace --no-fail-fast

  test-release:
    runs-on: ubuntu-latest
    # Every tests/ target is its own optimized link (~240 test binaries).
    # The manifest-less VEX suites share two multi-module binaries
    # (tests/e2e_vex_lockfile/, tests/e2e_vex_build/) to keep the count down.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        # rustup is pre-installed on GitHub-hosted runners. `rustup show`
        # reads rust-toolchain.toml in the repo root, then installs the
        # pinned channel + listed components if missing. No third-party
        # action dependency needed for toolchain setup.
        run: rustup show

      - name: Cache cargo
        # Swatinem/rust-cache, main-only saves: see the first `Cache cargo`
        # step in this file.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests (release)
        # `ci-release` = [profile.release] minus the full-LTO link (see the
        # profile's comment in Cargo.toml). Same opt-level/debug-assertion
        # semantics this job exists to validate; ~23m of LTO relinking gone.
        # Default features for the same reason as the `test` job; the
        # feature-gated suites' compile rot is e2e-build's.
        run: cargo test --workspace --profile ci-release

  coverage:
    # Code coverage via cargo-llvm-cov (LLVM source-based instrumentation).
    # Reports as a markdown table in the job summary and uploads the raw
    # lcov.info file as a workflow artifact. No threshold gating — the
    # numbers are report-only so contributors get visibility without flaky
    # CI when coverage shifts naturally with test edits. A failing TEST
    # fails the job: this is the Linux leg of `test`.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        # `rustup show` installs the rust-toolchain.toml channel + listed
        # components; `rustup component add` adds the llvm-tools-preview
        # bits cargo-llvm-cov needs to merge .profraw files into lcov.
        run: |
          rustup show
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        # taiki-e/install-action ships precompiled binaries — much faster
        # than `cargo install` and avoids a per-CI-run compile.
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Cache cargo
        # Swatinem/rust-cache, main-only saves: see the first `Cache cargo`
        # step in this file.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Go (for vexctl and the real-go suites)
        # This job is the Linux leg of `test` (see there): same Go pin.
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'
          cache: false

      - name: Install vexctl
        # The v0.3.0 Linux release binary, as in `test`'s vexctl step.
        env:
          VEXCTL_VERSION: v0.3.0
          VEXCTL_SHA256_LINUX_AMD64: cd7f8b57d20642166ed4eb3dd1fd849bbb30bbd7c5b9f5b0316b6003b57ceaba
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/vexctl-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/vexctl" \
            "https://github.com/openvex/vexctl/releases/download/$VEXCTL_VERSION/vexctl-linux-amd64"
          echo "$VEXCTL_SHA256_LINUX_AMD64  $dir/vexctl" | sha256sum -c -
          chmod +x "$dir/vexctl"
          "$dir/vexctl" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run tests with coverage
        # Two-step pattern: `--no-report` runs instrumented tests and
        # collects the raw profile data, then the two `report` calls
        # emit lcov + summary from the same data. Avoids re-running
        # tests twice. The output filename matches the `*.lcov`
        # gitignore pattern so a stray local run can't accidentally
        # commit a 600 KB report.
        #
        # Default features (instead of --all-features) exclude the
        # docker-e2e feature — those tests need Docker images this job
        # doesn't build. The coverage-docker matrix covers them
        # separately, and coverage-merge stitches everything together.
        #
        # This is also the gating Linux test run (`test` has no ubuntu
        # leg), hence `test`'s Go env and `--no-fail-fast`.
        env:
          SOCKET_PATCH_GO_E2E_REQUIRED: '1'
          SOCKET_PATCH_GO_E2E_VERSION: '1.24'
        run: |
          cargo llvm-cov --workspace --no-fail-fast \
            --no-report
          cargo llvm-cov report --lcov --output-path coverage-host.lcov
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Publish coverage summary to job summary
        # Render the per-file table cargo-llvm-cov prints as a fenced
        # block in the GitHub Actions job summary so reviewers don't
        # need to crack open the artifact for a quick look.
        run: |
          {
            echo "## Host coverage summary"
            echo ""
            echo "(In-process tests only. See coverage-merge for the"
            echo "full picture including docker-e2e binary coverage.)"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload host LCOV artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-host
          path: coverage-host.lcov
          if-no-files-found: error
          retention-days: 30

  # Dockerfile.base compiles the full-LTO release binary inside Docker, with
  # no cache. Build it once per run and hand the image to every docker leg.
  docker-base:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # `driver: docker`: see coverage-docker's matching step.
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - name: Build base image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: tests/docker/Dockerfile.base
          tags: socket-patch-test-base:latest
          load: true

      - name: Save base image
        run: |
          mkdir -p docker-base
          docker save --output docker-base/socket-patch-test-base.tar socket-patch-test-base:latest

      - uses: ./.github/actions/upload-artifact
        with:
          name: docker-base-image
          path: docker-base/socket-patch-test-base.tar
          if-no-files-found: error
          retention-days: 3

  coverage-docker:
    # Per-ecosystem coverage for the Docker-driven e2e suite. Mirrors
    # the e2e-docker matrix but builds an instrumented socket-patch
    # binary and mounts it into the container along with a host-
    # visible profraw directory, so the in-container code paths
    # contribute to the lcov merge.
    #
    # Hooks: docker_e2e_<eco>.rs reads SOCKET_PATCH_COV_BIN +
    # SOCKET_PATCH_COV_PROFRAW_DIR. Both unset is the no-op default
    # (used by the e2e-docker matrix below). Every per-push docker_e2e
    # suite runs here; e2e-docker is the nightly run of the same suites
    # against the base image's full-LTO release binary.
    #
    # Pin to ubuntu-22.04 (glibc 2.35) instead of ubuntu-latest
    # (currently 24.04, glibc 2.39). The instrumented binary built
    # here gets mounted into the debian:12-slim test container
    # (glibc 2.36); a binary linked against a newer glibc than the
    # container ships fails to load. ubuntu-22.04's older glibc is
    # the highest base that's forward-compatible with debian:12.
    needs: docker-base
    runs-on: ubuntu-22.04
    # sbt's image bakes three JDKs and warm sbt / Mill / scala-cli caches.
    timeout-minutes: ${{ matrix.ecosystem == 'sbt' && 45 || 30 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [npm, pypi, gem, cargo, golang, maven, composer, nuget, deno, sbt]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # `driver: docker` makes buildx use the host docker daemon directly
        # rather than running BuildKit in its own container. This is what
        # lets the per-ecosystem image build see the locally-tagged
        # `socket-patch-test-base:latest` from the previous step (with the
        # default container driver, BuildKit runs in a sandbox that cannot
        # see the host daemon's image store and tries to pull base from
        # docker.io, which fails). The trade-off is that `type=gha` cache
        # exports aren't supported under the docker driver — we accept
        # rebuilding the images per job for correctness.
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - name: Install Rust
        # `rustup show` consumes rust-toolchain.toml; the explicit
        # `component add` covers llvm-tools-preview for cargo-llvm-cov.
        run: |
          rustup show
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-llvm-cov@0.8.7

      # No `actions/cache` here intentionally. This job builds Docker
      # images and would be flagged by zizmor's cache-poisoning audit
      # (a PR-poisoned cargo cache could compromise the instrumented
      # binary we mount into the container).

      - name: Download base image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-base-image*
          merge-multiple: true
          path: docker-base

      - name: Load base image
        run: docker load --input docker-base/socket-patch-test-base.tar

      - name: Build ${{ matrix.ecosystem }} image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: tests/docker/Dockerfile.${{ matrix.ecosystem }}
          tags: socket-patch-test-${{ matrix.ecosystem }}:latest
          load: true

      - name: Build instrumented socket-patch binary
        # Source `cargo llvm-cov show-env` into the current shell so this
        # `cargo build` picks up RUSTC_WRAPPER=cargo-llvm-cov and the
        # same RUSTFLAGS that the subsequent `cargo llvm-cov` test step
        # will use. The bin we build ends up byte-compatible with the
        # test binaries — same source hashes → unified coverage map at
        # report time. Env stays scoped to this step (intentional;
        # cargo llvm-cov manages its own env in the test step).
        run: |
          eval "$(cargo llvm-cov show-env --export-prefix 2>/dev/null)"
          cargo build --bin socket-patch

      - name: Configure docker-e2e coverage hooks
        run: |
          echo "SOCKET_PATCH_COV_BIN=$PWD/target/debug/socket-patch" >> "$GITHUB_ENV"
          # Profraw files from the in-container binary land here.
          # cargo-llvm-cov scans target/ for *.profraw at report time.
          echo "SOCKET_PATCH_COV_PROFRAW_DIR=$PWD/target" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.ecosystem }} Docker e2e test with coverage
        run: |
          # Vendor build-proof capstones ride the same image as their
          # ecosystem's main suite (extend the case as new vendor suites land).
          EXTRA=""
          # libtest arguments after `--`.
          FILTER=""
          case "${{ matrix.ecosystem }}" in
            composer) EXTRA="--test docker_e2e_vendor_composer" ;;
            gem)      EXTRA="--test docker_e2e_vendor_gem" ;;
            maven)    EXTRA="--test docker_e2e_vendor_maven" ;;
            nuget)    EXTRA="--test docker_e2e_vendor_nuget" ;;
            pypi)     EXTRA="--test docker_e2e_vendor_pypi_pm" ;;
            # The blocking sbt slice: the agent cells on 1.2.8 (Ivy) and
            # 1.13.0 (Coursier, plus the `useCoursier := false` Ivy cell).
            # Mill, scala-cli and the other sbt lines run nightly in
            # e2e-docker and in sbt-compatibility.yml.
            sbt)
              export SOCKET_PATCH_SBT_DOCKER_VERSIONS="1.2.8 1.13.0"
              export SOCKET_PATCH_DOCKER_E2E_REQUIRED=1
              FILTER="agent_sbt_ --test-threads=1" ;;
          esac
          # shellcheck disable=SC2086 # EXTRA and FILTER are intentionally word-split
          cargo llvm-cov \
            --features docker-e2e \
            --no-report \
            --test docker_e2e_${{ matrix.ecosystem }} $EXTRA \
            -- $FILTER

      - name: Generate per-ecosystem lcov
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path coverage-docker-${{ matrix.ecosystem }}.lcov

      - name: Upload per-ecosystem LCOV artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-docker-${{ matrix.ecosystem }}
          path: coverage-docker-${{ matrix.ecosystem }}.lcov
          if-no-files-found: error
          retention-days: 30

  coverage-merge:
    # Merge the host coverage and per-ecosystem docker coverage into a
    # single lcov.info. lcov(1) handles the union — same files are
    # summed line-by-line so a line covered by ANY test counts.
    needs: [coverage, coverage-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download all coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: coverage-artifacts
          pattern: coverage-{host*,docker-*}
          # Retries have distinct artifact names. Their LCOV filenames stay
          # stable, so a lost finalization response cannot double the counts.
          merge-multiple: true

      - name: Merge LCOV files
        # `--add-tracefile` is repeated per input. lcov sums hit counts
        # for identical source/line keys, so files covered by both host
        # and docker tests report the higher (union) count.
        # `find` (not bash globstar) for portability across runners.
        run: |
          set -e
          ARGS=()
          while IFS= read -r f; do
            ARGS+=(--add-tracefile "$f")
          done < <(find coverage-artifacts -name '*.lcov' -type f)
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "No lcov files found to merge" >&2
            exit 1
          fi
          lcov "${ARGS[@]}" --output-file coverage.lcov

      - name: Render summary
        # `lcov --summary` prints a per-file rollup we tee into the job
        # summary, same shape as cargo-llvm-cov's own.
        run: |
          {
            echo "## Coverage (host + docker-e2e merged)"
            echo ""
            echo '```'
            lcov --summary coverage.lcov 2>&1 | tail -20
            echo '```'
            echo ""
            echo "Full merged LCOV uploaded as the \`coverage-lcov\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged LCOV artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 30

  dispatch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Run npm dispatch tests
        run: node --test npm/socket-patch/bin/socket-patch.test.mjs

      - name: Run npm schema tests
        # The `./schema` export's zod tests. `npm install --no-save`, not
        # `npm ci`, for the reason publish-npm.yml gives (a version-synced
        # lock can name platform packages not yet on the registry); the
        # platform binaries are optional and not needed here. The pack
        # test runs again once `npm test` has built dist/, so it also
        # checks that the compiled schema ships.
        working-directory: npm/socket-patch
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --omit=optional
          npm test
          node --test --test-name-pattern="npm package contents" bin/socket-patch.test.mjs

  # Compiles the CLI and every CLI test target once per OS (--all-features,
  # so this is also the feature-gated suites' compile-rot check) and uploads
  # the binaries the e2e, e2e-full and cargo-vex legs run. The legs run the
  # test binaries directly from the same checkout path, so `CARGO_BIN_EXE_*`
  # and `CARGO_MANIFEST_DIR` resolve as they did under `cargo test`.
  e2e-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows compiles the same ~240 targets ~1.6x slower (see `test`).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: e2e-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile the CLI and every CLI test target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p socket-patch-cli --all-features --tests --no-run --message-format=json-render-diagnostics > target-build.json

      - name: Bundle the binaries the legs run
        shell: bash
        env:
          BUNDLE_OS: ${{ matrix.os }}
        run: python3 scripts/ci-e2e-bundle.py --os "$BUNDLE_OS" --cargo-json target-build.json --dest target/e2e-bin

      - uses: ./.github/actions/upload-artifact
        with:
          name: e2e-bin-${{ matrix.os }}
          path: target/e2e-bin/
          if-no-files-found: error
          retention-days: 3

  e2e:
    # These jobs consume e2e-build's binaries and can run alongside unit tests.
    needs: [e2e-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          # (No e2e_cargo / e2e_golang rows: neither suite has an
          # `#[ignore]`-gated test or needs a real toolchain, so the `test`
          # job already runs all of them. No e2e_maven / e2e_nuget /
          # e2e_composer rows either: their tests are hermetic and not
          # `#[ignore]`d, so `test` runs them on every OS.)
          # Host build-proof capstones: fresh-checkout install + revert
          # against the REAL composer/bundler toolchains, each ending in the
          # manifest-less VEX matrix. `#[ignore]`-gated (the unpinned `test`
          # job skips them); `composer:` / `bundler:` install that exact
          # toolchain below, runs them via `--ignored`, and exports the
          # suites' `_REQUIRED` + `_VERSION` gates so a leg hard-fails
          # instead of skipping on a missing or wrong toolchain.
          # ubuntu-latest only — they need the pinned toolchain, not per-OS
          # coverage.
          #
          # composer: 1 (packagist stopped serving composer 1 on 2025-09-01,
          # so the fixture resolves from an inline repository), 2.2 LTS and
          # current 2. Every release from 1.x through 2.9 falls back to the
          # git `source` when the dist download fails (the fallback the
          # hosted redirect must drop); 2.10 does not. The exact-release
          # matrix, 2.9.8 and macOS/Windows included, is
          # composer-compatibility.yml.
          - {os: ubuntu-latest, suite: e2e_vendor_composer_build, composer: '2'}
          - {os: ubuntu-latest, suite: e2e_vendor_composer_build, composer: '2.2'}
          - {os: ubuntu-latest, suite: e2e_vendor_composer_build, composer: '1'}
          - {os: ubuntu-latest, suite: e2e_redirect_composer_build, composer: '2'}
          - {os: ubuntu-latest, suite: e2e_redirect_composer_build, composer: '2.2'}
          - {os: ubuntu-latest, suite: e2e_redirect_composer_build, composer: '1'}
          # Real-bundler gem capstones, one leg per bundler era. Boundaries:
          # 1.17/2.1 merged GEM section, 2.2 separate sections, 2.5 last
          # pre-CHECKSUMS, 2.6 CHECKSUMS, 4.0.15/4.0.21 before/after the
          # strict frozen check (rubygems#9750). bundler <= 2.2 needs
          # Ruby <= 3.3 and 1.17-2.1 need Ruby <= 3.1 (`untaint`). 2.7.2
          # (no boundary of its own) is in e2e-full.
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.1', bundler: '1.17.3'}
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.1', bundler: '2.1.4'}
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.1', bundler: '2.2.33'}
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.3', bundler: '2.5.23'}
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.3', bundler: '2.6.9'}
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.4', bundler: '4.0.15'}
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.4', bundler: '4.0.21'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.1', bundler: '1.17.3'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.1', bundler: '2.1.4'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.1', bundler: '2.2.33'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.3', bundler: '2.5.23'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.3', bundler: '2.6.9'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.4', bundler: '4.0.15'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.4', bundler: '4.0.21'}
          # The live-API smoke suites (e2e_npm, e2e_pypi, e2e_gem,
          # e2e_scan) are intentionally NOT in the PR matrix — their
          # `#[ignore]`-gated tests hit the real public proxy at
          # patches-api.socket.dev, which intermittently returns
          # 503 "Service temporarily over capacity" outside this
          # repo's control. Run on demand:
          #
          #   cargo test -p socket-patch-cli --test e2e_npm  -- --ignored
          #   cargo test -p socket-patch-cli --test e2e_pypi -- --ignored
          #   cargo test -p socket-patch-cli --test e2e_gem  -- --ignored
          #   cargo test -p socket-patch-cli --test e2e_scan -- --ignored
          #
          # Same policy for the self-update live smoke (hits real
          # github.com releases; catches asset-naming/redirect/SUMS
          # drift against the published pipeline — most useful right
          # after a release):
          #
          #   cargo test -p socket-patch-cli --test self_update_e2e -- --ignored
          #
          # PR-time coverage for the same code paths comes from the
          # `e2e-docker` matrix below, which runs the same flow
          # against a hermetic wiremock fixture.
          # Safety-hardening e2e suites. The fast non-ignored ones
          # (e2e_safety_lock, e2e_safety_yarn_pnp) run via the
          # standard `test` job above on all three platforms, so no
          # matrix entry is needed for them. e2e_safety_pnpm below needs a
          # real pnpm and is #[ignore]-gated; e2e_safety_cargo_build runs in
          # every cargo-vex-matrix leg (ubuntu, macOS and Windows).
          - os: ubuntu-latest
            suite: e2e_safety_pnpm
          - os: macos-latest
            suite: e2e_safety_pnpm
          # pnpm-on-Windows uses junctions for symlinks and copies
          # (not hardlinks) by default, so the CoW invariant holds
          # vacuously. Test still runs to verify apply doesn't error
          # on Windows — semantic Windows nlink coverage is a
          # follow-up (`std::fs::Metadata` doesn't expose nlink on
          # Windows; needs `GetFileInformationByHandle` via
          # `windows-sys`).
          - os: windows-latest
            suite: e2e_safety_pnpm
          # Wall-bound real-package-manager redirect capstones (~150s and
          # ~70s of network installs + bootstrap resolutions — profile-
          # insensitive, measured identical in debug and release). They ran
          # inside the serial `test` job on every OS; #[ignore]-gated out of
          # it and relocated here so they still run on every PR and every
          # OS, but in parallel off the critical path. They use the runner's
          # default node/corepack, exactly as they did inside `test` — no
          # setup-node step, no version change.
          #
          # `npm_required` turns the npm suites' "npm not installed" soft-skip
          # into a hard failure, on every OS: the suite resolves npm through
          # PATHEXT, so Windows finds the `npm.cmd` shim instead of skipping.
          - os: ubuntu-latest
            suite: e2e_redirect_npm_build
            npm_required: '1'
          - os: macos-latest
            suite: e2e_redirect_npm_build
            npm_required: '1'
          - os: windows-latest
            suite: e2e_redirect_npm_build
            npm_required: '1'
          - os: ubuntu-latest
            suite: e2e_redirect_rush_sim
          - os: macos-latest
            suite: e2e_redirect_rush_sim
          - os: windows-latest
            suite: e2e_redirect_rush_sim
          # Hermetic real-bun capstones (wiremock patch service, real `bun
          # install`): hosted (`e2e_redirect_bun_build`), vendored
          # (`e2e_vendor_bun_build`) and the hosted⇄vendored takeover /
          # scoped-rollback suite (`mode_migration_bun`). They are NOT
          # `#[ignore]`-gated, so `test_filter: --include-ignored` is
          # mandatory — the job default `-- --ignored` would select zero
          # tests and pass vacuously (the e2e_composer trap above). The
          # runner images ship no bun, so without the `bun:` key below the
          # suites soft-skip; `bun:` installs that exact release via
          # setup-bun and exports SOCKET_PATCH_BUN_E2E_REQUIRED=1 (+ the
          # pinned version), under which the suites hard-fail instead of
          # skipping when bun is missing, the wrong version, or the fixture
          # install produces no text lock.
          #
          # Lock-era legs (ubuntu only): bun's text lock has three
          # grammars — lockfileVersion 0 (opt-in `--save-text-lockfile`,
          # 1.1.39–1.1.45; 2-tuple workspace entries), 1 (default from
          # 1.2.0 through 1.3.x) and 2 (1.4.0+). Registry 4-tuples are
          # identical across them but the workspace grammar, the lockb
          # migration recipe and tarball digest enforcement (URL/local
          # tarball sha512 checked only from 1.3.10) all differ, so the
          # latest release alone cannot prove the rewrite + fresh install
          # round-trip on the locks real projects commit. 1.1.45 = last v0
          # writer, 1.2.23 = v1, 1.3.14 = last pre-v2 default, 1.4.2 = v2.
          - os: ubuntu-latest
            suite: e2e_redirect_bun_build
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: macos-latest
            suite: e2e_redirect_bun_build
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: windows-latest
            suite: e2e_redirect_bun_build
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: ubuntu-latest
            suite: e2e_redirect_bun_build
            bun: '1.1.45'
            test_filter: --include-ignored
          - os: ubuntu-latest
            suite: e2e_redirect_bun_build
            bun: '1.2.23'
            test_filter: --include-ignored
          - os: ubuntu-latest
            suite: e2e_vendor_bun_build
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: macos-latest
            suite: e2e_vendor_bun_build
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: windows-latest
            suite: e2e_vendor_bun_build
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: ubuntu-latest
            suite: e2e_vendor_bun_build
            bun: '1.1.45'
            test_filter: --include-ignored
          - os: ubuntu-latest
            suite: e2e_vendor_bun_build
            bun: '1.2.23'
            test_filter: --include-ignored
          - os: ubuntu-latest
            suite: mode_migration_bun
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: macos-latest
            suite: mode_migration_bun
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: windows-latest
            suite: mode_migration_bun
            bun: '1.4.2'
            test_filter: --include-ignored
          - os: ubuntu-latest
            suite: mode_migration_bun
            bun: '1.3.14'
            test_filter: --include-ignored
          # Manifest-less VEX era legs: the last pre-v2 text-lock writer for
          # the hosted/vendored capstones, the v0/v1 writers for the takeover
          # suite, and the binary bun.lockb era (1.0 / 1.1 lines) through
          # e2e_bun_lockb, which reads the SOCKET_PATCH_BUN_LOCKB_* gates
          # exported for it below.
          - {os: ubuntu-latest, suite: e2e_redirect_bun_build, bun: '1.3.14', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_bun_build, bun: '1.3.14', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: mode_migration_bun, bun: '1.1.45', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: mode_migration_bun, bun: '1.2.23', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_bun_lockb, bun: '1.0.36', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_bun_lockb, bun: '1.1.45', test_filter: --include-ignored}
          # Bun >= 1.4 migrating a hosted workspace bun.lockb to bun.lock
          # (#803): the only binary-lock test whose reader must be 1.4+.
          - {os: ubuntu-latest, suite: e2e_bun_lockb, bun: '1.4.2', test_filter: --include-ignored workspace_text_migration_heals_on_rerun}
          # Real-vlt capstones (DESIGN §8.4): wiremock patch service and a local
          # npm registry fed from npmjs, driven by the pinned vlt release
          # (`node vlt.js`, installed below from a sha512-checked `npm pack`).
          # Every test is `#[ignore]`d and named `vlt_pinned_matrix_*`, so the
          # filter must be `--include-ignored vlt_pinned_matrix` (the job
          # default `--ignored` selects nothing). The run pipes through
          # scripts/check-vlt-legs.py, which fails on `0 passed` or any leg
          # line the manifest does not predict. The eras: A0 0.0.0-16, A
          # 0.0.0-32, B rc.12/rc.14 (rc.14 legs reach public npm), C rc.32,
          # D 1.0.4/1.0.7, E 1.1.1, F 1.2.0.
          - {os: ubuntu-latest, suite: e2e_redirect_vlt_build, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: macos-latest, suite: e2e_redirect_vlt_build, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: windows-latest, suite: e2e_redirect_vlt_build, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_redirect_vlt_build, vlt: '0.0.0-16', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_redirect_vlt_build, vlt: '0.0.0-32', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_redirect_vlt_build, vlt: '1.0.0-rc.14', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_redirect_vlt_build, vlt: '1.0.0-rc.32', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_redirect_vlt_build, vlt: '1.0.4', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_redirect_vlt_build, vlt: '1.1.1', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vendor_vlt_build, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: macos-latest, suite: e2e_vendor_vlt_build, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: windows-latest, suite: e2e_vendor_vlt_build, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vendor_vlt_build, vlt: '0.0.0-32', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vendor_vlt_build, vlt: '1.0.0-rc.14', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vendor_vlt_build, vlt: '1.0.0-rc.32', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vendor_vlt_build, vlt: '1.0.4', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: windows-latest, suite: e2e_vendor_vlt_build, vlt: '1.0.0-rc.14', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: mode_migration_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: macos-latest, suite: mode_migration_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: windows-latest, suite: mode_migration_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: mode_migration_vlt, vlt: '0.0.0-32', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: mode_migration_vlt, vlt: '1.0.0-rc.14', test_filter: --include-ignored vlt_pinned_matrix, vlt_upgrade: '1.2.0'}
          - {os: windows-latest, suite: mode_migration_vlt, vlt: '1.0.0-rc.14', test_filter: --include-ignored vlt_pinned_matrix}
          # Linux `auto` hardlinks from the global store; every OS gets the
          # explicit hardlink linker.
          - {os: ubuntu-latest, suite: e2e_safety_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_safety_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix, vlt_store_linker: 'hardlink'}
          - {os: macos-latest, suite: e2e_safety_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix, vlt_store_linker: 'hardlink'}
          - {os: windows-latest, suite: e2e_safety_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix, vlt_store_linker: 'hardlink'}
          # rc.12 gets the definite no-hook advisory; windows rc.14 runs the
          # legacy DepIDs on NTFS with pre-junction symlinks.
          - {os: ubuntu-latest, suite: e2e_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: macos-latest, suite: e2e_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: windows-latest, suite: e2e_vlt, vlt: '1.2.0', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vlt, vlt: '0.0.0-32', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vlt, vlt: '1.0.0-rc.12', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vlt, vlt: '1.0.0-rc.32', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: ubuntu-latest, suite: e2e_vlt, vlt: '1.0.7', test_filter: --include-ignored vlt_pinned_matrix}
          - {os: windows-latest, suite: e2e_vlt, vlt: '1.0.0-rc.14', test_filter: --include-ignored vlt_pinned_matrix}
          # The named corepack pnpm hosted legs (pnpm 7-11, get-uuid,
          # zero-touch, --trust-lockfile). `#[ignore]`d; the pinned matrix
          # inside the same suite runs in pnpm-compatibility.yml, hence the
          # skip. Node 24 (step below): the
          # corepack pnpm@10/11 legs require it.
          - {os: ubuntu-latest, suite: e2e_redirect_pnpm_build, test_filter: '--ignored --skip pnpm_pinned_matrix'}
          - {os: macos-latest, suite: e2e_redirect_pnpm_build, test_filter: '--ignored --skip pnpm_pinned_matrix'}
          - {os: windows-latest, suite: e2e_redirect_pnpm_build, test_filter: '--ignored --skip pnpm_pinned_matrix'}
          # Real-uv hosted/vendored capstones ending in manifest-less VEX:
          # the oldest and newest line + the 0.5.x boundary (0.5.4 still
          # re-resolves a transitive override / rejects a repointed
          # constraint under --locked; 0.5.5 keeps both). The other 0.N
          # lines and 0.5.3/0.5.6 are in e2e-full.
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.1.45'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.5.4'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.5.5'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.12.17'}
          - {os: macos-latest, suite: e2e_redirect_uv_build, uv: '0.12.17'}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.1.45', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.5.4', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.5.5', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.12.17', test_filter: --include-ignored}
          - {os: macos-latest, suite: e2e_vendor_pypi_build, uv: '0.12.17', test_filter: --include-ignored}
          # The Poetry / PDM / Hatch / Pipenv / pip / deno manifest-less VEX
          # capstones share ONE test binary (`e2e_vex_build`, a module per
          # tool — one optimized link in test-release instead of six), so
          # each leg's `test_filter` names its tool's module and keeps
          # `--ignored`.
          # Real-Poetry hosted + vendored capstones (#[ignore]-gated,
          # unix-only). One leg per major / lock format: 1.0 (lock 1.0),
          # 1.1 (lock 1.1), 1.8 (lock 2.0), 2.0 (first lock 2.1 writer),
          # current.
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'poetry:: --ignored', poetry: '1.0.10'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'poetry:: --ignored', poetry: '1.1.15'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'poetry:: --ignored', poetry: '1.8.5'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'poetry:: --ignored', poetry: '2.0.1'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'poetry:: --ignored', poetry: '2.4.3'}
          - {os: macos-latest, suite: e2e_vex_build, test_filter: 'poetry:: --ignored', poetry: '2.4.3'}
          # Real PDM / Hatch capstones (wiremock Socket API that also serves
          # the hosted wheel; PyPI for the tool bootstrap + six).
          # PDM: lock 2 (1.4), refused 3.1 (1.15) and 4.2 (2.7), 4.3 (2.8),
          # the hishel<1 bootstrap window (2.25) and current.
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pdm:: --ignored', pdm: '1.4.5'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pdm:: --ignored', pdm: '1.15.5'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pdm:: --ignored', pdm: '2.7.4'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pdm:: --ignored', pdm: '2.8.2'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pdm:: --ignored', pdm: '2.25.9'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pdm:: --ignored', pdm: '2.29.2'}
          - {os: macos-latest, suite: e2e_vex_build, test_filter: 'pdm:: --ignored', pdm: '2.29.2'}
          # Hatch: 1.0 (hatch.toml env vendoring refused, needs >= 1.2),
          # 1.2, the virtualenv<21 window (1.9, 1.14) and current.
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'hatch:: --ignored', hatch: '1.0.0'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'hatch:: --ignored', hatch: '1.2.1'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'hatch:: --ignored', hatch: '1.9.7'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'hatch:: --ignored', hatch: '1.14.2'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'hatch:: --ignored', hatch: '1.18.1'}
          - {os: macos-latest, suite: e2e_vex_build, test_filter: 'hatch:: --ignored', hatch: '1.18.1'}
          # Real Pipenv / pip capstones (mock patch server; the tools are
          # bootstrapped from PyPI). `pipenv:` / `pip:` hold one or more
          # space-separated releases the suite loops over. The middle
          # Pipenv releases are in e2e-full.
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pipenv:: --ignored', pipenv: '2022.12.19'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pipenv:: --ignored', pipenv: '2026.8.0'}
          - {os: macos-latest, suite: e2e_vex_build, test_filter: 'pipenv:: --ignored', pipenv: '2022.12.19 2026.8.0'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pip:: --ignored', pip: '22 23 24 25 26'}
          - {os: macos-latest, suite: e2e_vex_build, test_filter: 'pip:: --ignored', pip: '22 26'}
          # Real-Maven hosted + vendored capstones, one leg per Maven line:
          # 3.6 (pre http-blocker), 3.8 (resolver 1.6: no trusted checksums),
          # 3.9 (trusted checksums), 4.0 rc. Hosted also runs both sides of
          # the trusted-checksums floor: 3.9.3 (last release that ignores
          # the .mvn/checksums pin) and 3.9.4 (first that enforces it).
          - {os: ubuntu-latest, suite: e2e_redirect_maven_build, jvm_tool: maven, maven: '3.6.3'}
          - {os: ubuntu-latest, suite: e2e_redirect_maven_build, jvm_tool: maven, maven: '3.8.9'}
          - {os: ubuntu-latest, suite: e2e_redirect_maven_build, jvm_tool: maven, maven: '3.9.3'}
          - {os: ubuntu-latest, suite: e2e_redirect_maven_build, jvm_tool: maven, maven: '3.9.4'}
          - {os: ubuntu-latest, suite: e2e_redirect_maven_build, jvm_tool: maven, maven: '3.9.16'}
          - {os: ubuntu-latest, suite: e2e_redirect_maven_build, jvm_tool: maven, maven: '4.0.0-rc-6'}
          - {os: macos-latest, suite: e2e_redirect_maven_build, jvm_tool: maven, maven: '3.9.16'}
          - {os: ubuntu-latest, suite: e2e_vendor_maven_build, jvm_tool: maven, maven: '3.6.3'}
          - {os: ubuntu-latest, suite: e2e_vendor_maven_build, jvm_tool: maven, maven: '3.8.9'}
          - {os: ubuntu-latest, suite: e2e_vendor_maven_build, jvm_tool: maven, maven: '3.9.16'}
          - {os: ubuntu-latest, suite: e2e_vendor_maven_build, jvm_tool: maven, maven: '4.0.0-rc-6'}
          - {os: macos-latest, suite: e2e_vendor_maven_build, jvm_tool: maven, maven: '3.9.16'}
          - {os: ubuntu-latest, suite: e2e_vendor_jvm_build, jvm_tool: maven, maven: '3.6.3', test_filter: '--ignored maven_reactor'}
          - {os: ubuntu-latest, suite: e2e_vendor_jvm_build, jvm_tool: maven, maven: '3.8.9', test_filter: '--ignored maven_reactor'}
          - {os: ubuntu-latest, suite: e2e_vendor_jvm_build, jvm_tool: maven, maven: '3.9.2', test_filter: '--ignored maven_reactor'}
          - {os: ubuntu-latest, suite: e2e_vendor_jvm_build, jvm_tool: maven, maven: '3.9.16', test_filter: '--ignored maven_reactor'}
          - {os: ubuntu-latest, suite: e2e_vendor_jvm_build, jvm_tool: maven, maven: '4.0.0-rc-6', test_filter: '--ignored maven_reactor'}
          - {os: macos-latest, suite: e2e_vendor_jvm_build, jvm_tool: maven, maven: '3.9.16', test_filter: '--ignored maven_reactor'}
          - {os: windows-latest, suite: e2e_vendor_jvm_build, jvm_tool: maven, maven: '3.9.16', test_filter: '--ignored maven_reactor'}
          # Real-Gradle capstones, PR tier: one leg per Gradle line x {agent +
          # hosted, vendor + multi-project} on ubuntu, each on its line's LTS
          # JDK. Every other OS x line x mode cell (and the JDK-ceiling,
          # configuration-cache, Isolated Projects and real-Central rows) runs
          # in gradle-compatibility.yml. `suite` lists every binary the leg
          # runs (space-separated); the libtest filters select by the prefix
          # contract ci-e2e-bundle.py enforces. Every suite has landed, so no
          # row sets `allow_empty` (test_ci_gradle_prefixes.py keeps it that
          # way): a missing suite fails the leg, and every suite must run at
          # least one test on its own. Maven is installed only where a
          # selected test needs it (gradle_vendor_395's mixed root).
          - {os: ubuntu-latest, suite: 'e2e_gradle_discovery_build e2e_gradle_agent_build e2e_redirect_gradle_build', jvm_tool: gradle, gradle: '6.9.4', java: '11', test_filter: '--ignored gradle_agent_ gradle_hosted_'}
          - {os: ubuntu-latest, suite: 'e2e_vendor_gradle_build e2e_vendor_jvm_build', jvm_tool: gradle, gradle: '6.9.4', java: '11', test_filter: '--ignored gradle_vendor_ gradle_multi_project'}
          - {os: ubuntu-latest, suite: 'e2e_gradle_discovery_build e2e_gradle_agent_build e2e_redirect_gradle_build', jvm_tool: gradle, gradle: '7.6.6', java: '17', test_filter: '--ignored gradle_agent_ gradle_hosted_'}
          - {os: ubuntu-latest, suite: 'e2e_vendor_gradle_build e2e_vendor_jvm_build', jvm_tool: gradle, gradle: '7.6.6', java: '17', test_filter: '--ignored gradle_vendor_ gradle_multi_project'}
          - {os: ubuntu-latest, suite: 'e2e_gradle_discovery_build e2e_gradle_agent_build e2e_redirect_gradle_build', jvm_tool: gradle, gradle: '8.14.3', java: '21', test_filter: '--ignored gradle_agent_ gradle_hosted_'}
          - {os: ubuntu-latest, suite: 'e2e_vendor_gradle_build e2e_vendor_jvm_build', jvm_tool: gradle, gradle: '8.14.3', java: '21', test_filter: '--ignored gradle_vendor_ gradle_multi_project'}
          - {os: ubuntu-latest, suite: 'e2e_gradle_discovery_build e2e_gradle_agent_build e2e_redirect_gradle_build', jvm_tool: gradle, gradle: '9.8.0', java: '21', test_filter: '--ignored gradle_agent_ gradle_hosted_'}
          - {os: ubuntu-latest, suite: 'e2e_vendor_gradle_build e2e_vendor_jvm_build', jvm_tool: gradle, gradle: '9.8.0', java: '21', test_filter: '--ignored gradle_vendor_ gradle_multi_project'}
          - {os: windows-latest, suite: e2e_vendor_jvm_build, jvm_tool: gradle, gradle: '8.14.3', java: '17', test_filter: '--ignored gradle_multi_project'}
          # Real-sbt hosted (socket-patch.sbt) + vendored
          # (socket-patch-vendor.sbt) capstones on the current 1.x line. The
          # other sbt lines, JDK 21, the agent cells beyond coverage-docker's,
          # Mill, scala-cli and macOS / Windows are sbt-compatibility.yml.
          - {os: ubuntu-latest, suite: e2e_sbt_build, jvm_tool: sbt, sbt: '1.13.0', test_filter: '--ignored --test-threads=1'}
          - {os: ubuntu-latest, suite: e2e_sbt_vendor_build, jvm_tool: sbt, sbt: '1.13.0', test_filter: '--ignored --test-threads=1'}
          # Real .NET SDK capstones: hosted + vendored nuget, one leg per SDK
          # major (the suite pins the major through a sandbox global.json):
          # the oldest and newest here, 7-9 on ubuntu in e2e-full.
          - {os: ubuntu-latest, suite: e2e_nuget_dotnet_build, dotnet: '6'}
          - {os: ubuntu-latest, suite: e2e_nuget_dotnet_build, dotnet: '10'}
          - {os: macos-latest, suite: e2e_nuget_dotnet_build, dotnet: '8'}
          # Real deno negative capstone (no hosted/vendored wiring exists for
          # deno; VEX must attest nothing), one leg per major.
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'deno:: --ignored', deno: '1.46.3'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'deno:: --ignored', deno: '2.9.7'}
    runs-on: ${{ matrix.os }}
    # The real-toolchain capstones loop several releases per leg (pip,
    # pipenv) or bootstrap a tool from PyPI before the suite (poetry, pdm,
    # hatch), hence more than the 25 minutes the older legs needed.
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    # e2e-full runs these same steps over its rows.
    steps: &e2e-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the e2e binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-bin-${{ matrix.os }}*
          merge-multiple: true
          path: target/e2e-bin

      - name: Stage the CLI where the test binaries expect it
        # `CARGO_BIN_EXE_socket-patch` was baked in at compile time as
        # <checkout>/target/debug/socket-patch; CARGO_TARGET_TMPDIR likewise.
        shell: bash
        run: |
          set -euo pipefail
          exe=''
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          chmod +x target/e2e-bin/* || true
          mkdir -p target/debug target/tmp
          cp "target/e2e-bin/socket-patch$exe" "target/debug/socket-patch$exe"

      - name: Setup Node.js
        if: matrix.suite == 'e2e_npm' || matrix.suite == 'e2e_scan' || matrix.suite == 'e2e_safety_pnpm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Setup pnpm
        if: matrix.suite == 'e2e_safety_pnpm'
        # Pin the major version so the store layout the test
        # asserts on stays stable. `npm install -g` is the simplest
        # cross-platform install path (works on ubuntu, macos,
        # windows-runners — they all ship a usable npm via
        # actions/setup-node).
        run: npm install -g pnpm@10

      - name: Setup Node.js 24 (named pnpm legs)
        if: matrix.suite == 'e2e_redirect_pnpm_build'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'

      - name: Setup Python
        if: matrix.suite == 'e2e_pypi' || matrix.uv != '' || matrix.poetry != '' || matrix.pdm != '' || matrix.hatch != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.x'

      - name: Setup uv (uv legs)
        if: matrix.uv != ''
        # The exact uv release the leg pins; the suites assert it through
        # SOCKET_PATCH_UV_E2E_VERSION.
        shell: bash
        env:
          UV_TEST_VERSION: ${{ matrix.uv }}
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip "uv==$UV_TEST_VERSION"
          uv --version

      - name: Install uv (PDM / Hatch legs)
        if: matrix.pdm != '' || matrix.hatch != ''
        # The suites bootstrap the pinned PDM / Hatch into their own venv
        # with uv; this uv is tooling, not the release under test.
        run: python -m pip install uv==0.11.19

      - name: Install pinned Poetry
        if: matrix.poetry != ''
        # Poetry 1.0/1.1 need Python 3.8 (their vendored deps predate 3.12);
        # 1.2.2 needs the cleo pre-release it was published against. pip 24.0
        # seeds the tool venv (Poetry 1.0 + pip 22.3-23.0 misread the lock-1.0
        # `#sha256=` fragment, as the CLI's advisory says).
        shell: bash
        env:
          POETRY_TEST_VERSION: ${{ matrix.poetry }}
        run: |
          python -m pip install uv==0.11.19
          case "$POETRY_TEST_VERSION" in 1.0.*|1.1.*) py=3.8.20 ;; *) py=3.12 ;; esac
          uv venv "$RUNNER_TEMP/poetry" --python "$py"
          extra=""; [ "$POETRY_TEST_VERSION" = "1.2.2" ] && extra="cleo==1.0.0a5"
          uv pip install --python "$RUNNER_TEMP/poetry/bin/python" "poetry==$POETRY_TEST_VERSION" pip==24.0 setuptools==69.5.1 $extra
          echo "SOCKET_PATCH_POETRY_BIN=$RUNNER_TEMP/poetry/bin/poetry" >> "$GITHUB_ENV"

      - name: Setup uv (Pipenv / pip legs)
        if: matrix.pipenv != '' || matrix.pip != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install the Pythons the Pipenv / pip legs run on
        if: matrix.pipenv != '' || matrix.pip != ''
        run: uv python install 3.8 3.11 3.12

      - name: Setup Ruby
        if: matrix.suite == 'e2e_gem' || matrix.bundler != ''
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1.295.0
        with:
          # setup-ruby does NOT support `3.2.x` wildcard pinning the
          # way setup-python does — it errors with "Unknown version
          # 3.2.x for ruby on ubuntu-24.04". Pin to an exact patch
          # that's currently in the catalog. If the action drops this
          # patch in the future, bump to whatever's available — see
          # https://github.com/ruby/setup-ruby for the supported list.
          # Bundler-era legs pin their own Ruby (`ruby:`): bundler <= 2.2
          # needs Ruby <= 3.3 and 1.17-2.1 need Ruby <= 3.1 (`untaint`).
          ruby-version: ${{ matrix.ruby || '3.2.10' }}
          # The legs pin their bundler (`bundler:`) so a capstone never rides
          # whatever bundler the runner's Ruby ships; bundler 1.x is not
          # installable through setup-ruby, see the next steps. e2e_gem keeps
          # the 2.5 floor.
          bundler: ${{ startsWith(matrix.bundler, '1.') && 'none' || matrix.bundler || '2.5' }}
          bundler-cache: false

      - name: Install Bundler 1.x
        if: startsWith(matrix.bundler, '1.')
        shell: bash
        env:
          BUNDLER_TEST_VERSION: ${{ matrix.bundler }}
        run: gem install bundler -v "$BUNDLER_TEST_VERSION" --no-document

      # Installing a bundler does not make `bundle` run it: with no lockfile
      # to read, RubyGems' binstub activates the HIGHEST installed bundler,
      # so a leg pinned BELOW its Ruby's default gem (2.1.4 / 2.2.33 on Ruby
      # 3.1, whose default is 2.3.27) silently runs the default instead and
      # tests/common/bundler_e2e.rs rightly panics. BUNDLER_VERSION makes
      # the binstub select exactly the pinned release in every process (and
      # turns off bundler >= 2.3's lockfile-driven self-switch), the same
      # knob tests/docker/Dockerfile.gem-b1 sets.
      - name: Select the pinned Bundler
        if: matrix.bundler != ''
        shell: bash
        env:
          BUNDLER_TEST_VERSION: ${{ matrix.bundler }}
        run: |
          echo "BUNDLER_VERSION=$BUNDLER_TEST_VERSION" >> "$GITHUB_ENV"
          BUNDLER_VERSION="$BUNDLER_TEST_VERSION" bundle --version

      - name: Setup PHP
        if: matrix.composer != ''
        # The composer capstones shell out to a real composer; `composer:`
        # pins the release line (1, 2.2 LTS, 2) so the composer.lock grammar
        # the edits assert stays stable across runners.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          tools: composer:${{ matrix.composer }}

      - name: Select the JVM toolchain (JVM legs)
        id: jvm
        if: matrix.jvm_tool != ''
        # `jvm_tool` (gradle | maven | sbt) marks a JVM leg. The JDK comes
        # from the runner image (JAVA_HOME_<N>_X64 / _arm64: 8, 11, 17 and 21
        # on every hosted OS) when it has the pinned feature release, else
        # from setup-java below. Maven is needed by the Maven legs and by the
        # Gradle legs whose filter selects gradle_vendor_* (gradle_vendor_395
        # builds the mixed root's pom with it). The multi-project capstone
        # reads the Gradle cache and the agent / hosted Gradle legs run
        # without Maven, so the windows multi-project row proves both.
        shell: bash
        env:
          JVM_TOOL: ${{ matrix.jvm_tool }}
          JAVA_FEATURE: ${{ matrix.java || '17' }}
          TEST_FILTER: ${{ matrix.test_filter }}
        run: |
          set -euo pipefail
          home=''
          for arch in X64 arm64 ARM64; do
            var="JAVA_HOME_${JAVA_FEATURE}_${arch}"
            if [ -n "${!var:-}" ]; then home="${!var}"; break; fi
          done
          if [ -n "$home" ]; then
            bin="$home/bin"
            if [ "$RUNNER_OS" = Windows ]; then bin="$home\\bin"; fi
            echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
            echo "$bin" >> "$GITHUB_PATH"
            echo "runner-jdk=true" >> "$GITHUB_OUTPUT"
            echo "JDK $JAVA_FEATURE from the runner image: $home"
          else
            echo "runner-jdk=false" >> "$GITHUB_OUTPUT"
          fi
          maven=false
          case "$JVM_TOOL" in
            maven) maven=true ;;
            gradle) case " $TEST_FILTER " in *gradle_vendor_*) maven=true ;; esac ;;
          esac
          echo "maven=$maven" >> "$GITHUB_OUTPUT"

      - name: Setup Java (JDK not on the runner image)
        if: matrix.jvm_tool != '' && steps.jvm.outputs.runner-jdk != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java || '17' }}

      - name: Setup sbt (sbt legs)
        if: matrix.sbt != ''
        # The sbt launcher script; it boots whatever `sbt.version` each
        # fixture's project/build.properties pins.
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
        with:
          sbt-runner-version: 1.13.0
          disk-cache: false

      - name: Warm the sbt seed (sbt legs)
        if: matrix.sbt != ''
        # Boots the pinned sbt once into a seed the suites hard-link into
        # each test's private caches (SOCKET_PATCH_SBT_E2E_SEED), and names
        # the launcher (SOCKET_PATCH_SBT_E2E_SBT).
        shell: bash
        env:
          SBT_TEST_VERSION: ${{ matrix.sbt }}
        run: scripts/sbt-warm-seed.sh "$SBT_TEST_VERSION" "$RUNNER_TEMP/sbt-seed" >> "$GITHUB_ENV"

      - name: Install Maven ${{ matrix.maven || '3.9.16' }}
        if: steps.jvm.outputs.maven == 'true'
        # Straight from the Apache archive (sha512-verified), so a leg gets
        # exactly the release it names rather than the runner's Maven.
        # --ssl-revoke-best-effort: see the `test` job's vexctl step.
        shell: bash
        env:
          MAVEN_VERSION: ${{ matrix.maven || '3.9.16' }}
        run: |
          major="${MAVEN_VERSION%%.*}"
          url="https://archive.apache.org/dist/maven/maven-${major}/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort "$url" -o "$RUNNER_TEMP/maven.tgz"
          curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort "$url.sha512" -o "$RUNNER_TEMP/maven.sha512"
          python -c 'import hashlib, pathlib, os; p=pathlib.Path(os.environ["RUNNER_TEMP"]); assert hashlib.sha512((p/"maven.tgz").read_bytes()).hexdigest() == (p/"maven.sha512").read_text().split()[0]'
          # Python accepts native Windows paths for both archive and destination.
          python -m tarfile -e "$RUNNER_TEMP/maven.tgz" "$RUNNER_TEMP"
          launcher="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn"
          if [ "$RUNNER_OS" = Windows ]; then launcher="${launcher}.cmd"; fi
          echo "SOCKET_PATCH_MAVEN_E2E_MVN=$launcher" >> "$GITHUB_ENV"

      - name: Install Gradle ${{ matrix.gradle }}
        if: matrix.gradle != ''
        shell: bash
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
        run: |
          url="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort "$url" -o "$RUNNER_TEMP/gradle.zip"
          curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort "$url.sha256" -o "$RUNNER_TEMP/gradle.sha256"
          python -c 'import hashlib, pathlib, os; p=pathlib.Path(os.environ["RUNNER_TEMP"]); assert hashlib.sha256((p/"gradle.zip").read_bytes()).hexdigest() == (p/"gradle.sha256").read_text().strip()'
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          launcher="$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle"
          if [ "$RUNNER_OS" = Windows ]; then launcher="${launcher}.bat"; fi
          echo "SOCKET_PATCH_GRADLE_E2E_GRADLE=$launcher" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        if: matrix.dotnet != ''
        # Installs next to the runner's preinstalled SDKs; the suite writes
        # its own global.json to select the pinned major.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.0.x

      - name: Setup Deno
        if: matrix.deno != ''
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}

      - name: Setup Bun
        if: matrix.bun != ''
        # Installs the exact bun release the leg pins (setup-bun resolves a
        # strict semver straight to the `bun-v<ver>` GitHub release, so the
        # lock-era legs get the historical writer, not `latest`). Works on
        # all three runner OSes (windows → bun-windows-x64.zip / bun.exe).
        # SHA resolved from `gh api repos/oven-sh/setup-bun/git/ref/tags/v2.2.0`.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Setup Node.js 24 (vlt legs)
        if: matrix.vlt != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'

      - name: Setup vlt
        if: matrix.vlt != ''
        # The pinned release (and, for the upgrade legs, the second vlt):
        # `npm pack`, sha512 against the registry and the committed pin, then
        # a prefix install run as `node vlt.js`. The store-linker knob is a
        # harness variable because the harness scrubs ambient VLT_*.
        shell: bash
        env:
          VLT_TEST_VERSION: ${{ matrix.vlt }}
          VLT_TEST_UPGRADE: ${{ matrix.vlt_upgrade }}
          VLT_TEST_STORE_LINKER: ${{ matrix.vlt_store_linker }}
        run: |
          set -euo pipefail
          js=$(scripts/install-vlt.sh "$VLT_TEST_VERSION" "$RUNNER_TEMP/vlt-tool")
          {
            echo "SOCKET_PATCH_VLT_E2E_JS=$js"
            echo "SOCKET_PATCH_VLT_E2E_VERSION=$VLT_TEST_VERSION"
            echo "SOCKET_PATCH_VLT_E2E_REQUIRED=1"
            echo "LANG=C"
            echo "LC_ALL=C"
          } >> "$GITHUB_ENV"
          if [ -n "$VLT_TEST_STORE_LINKER" ]; then
            echo "SOCKET_PATCH_VLT_E2E_STORE_LINKER=$VLT_TEST_STORE_LINKER" >> "$GITHUB_ENV"
          fi
          if [ -n "$VLT_TEST_UPGRADE" ]; then
            up=$(scripts/install-vlt.sh "$VLT_TEST_UPGRADE" "$RUNNER_TEMP/vlt-upgrade")
            echo "SOCKET_PATCH_VLT_E2E_UPGRADE_JS=$up" >> "$GITHUB_ENV"
            echo "SOCKET_PATCH_VLT_E2E_UPGRADE_VERSION=$VLT_TEST_UPGRADE" >> "$GITHUB_ENV"
          fi
          node --version

      - name: Run e2e tests
        if: matrix.vlt == ''
        # Suites are `#[ignore]`-gated out of the unpinned `test` job by
        # default, hence `--ignored`; an entry that sets `test_filter`
        # overrides the selector for itself only.
        env:
          # Bun legs only: turn the bun suites' "bun not installed / no text
          # lock" soft-skips into hard failures and make them assert the
          # pinned release, so a leg can never report green on an
          # unexercised toolchain. Both are the EMPTY string on non-bun legs,
          # which the suites treat as unset.
          SOCKET_PATCH_BUN_E2E_REQUIRED: ${{ matrix.bun != '' && '1' || '' }}
          SOCKET_PATCH_BUN_E2E_VERSION: ${{ matrix.bun }}
          # e2e_bun_lockb only. SOCKET_PATCH_BUN_LOCKB_VERSION is checked with
          # `var().is_ok()`, so it must stay EMPTY on every other leg.
          SOCKET_PATCH_BUN_LOCKB_REQUIRED: ${{ matrix.suite == 'e2e_bun_lockb' && '1' || '' }}
          SOCKET_PATCH_BUN_LOCKB_VERSION: ${{ matrix.suite == 'e2e_bun_lockb' && matrix.bun || '' }}
          SOCKET_PATCH_BUN_LOCKB_EXTENDED: ${{ matrix.suite == 'e2e_bun_lockb' && '1' || '' }}
          SOCKET_PATCH_BUN_LOCKB_PRODUCTION: ${{ matrix.suite == 'e2e_bun_lockb' && '1' || '' }}
          # The same fail-instead-of-skip + pinned-release gates for every
          # other real-toolchain capstone. All EMPTY on legs that do not set
          # the matching matrix key, which the suites treat as unset.
          SOCKET_PATCH_NPM_E2E_REQUIRED: ${{ matrix.npm_required || '' }}
          SOCKET_PATCH_CARGO_E2E_REQUIRED: ${{ matrix.suite == 'e2e_safety_cargo_build' && '1' || '' }}
          SOCKET_PATCH_UV_E2E_REQUIRED: ${{ matrix.uv != '' && '1' || '' }}
          SOCKET_PATCH_UV_E2E_VERSION: ${{ matrix.uv }}
          SOCKET_PATCH_POETRY_E2E_REQUIRED: ${{ matrix.poetry != '' && '1' || '' }}
          SOCKET_PATCH_POETRY_E2E_VERSION: ${{ matrix.poetry }}
          SOCKET_PATCH_PDM_E2E_REQUIRED: ${{ matrix.pdm != '' && '1' || '' }}
          SOCKET_PATCH_PDM_E2E_VERSION: ${{ matrix.pdm }}
          SOCKET_PATCH_HATCH_E2E_REQUIRED: ${{ matrix.hatch != '' && '1' || '' }}
          SOCKET_PATCH_HATCH_E2E_VERSION: ${{ matrix.hatch }}
          SOCKET_PATCH_PIPENV_E2E_REQUIRED: ${{ matrix.pipenv != '' && '1' || '' }}
          SOCKET_PATCH_PIPENV_E2E_VERSIONS: ${{ matrix.pipenv }}
          SOCKET_PATCH_PIP_E2E_REQUIRED: ${{ matrix.pip != '' && '1' || '' }}
          SOCKET_PATCH_PIP_E2E_VERSIONS: ${{ matrix.pip }}
          SOCKET_PATCH_BUNDLER_E2E_REQUIRED: ${{ matrix.bundler != '' && '1' || '' }}
          SOCKET_PATCH_BUNDLER_E2E_VERSION: ${{ matrix.bundler }}
          SOCKET_PATCH_COMPOSER_E2E_REQUIRED: ${{ matrix.composer != '' && '1' || '' }}
          SOCKET_PATCH_COMPOSER_E2E_VERSION: ${{ matrix.composer }}
          SOCKET_PATCH_MAVEN_E2E_REQUIRED: ${{ steps.jvm.outputs.maven == 'true' && '1' || '' }}
          SOCKET_PATCH_MAVEN_E2E_VERSION: ${{ steps.jvm.outputs.maven == 'true' && (matrix.maven || '3.9.16') || '' }}
          SOCKET_PATCH_GRADLE_E2E_REQUIRED: ${{ matrix.gradle != '' && '1' || '' }}
          SOCKET_PATCH_GRADLE_E2E_VERSION: ${{ matrix.gradle }}
          SOCKET_PATCH_GRADLE_E2E_PROBE_DIR: ${{ matrix.gradle != '' && format('{0}/target/gradle-probe', github.workspace) || '' }}
          SOCKET_PATCH_DOTNET_E2E_REQUIRED: ${{ matrix.dotnet != '' && '1' || '' }}
          SOCKET_PATCH_DOTNET_E2E_VERSION: ${{ matrix.dotnet }}
          SOCKET_PATCH_DENO_E2E_REQUIRED: ${{ matrix.deno != '' && '1' || '' }}
          SOCKET_PATCH_DENO_E2E_VERSION: ${{ matrix.deno }}
          SOCKET_PATCH_SBT_E2E_REQUIRED: ${{ matrix.sbt != '' && '1' || '' }}
          SOCKET_PATCH_SBT_E2E_VERSION: ${{ matrix.sbt }}
          E2E_SUITE: ${{ matrix.suite }}
          E2E_TEST_FILTER: ${{ matrix.test_filter || '--ignored' }}
          E2E_ALLOW_EMPTY: ${{ matrix.allow_empty }}
        shell: bash
        # Runs from the package root with CARGO_MANIFEST_DIR set, as
        # `cargo test` would. `suite` may name several binaries; an
        # `allow_empty` row skips the ones whose test file has not landed.
        # Every suite a leg runs must run at least one test (per suite, so
        # one suite's tests never hide another's empty filter): a renamed
        # module, a dropped `#[ignore]` under the default `--ignored`
        # selector or a stale `test_filter` would otherwise pass as 0/0.
        run: |
          set -uo pipefail
          exe=''
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cd crates/socket-patch-cli
          export CARGO_MANIFEST_DIR="$PWD"
          status=0
          for suite in $E2E_SUITE; do
            if [ "$E2E_ALLOW_EMPTY" = true ] && [ ! -f "tests/$suite.rs" ] && [ ! -f "tests/$suite/main.rs" ]; then
              echo "::notice::$suite has not landed yet; skipped (allow_empty)"
              continue
            fi
            log="../../target/e2e-$suite.log"
            # shellcheck disable=SC2086 # the filter is several libtest arguments
            if ! "../../target/e2e-bin/$suite$exe" $E2E_TEST_FILTER 2>&1 | tee "$log"; then
              status=1
              continue
            fi
            passed=$(sed -n 's/^test result: .* \([0-9][0-9]*\) passed;.*/\1/p' "$log" | head -n 1)
            if [ "${passed:-0}" = 0 ]; then
              echo "::error::$suite ran no test in this leg (filter: $E2E_TEST_FILTER). Fix the row's suite or test_filter so it selects the tests it is meant to run."
              status=1
            fi
          done
          exit "$status"

      - name: Upload the Gradle probe reports
        if: always() && matrix.gradle != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: gradle-probe-pr-${{ matrix.os }}-${{ matrix.gradle }}-${{ strategy.job-index }}
          path: target/gradle-probe/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run vlt e2e tests
        if: matrix.vlt != ''
        # One capstone binary per row, through the leg checker: it fails on
        # `0 passed`, a crashed binary, a missing `ran`, an unexpected skip or
        # an unknown leg (crates/socket-patch-cli/tests/vlt-leg-manifest.json).
        shell: bash
        env:
          SOCKET_PATCH_VLT_E2E_REQUIRED: ${{ matrix.vlt != '' && '1' || '' }}
          VLT_SUITE: ${{ matrix.suite }}
          VLT_TEST_FILTER: ${{ matrix.test_filter }}
        run: |
          set -uo pipefail
          status=0
          exe=''
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          (
            cd crates/socket-patch-cli
            export CARGO_MANIFEST_DIR="$PWD"
            # shellcheck disable=SC2086 # the filter is several libtest arguments
            "../../target/e2e-bin/$VLT_SUITE$exe" $VLT_TEST_FILTER
          ) 2>&1 | tee vlt-leg.log || status=1
          py=$(command -v python3 || command -v python)
          # No cargo `Running` line when the binary runs directly: name it.
          "$py" scripts/check-vlt-legs.py --binary "$VLT_SUITE" --manifest crates/socket-patch-cli/tests/vlt-leg-manifest.json vlt-leg.log || status=1
          exit "$status"

  # The PM-version legs with no boundary of their own: the middle uv lines,
  # Pipenv releases and .NET SDK majors, and bundler 2.7. Skipped
  # on pull_request (the `e2e` rows keep every named boundary, the oldest
  # and newest release of each tool and every vlt era there); main pushes,
  # v5 landings, the nightly schedule and dispatch run them with the `e2e`
  # steps.
  e2e-full:
    if: github.event_name != 'pull_request' || github.head_ref == 'release/v5-prerelease'
    needs: [test, coverage, e2e-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, suite: e2e_redirect_gem_build, ruby: '3.3', bundler: '2.7.2'}
          - {os: ubuntu-latest, suite: e2e_vendor_gem_build, ruby: '3.3', bundler: '2.7.2'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.2.37'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.3.5'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.4.30'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.5.3'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.5.6'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.6.17'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.7.22'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.8.24'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.9.30'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.10.12'}
          - {os: ubuntu-latest, suite: e2e_redirect_uv_build, uv: '0.11.33'}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.2.37', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.3.5', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.4.30', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.5.3', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.5.6', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.6.17', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.7.22', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.8.24', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.9.30', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.10.12', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vendor_pypi_build, uv: '0.11.33', test_filter: --include-ignored}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pipenv:: --ignored', pipenv: '2023.12.1'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pipenv:: --ignored', pipenv: '2024.4.1'}
          - {os: ubuntu-latest, suite: e2e_vex_build, test_filter: 'pipenv:: --ignored', pipenv: '2025.1.3'}
          - {os: ubuntu-latest, suite: e2e_nuget_dotnet_build, dotnet: '7'}
          - {os: ubuntu-latest, suite: e2e_nuget_dotnet_build, dotnet: '8'}
          - {os: ubuntu-latest, suite: e2e_nuget_dotnet_build, dotnet: '9'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    steps: *e2e-steps

  # ----------------------------------------------------------------------
  # Docker-driven real-package e2e suite.
  #
  # For each ecosystem, builds the shared base image (multi-stage:
  # Rust → debian + compiled socket-patch) and the per-ecosystem layer,
  # then runs the matching `docker_e2e_<eco>` test binary inside the
  # repo's checkout. Tests install real packages via real package
  # managers and run socket-patch against a wiremock-served fixture —
  # no real Socket API contact. Hermetic, reproducible.
  #
  # Nightly, on dispatch and on v5 landings only: coverage-docker runs these
  # suites on each push (with an instrumented binary mounted in); this job
  # is the one run of them against the base image's full-LTO release
  # binary. The `e2e` job above runs the `#[ignore]`-gated real-toolchain
  # capstones; the live-API smoke suites are run by hand (see the note in
  # its matrix).
  # ----------------------------------------------------------------------
  e2e-docker:
    # The v5 branch has no nightly of its own, so its landings (the
    # pull_request runs of its PR into main) run it too.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.head_ref == 'release/v5-prerelease'
    needs: docker-base
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.ecosystem == 'sbt' && 45 || 35 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [npm, pypi, gem, cargo, golang, maven, composer, nuget, deno, sbt]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # `driver: docker` — see the coverage-docker matching step above
        # for the rationale (the per-ecosystem image's `FROM
        # socket-patch-test-base:latest` only resolves when buildx talks
        # directly to the host docker daemon).
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - name: Install Rust
        run: rustup show

      # No `actions/cache` here intentionally. This job builds Docker
      # images and would be flagged by zizmor's cache-poisoning audit.

      - name: Download base image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-base-image*
          merge-multiple: true
          path: docker-base

      - name: Load base image
        run: docker load --input docker-base/socket-patch-test-base.tar

      - name: Build ${{ matrix.ecosystem }} image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: tests/docker/Dockerfile.${{ matrix.ecosystem }}
          tags: socket-patch-test-${{ matrix.ecosystem }}:latest
          load: true

      - name: Run ${{ matrix.ecosystem }} Docker e2e test
        # Every ecosystem is unconditionally compiled in; only the
        # `docker-e2e` feature is needed to compile the suite itself.
        # The composer/nuget/pypi vendored build-proof capstones (each
        # ending in the manifest-less VEX stage) ride the same image as
        # their ecosystem's main suite; the gem and maven vendor capstones
        # run only in coverage-docker.
        run: |
          EXTRA=""
          FILTER=""
          case "${{ matrix.ecosystem }}" in
            composer) EXTRA="--test docker_e2e_vendor_composer" ;;
            nuget)    EXTRA="--test docker_e2e_vendor_nuget" ;;
            pypi)     EXTRA="--test docker_e2e_vendor_pypi_pm" ;;
            # Every sbt / Mill / scala-cli agent cell (the full sbt version
            # x mode matrix is sbt-compatibility.yml).
            sbt)
              export SOCKET_PATCH_SBT_DOCKER_VERSIONS="1.2.8 1.13.0"
              export SOCKET_PATCH_DOCKER_E2E_REQUIRED=1
              FILTER="--test-threads=1" ;;
          esac
          # shellcheck disable=SC2086 # EXTRA and FILTER are intentionally word-split
          cargo test -p socket-patch-cli --features docker-e2e --test "docker_e2e_${{ matrix.ecosystem }}" $EXTRA -- $FILTER

  # ----------------------------------------------------------------------
  # Per-release real-toolchain matrices for the manifest-less VEX work that
  # loop several suites per release through a script (yarn) or need a
  # toolchain + lock-format axis (cargo). Each leg hard-fails on a skip.
  # ----------------------------------------------------------------------
  yarn-classic-matrix:
    name: yarn-classic ${{ matrix.release }}
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 1.0.2 oldest 1.x; 1.6.0 last that installs nothing for a `file:`
        # tarball; 1.7.0 first vendored-capable; 1.9.4 last without the
        # `integrity` line; 1.10.1 first with it; 1.22.22 current.
        release: ['1.0.2', '1.6.0', '1.7.0', '1.9.4', '1.10.1', '1.22.22']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: yarn-classic-${{ matrix.release }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Manifest-less VEX over every real yarn classic flow
        # The script exports SOCKET_PATCH_YARN_E2E_REQUIRED=1 and
        # SOCKET_PATCH_YARN_CLASSIC_E2E_VERSION itself.
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          YARN_CLASSIC_RELEASE: ${{ matrix.release }}
        run: scripts/yarn-classic-vex-matrix.sh "$YARN_CLASSIC_RELEASE"

  yarn-berry-e2e:
    name: yarn-berry ${{ matrix.yarn }} (${{ matrix.os }})
    needs: [test, coverage]
    strategy:
      fail-fast: false
      matrix:
        # 4.0.2 bare-hex checksum writer (4.0.0-4.0.2), 4.1.0 first
        # `10c0/` writer, current, and 4.12.0 on macOS / Windows. The rest
        # of the spread (4.6.0, 4.12.0 on ubuntu) is yarn-berry-full.
        include:
          - {os: ubuntu-latest, yarn: '4.0.2'}
          - {os: ubuntu-latest, yarn: '4.1.0'}
          - {os: ubuntu-latest, yarn: '4.18.0'}
          - {os: macos-latest, yarn: '4.12.0'}
          - {os: windows-latest, yarn: '4.12.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: &yarn-berry-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: yarn-berry-${{ matrix.yarn }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable corepack
        run: corepack enable
      - name: Yarn berry hosted/vendored + manifest-less VEX
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          SOCKET_PATCH_YARN_E2E_REQUIRED: '1' # the script also exports it
          YARN_BERRY_RELEASE: ${{ matrix.yarn }}
        run: scripts/yarn-berry-vex-matrix.sh "$YARN_BERRY_RELEASE"

  # Skipped on pull_request (except v5 landings), like e2e-full.
  yarn-berry-full:
    name: yarn-berry ${{ matrix.yarn }} (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.head_ref == 'release/v5-prerelease'
    needs: [test, coverage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, yarn: '4.6.0'}
          - {os: ubuntu-latest, yarn: '4.12.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: *yarn-berry-steps

  # Every toolchain and every lock re-encoding at least once on PRs (the
  # toolchain's own lock is re-encoded as v1-v4 before socket-patch touches
  # it, the committed-lockfile case; '' keeps the toolchain's own format),
  # plus macOS and Windows; 1.93.1 with its own lock (on every OS) is the
  # pinned rust-toolchain.toml cell `cargo test` used to give
  # e2e_safety_cargo_build. cargo-vex-matrix-full runs the rest of the
  # toolchain x lock cross off pull_request. Each leg also runs
  # e2e_safety_cargo_build (its headline test honours the knobs).
  cargo-vex-matrix:
    name: cargo ${{ matrix.toolchain }} lock-v${{ matrix.lock || 'own' }} (${{ matrix.os }})
    needs: [test, coverage, e2e-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: ''}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '1'}
          - {os: ubuntu-latest, toolchain: stable, lock: '2'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '3'}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '4'}
          - {os: macos-latest, toolchain: stable, lock: '1'}
          - {os: windows-latest, toolchain: stable, lock: '1'}
          - {os: macos-latest, toolchain: '1.93.1', lock: ''}
          - {os: windows-latest, toolchain: '1.93.1', lock: ''}
    steps: &cargo-vex-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the e2e binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-bin-${{ matrix.os }}*
          merge-multiple: true
          path: target/e2e-bin
      - name: Install Rust
        run: rustup show
      - name: Install the cargo under test
        # bash, not the Windows default pwsh: in PowerShell
        # "$CARGO_TEST_TOOLCHAIN" is an (unset) PowerShell variable, so the
        # windows-latest leg ran `rustup toolchain install ""`.
        shell: bash
        env:
          CARGO_TEST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$CARGO_TEST_TOOLCHAIN" --profile minimal
      - name: Real-cargo hosted/vendored + manifest-less VEX
        # The e2e-build binaries, run from the package root as `cargo test`
        # would (see the e2e job's staging step).
        shell: bash
        env:
          SOCKET_PATCH_CARGO_E2E_REQUIRED: '1'
          SOCKET_PATCH_CARGO_E2E_TOOLCHAIN: ${{ matrix.toolchain }}
          SOCKET_PATCH_CARGO_E2E_LOCK_VERSION: ${{ matrix.lock }}
        run: |
          set -euo pipefail
          exe=''
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          chmod +x target/e2e-bin/* || true
          mkdir -p target/debug target/tmp
          cp "target/e2e-bin/socket-patch$exe" "target/debug/socket-patch$exe"
          cd crates/socket-patch-cli
          export CARGO_MANIFEST_DIR="$PWD"
          status=0
          for suite in e2e_redirect_cargo_build e2e_redirect_cargo_shapes e2e_vendor_cargo_build mode_migration_cargo; do
            echo "::group::$suite"
            "../../target/e2e-bin/$suite$exe" || status=1
            echo "::endgroup::"
          done
          "../../target/e2e-bin/e2e_safety_cargo_build$exe" --ignored || status=1
          exit "$status"

  cargo-vex-matrix-full:
    name: cargo ${{ matrix.toolchain }} lock-v${{ matrix.lock || 'own' }} (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.head_ref == 'release/v5-prerelease'
    needs: [test, coverage, e2e-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '1'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '2'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '4'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: ''}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '2'}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '3'}
          - {os: ubuntu-latest, toolchain: stable, lock: ''}
          - {os: ubuntu-latest, toolchain: stable, lock: '1'}
          - {os: ubuntu-latest, toolchain: stable, lock: '3'}
          - {os: ubuntu-latest, toolchain: stable, lock: '4'}
    steps: *cargo-vex-steps

  # Manifest `[patch]` + the tagged detached lock (the v5 vendored cargo
  # wiring) on cargo 1.41 and 1.56 — below / at the 1.56 floor of
  # config-file `[patch]`. The old-toolchain tests prefer the local
  # `rust:1.41-slim` / `rust:1.56-slim` docker images (run `--network none`;
  # they build AND run the consumer) and skip when no old cargo is
  # available; this leg pulls both images and requires them.
  cargo-old-toolchains:
    name: cargo old toolchains (manifest [patch])
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show
      - name: Pull the old cargos under test
        run: |
          docker pull rust:1.41-slim
          docker pull rust:1.56-slim
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cargo-old-toolchains
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Vendored manifest [patch] on old cargo
        shell: bash
        env:
          SOCKET_PATCH_CARGO_E2E_REQUIRED: '1'
          SOCKET_PATCH_CARGO_OLD_TOOLCHAINS_REQUIRED: '1'
        run: |
          set -euo pipefail
          cargo test -p socket-patch-cli --test e2e_vendor_cargo_build -- old_toolchain --nocapture

  # ----------------------------------------------------------------------
  # Hosted-mode production e2e — REQUIRED status check, with a kill switch.
  #
  # Drives `scan --mode hosted` against the REAL production endpoints
  # (patches-api.socket.dev + patch.socket.dev) and the REAL upstream
  # registries, using patches that are actually published on production.
  # Nothing is mocked. Every other hosted-mode capstone in this repo
  # (e2e_redirect_*) points at a wiremock stand-in, so this job is the only
  # thing that would notice production drifting away from the CLI.
  #
  # The suite itself is `#[ignore]`-gated, so it stays OUT of the `test` and
  # `e2e` jobs and only runs where it is explicitly asked for — here.
  #
  # INVARIANTS (this job is registered in branch protection as a required
  # check named exactly `hosted-e2e`):
  #   * NO job-level `if:` — a *skipped* required check is ambiguous to branch
  #     protection and can wedge a PR at "Expected — waiting for status".
  #     The kill switch gates the STEPS, never the job.
  #   * NO `needs:` — an upstream failure would skip this job, same wedge.
  #   * NO matrix and NO rename — the check name must stay `hosted-e2e`.
  #   * NO `continue-on-error` — a bypass must be visible, not invisible.
  # The job ALWAYS runs and ALWAYS reaches success or failure.
  #
  # ESCAPE HATCH — when production is down and this is blocking merges:
  #   Settings -> Secrets and variables -> Actions -> Variables ->
  #     HOSTED_E2E_DISABLED = true
  #   then "Re-run failed jobs" on any blocked PR. `vars` is read at job-run
  #   time, so no commit and no push is needed; the job goes green with a loud
  #   ::warning:: and a BYPASSED banner in the job summary. DELETE the variable
  #   to re-arm. For a one-off: Actions -> CI -> Run workflow ->
  #   hosted_e2e = force (ignore the variable) | skip (bypass this run).
  # ----------------------------------------------------------------------
  hosted-e2e:
    name: hosted-e2e            # registered in branch protection; do not rename
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    concurrency:
      # These are real requests against a real production service — keep it to
      # one run per ref rather than one per push.
      group: hosted-e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      HOSTED_E2E_DISABLED: ${{ vars.HOSTED_E2E_DISABLED }}
      # The `inputs` context is empty on push/pull_request, so default to auto.
      HOSTED_E2E_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.hosted_e2e) || 'auto' }}
    steps:
      - name: Resolve the kill switch
        id: gate
        run: |
          set -eu
          run=true; reason=''
          case "$HOSTED_E2E_MODE" in
            force) reason='workflow_dispatch hosted_e2e=force (kill switch ignored)' ;;
            skip)  run=false; reason='workflow_dispatch hosted_e2e=skip' ;;
            *)     if [ "${HOSTED_E2E_DISABLED:-}" = 'true' ]; then
                     run=false
                     reason='repository variable HOSTED_E2E_DISABLED=true'
                   fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = 'false' ]; then
            echo "::warning title=hosted-e2e BYPASSED::$reason"
            {
              echo '## :warning: hosted-e2e BYPASSED — no production coverage in this run'
              echo
              echo "Reason: $reason"
              echo
              echo 'Re-arm by deleting the HOSTED_E2E_DISABLED repository variable'
              echo '(Settings -> Secrets and variables -> Actions -> Variables).'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        if: steps.gate.outputs.run == 'true'
        run: rustup show

      - name: Cache cargo
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: hosted-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24, NOT the 20.20.2 the other jobs pin. pnpm 10 imports
          # `node:sqlite` for its store index, which does not exist before
          # Node 22 (and is only stable in 24) — on 20 every `pnpm install`
          # dies with ERR_UNKNOWN_BUILTIN_MODULE. This suite drives real,
          # current package managers against production, so it tracks what
          # users actually run rather than the pin the offline suites need.
          node-version: '24.x'

      - name: Setup npm-family package managers
        if: steps.gate.outputs.run == 'true'
        env:
          # Every corepack shim invocation — including the suite's own
          # `has_command` probes — must be non-interactive, or the probe hangs
          # or exits non-zero and STRICT turns that into a failed leg.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        # corepack owns pnpm and both yarn flavors. `corepack enable` alone is
        # not enough: it installs the shims, but `pnpm --version` still fails
        # for a project with no `packageManager` field — exactly the pnpm
        # fixture's shape — because the shim has no version to resolve. The
        # `prepare … --activate` lines set that global default AND pre-download
        # each version, so the first invocation inside a test is not also a
        # network fetch.
        #
        # pnpm must NOT come from `npm install -g` here: corepack has already
        # created its shim at the same path, and npm refuses with EEXIST. Only
        # bun, which corepack does not manage, comes from npm.
        run: |
          set -eu
          corepack enable
          corepack prepare pnpm@10 --activate
          corepack prepare yarn@1.22.22 --activate
          corepack prepare yarn@4.6.0 --activate
          npm install -g bun@1
          # vlt: the same sha512-checked pack-and-install as the e2e rows.
          js=$(scripts/install-vlt.sh 1.2.0 "$RUNNER_TEMP/vlt-tool")
          {
            echo "SOCKET_PATCH_VLT_E2E_JS=$js"
            echo "SOCKET_PATCH_VLT_E2E_VERSION=1.2.0"
            echo "SOCKET_PATCH_VLT_E2E_REQUIRED=1"
            echo "SOCKET_PATCH_HOSTED_E2E_STRICT=1"
          } >> "$GITHUB_ENV"
          node --version
          npm --version
          pnpm --version
          bun --version
          node --no-warnings "$js" --version

      - name: Setup Python + uv
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.x'

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check uv && uv --version

      - name: Setup Ruby
        if: steps.gate.outputs.run == 'true'
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1.295.0
        with:
          ruby-version: '3.2.10'
          # The gem hosted rewrite pins into the Gemfile.lock CHECKSUMS
          # section, which `bundle lock --add-checksums` only emits on >= 2.6.
          bundler: '2.6'
          bundler-cache: false

      - name: Setup Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'
          cache: false

      - name: Run hosted-mode production e2e
        if: steps.gate.outputs.run == 'true'
        env:
          # A required check must never report green on an unexercised leg:
          # STRICT turns the suite's local "toolchain missing" soft-skips into
          # hard failures. Every toolchain it needs is installed above.
          SOCKET_PATCH_HOSTED_E2E_STRICT: '1'
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -u
          # The public proxy intermittently returns 503 "Service temporarily
          # over capacity" — that is the documented reason the older live-API
          # suites were pulled from the PR matrix (see the `e2e` job). Retry the
          # whole suite a couple of times before calling it a real failure, so a
          # transient 503 does not block merges through a required check.
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::hosted-e2e attempt $attempt"
            # The step shell runs with -e: keep a failed attempt from ending it.
            status=0
            cargo test -p socket-patch-cli --test e2e_hosted_production -- \
              --ignored --nocapture --test-threads=4 2>&1 | tee hosted-e2e.log || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              # The vlt leg (probe-driven: the clean refusal while the artifact
              # is content-encoded, the full install proof once it is not).
              python3 scripts/check-vlt-legs.py \
                --manifest crates/socket-patch-cli/tests/vlt-leg-manifest.json hosted-e2e.log
              exit $?
            fi
            echo "::warning title=hosted-e2e attempt $attempt failed::retrying"
            sleep $((attempt * 20))
          done
          echo "::error title=hosted-e2e::suite failed on all 3 attempts"
          exit 1

      - name: Run vendored-mode production e2e (vlt)
        if: steps.gate.outputs.run == 'true'
        # The vendored vlt install proof against production: the service's
        # directory artifact in the D19 layout, then a fresh `vlt ci`.
        env:
          SOCKET_PATCH_VENDORED_E2E_STRICT: '1'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::vendored vlt production attempt $attempt"
            status=0
            cargo test -p socket-patch-cli --test e2e_vendored_production -- \
              --include-ignored vlt_pinned_matrix --nocapture 2>&1 | tee vlt-vendored-production.log || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              python3 scripts/check-vlt-legs.py \
                --manifest crates/socket-patch-cli/tests/vlt-leg-manifest.json vlt-vendored-production.log
              exit $?
            fi
            echo "::warning title=vendored vlt production attempt $attempt failed::retrying"
            sleep $((attempt * 20))
          done
          echo "::error title=hosted-e2e::the vendored vlt production proof failed on all 3 attempts"
          exit 1
