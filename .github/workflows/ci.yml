          - {os: 'ubuntu-latest', suite: 'e2e_vex_build', test_filter: 'deno:: --ignored', deno: '2.9.7', ci_group: 'e2e_vex_build-2.9.7-56'}
    runs-on: ${{ matrix.os }}
    # The real-toolchain capstones loop several releases per leg (pip,
    # pipenv) or bootstrap a tool from PyPI before the suite (poetry, pdm,
    # hatch), hence more than the 25 minutes the older legs needed.
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env: &e2e-env
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    # e2e-full runs these same steps over its rows.
    steps: &e2e-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the e2e binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-bin-${{ matrix.os }}*
          merge-multiple: true
          path: target/e2e-archive

      - name: Unpack the e2e binaries
        shell: bash
        # Decompress to a file, not into `| tar -xf -`: a tar that exits at
        # the end-of-archive marker without draining stdin (macOS's does)
        # leaves zstd writing into a closed pipe, and pipefail turns its
        # "Broken pipe" into a failed leg that evicts the queue entry.
        run: |
          set -euo pipefail
          mkdir -p target/e2e-bin
          zstd -q -d -f target/e2e-archive/e2e-bin.tar.zst -o target/e2e-bin.tar
          tar -xf target/e2e-bin.tar -C target/e2e-bin
          rm target/e2e-bin.tar

      - name: Stage the CLI where the test binaries expect it
        # `CARGO_BIN_EXE_socket-patch` was baked in at compile time as
        # <checkout>/target/debug/socket-patch; CARGO_TARGET_TMPDIR likewise.
        shell: bash
        run: |
          set -euo pipefail
          exe=''
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          chmod +x target/e2e-bin/* || true
          mkdir -p target/debug target/tmp
          cp "target/e2e-bin/socket-patch$exe" "target/debug/socket-patch$exe"

      - name: Setup Node.js
        if: contains(format(' {0} ', matrix.suite), ' e2e_npm ') || contains(format(' {0} ', matrix.suite), ' e2e_scan ') || contains(format(' {0} ', matrix.suite), ' e2e_safety_pnpm ')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Setup pnpm
        if: contains(format(' {0} ', matrix.suite), ' e2e_safety_pnpm ')
        # Pin the major version so the store layout the test
        # asserts on stays stable. `npm install -g` is the simplest
        # cross-platform install path (works on ubuntu, macos,
        # windows-runners — they all ship a usable npm via
        # actions/setup-node).
        run: npm install -g pnpm@10

      - name: Setup Node.js 24 (named pnpm legs)
        if: contains(format(' {0} ', matrix.suite), ' e2e_redirect_pnpm_build ') && matrix.vlt == ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'

      - name: Setup Python
        if: contains(format(' {0} ', matrix.suite), ' e2e_pypi ') || matrix.uv != '' || matrix.poetry != '' || matrix.pdm != '' || matrix.hatch != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.x'

      - name: Setup uv (uv legs)
        if: matrix.uv != ''
        # The exact uv release the leg pins; the suites assert it through
        # SOCKET_PATCH_UV_E2E_VERSION.
        shell: bash
        env:
          UV_TEST_VERSION: ${{ matrix.uv }}
        run: |
          scripts/pip-install-retry.sh --upgrade pip "uv==$UV_TEST_VERSION"
          uv --version

      - name: Install uv (PDM / Hatch legs)
        if: matrix.pdm != '' || matrix.hatch != ''
        # The suites bootstrap the pinned PDM / Hatch into their own venv
        # with uv; this uv is tooling, not the release under test.
        shell: bash
        run: scripts/pip-install-retry.sh uv==0.11.19

      - name: Install pinned Poetry
        if: matrix.poetry != ''
        # Poetry 1.0/1.1 need Python 3.8 (their vendored deps predate 3.12);
        # 1.2.2 needs the cleo pre-release it was published against. pip 24.0
        # seeds the tool venv (Poetry 1.0 + pip 22.3-23.0 misread the lock-1.0
        # `#sha256=` fragment, as the CLI's advisory says).
        shell: bash
        env:
          POETRY_TEST_VERSION: ${{ matrix.poetry }}
        run: |
          scripts/pip-install-retry.sh uv==0.11.19
          case "$POETRY_TEST_VERSION" in 1.0.*|1.1.*) py=3.8.20 ;; *) py=3.12 ;; esac
          uv venv "$RUNNER_TEMP/poetry" --python "$py"
          extra=""; [ "$POETRY_TEST_VERSION" = "1.2.2" ] && extra="cleo==1.0.0a5"
          uv pip install --python "$RUNNER_TEMP/poetry/bin/python" "poetry==$POETRY_TEST_VERSION" pip==24.0 setuptools==69.5.1 $extra
          echo "SOCKET_PATCH_POETRY_BIN=$RUNNER_TEMP/poetry/bin/poetry" >> "$GITHUB_ENV"

      - name: Setup uv (Pipenv / pip legs)
        if: matrix.pipenv != '' || matrix.pip != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install the Pythons the Pipenv / pip legs run on
        if: matrix.pipenv != '' || matrix.pip != ''
        run: uv python install 3.8 3.11 3.12

      - name: Setup Ruby
        if: contains(format(' {0} ', matrix.suite), ' e2e_gem ') || matrix.bundler != ''
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1.295.0
        with:
          # setup-ruby does NOT support `3.2.x` wildcard pinning the
          # way setup-python does — it errors with "Unknown version
          # 3.2.x for ruby on ubuntu-24.04". Pin to an exact patch
          # that's currently in the catalog. If the action drops this
          # patch in the future, bump to whatever's available — see
          # https://github.com/ruby/setup-ruby for the supported list.
          # Bundler-era legs pin their own Ruby (`ruby:`): bundler <= 2.2
          # needs Ruby <= 3.3 and 1.17-2.1 need Ruby <= 3.1 (`untaint`).
          ruby-version: ${{ matrix.ruby || '3.2.10' }}
          # The legs pin their bundler (`bundler:`) so a capstone never rides
          # whatever bundler the runner's Ruby ships; bundler 1.x is not
          # installable through setup-ruby, see the next steps. e2e_gem keeps
          # the 2.5 floor.
          bundler: ${{ startsWith(matrix.bundler, '1.') && 'none' || matrix.bundler || '2.5' }}
          bundler-cache: false

      - name: Install Bundler 1.x
        if: startsWith(matrix.bundler, '1.')
        shell: bash
        env:
          BUNDLER_TEST_VERSION: ${{ matrix.bundler }}
        run: gem install bundler -v "$BUNDLER_TEST_VERSION" --no-document

      # Installing a bundler does not make `bundle` run it: with no lockfile
      # to read, RubyGems' binstub activates the HIGHEST installed bundler,
      # so a leg pinned BELOW its Ruby's default gem (2.1.4 / 2.2.33 on Ruby
      # 3.1, whose default is 2.3.27) silently runs the default instead and
      # tests/common/bundler_e2e.rs rightly panics. BUNDLER_VERSION makes
      # the binstub select exactly the pinned release in every process (and
      # turns off bundler >= 2.3's lockfile-driven self-switch), the same
      # knob tests/docker/Dockerfile.gem-b1 sets.
      - name: Select the pinned Bundler
        if: matrix.bundler != ''
        shell: bash
        env:
          BUNDLER_TEST_VERSION: ${{ matrix.bundler }}
        run: |
          echo "BUNDLER_VERSION=$BUNDLER_TEST_VERSION" >> "$GITHUB_ENV"
          BUNDLER_VERSION="$BUNDLER_TEST_VERSION" bundle --version

      - name: Setup PHP
        if: matrix.composer != ''
        # The composer capstones shell out to a real composer; `composer:`
        # pins the release line (1, 2.2 LTS, 2) so the composer.lock grammar
        # the edits assert stays stable across runners.
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:${{ matrix.composer }}

      - name: Select the JVM toolchain (JVM legs)
        id: jvm
        if: matrix.jvm_tool != ''
        # `jvm_tool` (gradle | maven | sbt) marks a JVM leg. The JDK comes
        # from the runner image (JAVA_HOME_<N>_X64 / _arm64: 8, 11, 17 and 21
        # on every hosted OS) when it has the pinned feature release, else
        # from setup-java below. Maven is needed by the Maven legs and by the
        # Gradle legs whose filter selects gradle_vendor_* (gradle_vendor_395
        # builds the mixed root's pom with it). The multi-project capstone
        # reads the Gradle cache and the agent / hosted Gradle legs run
        # without Maven, so the windows multi-project row proves both.
        shell: bash
        env:
          JVM_TOOL: ${{ matrix.jvm_tool }}
          JAVA_FEATURE: ${{ matrix.java || '17' }}
          TEST_FILTER: ${{ matrix.test_filter }}
        run: |
          set -euo pipefail
          home=''
          for arch in X64 arm64 ARM64; do
            var="JAVA_HOME_${JAVA_FEATURE}_${arch}"
            if [ -n "${!var:-}" ]; then home="${!var}"; break; fi
          done
          if [ -n "$home" ]; then
            bin="$home/bin"
            if [ "$RUNNER_OS" = Windows ]; then bin="$home\\bin"; fi
            echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
            echo "$bin" >> "$GITHUB_PATH"
            echo "runner-jdk=true" >> "$GITHUB_OUTPUT"
            echo "JDK $JAVA_FEATURE from the runner image: $home"
          else
            echo "runner-jdk=false" >> "$GITHUB_OUTPUT"
          fi
          maven=false
          case "$JVM_TOOL" in
            maven) maven=true ;;
            gradle) case " $TEST_FILTER " in *gradle_vendor_*) maven=true ;; esac ;;
          esac
          echo "maven=$maven" >> "$GITHUB_OUTPUT"

      - name: Setup Java (JDK not on the runner image)
        if: matrix.jvm_tool != '' && steps.jvm.outputs.runner-jdk != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java || '17' }}

      - name: Setup sbt (sbt legs)
        if: matrix.sbt != ''
        # The sbt launcher script; it boots whatever `sbt.version` each
        # fixture's project/build.properties pins.
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
        with:
          sbt-runner-version: 1.13.0
          disk-cache: false

      - name: Warm the sbt seed (sbt legs)
        if: matrix.sbt != ''
        # Boots the pinned sbt once into a seed the suites hard-link into
        # each test's private caches (SOCKET_PATCH_SBT_E2E_SEED), and names
        # the launcher (SOCKET_PATCH_SBT_E2E_SBT).
        shell: bash
        env:
          SBT_TEST_VERSION: ${{ matrix.sbt }}
        run: scripts/sbt-warm-seed.sh "$SBT_TEST_VERSION" "$RUNNER_TEMP/sbt-seed" >> "$GITHUB_ENV"

      - name: Install Maven ${{ matrix.maven || '3.9.16' }}
        if: steps.jvm.outputs.maven == 'true'
        # The exact release a leg names rather than the runner's Maven. The
        # tarball comes from Maven Central's CDN (well under a second);
        # archive.apache.org throttles bulk downloads to 1.5-5.5 minutes per
        # leg. If the CDN fails, use the slower archive tarball. Both
        # sources must match the committed SHA512 in scripts/maven-sha512.json;
        # an origin cannot replace both the archive and its expected digest.
        # --ssl-revoke-best-effort: see the `test` job's vexctl step.
        shell: bash
        env:
          MAVEN_VERSION: ${{ matrix.maven || '3.9.16' }}
        run: |
          major="${MAVEN_VERSION%%.*}"
          file="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/${file}"
          archive_url="https://archive.apache.org/dist/maven/maven-${major}/${MAVEN_VERSION}/binaries/${file}"
          if ! curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort "$url" -o "$RUNNER_TEMP/maven.tgz"; then
            echo "::warning::Maven Central download failed; falling back to the Apache archive."
            curl -fsSL --retry 5 --retry-all-errors --ssl-revoke-best-effort "$archive_url" -o "$RUNNER_TEMP/maven.tgz"
          fi
          python - "$MAVEN_VERSION" "$RUNNER_TEMP/maven.tgz" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          # Pins come from Apache's release checksums, cross-checked against
          # the Maven Central tarballs. Add a pin when adding a matrix version.
          expected = json.loads(Path("scripts/maven-sha512.json").read_text())[sys.argv[1]]
          if hashlib.sha512(Path(sys.argv[2]).read_bytes()).hexdigest() != expected:
              raise SystemExit("Maven archive SHA512 mismatch")
          PY
          # Python accepts native Windows paths for both archive and destination.
          python -m tarfile -e "$RUNNER_TEMP/maven.tgz" "$RUNNER_TEMP"
          launcher="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn"
          if [ "$RUNNER_OS" = Windows ]; then launcher="${launcher}.cmd"; fi
          echo "SOCKET_PATCH_MAVEN_E2E_MVN=$launcher" >> "$GITHUB_ENV"

      - name: Install Gradle ${{ matrix.gradle }}
        if: matrix.gradle != ''
        shell: bash
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
        # Pinned digest, GitHub-release origin: see the script.
        run: scripts/install-gradle.sh "$GRADLE_VERSION" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        if: matrix.dotnet != ''
        # Installs next to the runner's preinstalled SDKs; the suite writes
        # its own global.json to select the pinned major.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.0.x

      - name: Setup Deno
        if: matrix.deno != ''
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}

      - name: Setup Bun
        if: matrix.bun != ''
        # Installs the exact bun release the leg pins (setup-bun resolves a
        # strict semver straight to the `bun-v<ver>` GitHub release, so the
        # lock-era legs get the historical writer, not `latest`). Works on
        # all three runner OSes (windows → bun-windows-x64.zip / bun.exe).
        # SHA resolved from `gh api repos/oven-sh/setup-bun/git/ref/tags/v2.2.0`.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Setup Node.js 24 (vlt legs)
        if: matrix.vlt != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'

      - name: Setup vlt
        if: matrix.vlt != ''
        # The pinned release (and, for the upgrade legs, the second vlt):
        # `npm pack`, sha512 against the registry and the committed pin, then
        # a prefix install run as `node vlt.js`. The store-linker knob is a
        # harness variable because the harness scrubs ambient VLT_*.
        shell: bash
        env:
          VLT_TEST_VERSION: ${{ matrix.vlt }}
          VLT_TEST_UPGRADE: ${{ matrix.vlt_upgrade }}
          VLT_TEST_STORE_LINKER: ${{ matrix.vlt_store_linker }}
        run: |
          set -euo pipefail
          js=$(scripts/install-vlt.sh "$VLT_TEST_VERSION" "$RUNNER_TEMP/vlt-tool")
          {
            echo "SOCKET_PATCH_VLT_E2E_JS=$js"
            echo "SOCKET_PATCH_VLT_E2E_VERSION=$VLT_TEST_VERSION"
            echo "SOCKET_PATCH_VLT_E2E_REQUIRED=1"
            echo "LANG=C"
            echo "LC_ALL=C"
          } >> "$GITHUB_ENV"
          if [ -n "$VLT_TEST_STORE_LINKER" ]; then
            echo "SOCKET_PATCH_VLT_E2E_STORE_LINKER=$VLT_TEST_STORE_LINKER" >> "$GITHUB_ENV"
          fi
          if [ -n "$VLT_TEST_UPGRADE" ]; then
            up=$(scripts/install-vlt.sh "$VLT_TEST_UPGRADE" "$RUNNER_TEMP/vlt-upgrade")
            echo "SOCKET_PATCH_VLT_E2E_UPGRADE_JS=$up" >> "$GITHUB_ENV"
            echo "SOCKET_PATCH_VLT_E2E_UPGRADE_VERSION=$VLT_TEST_UPGRADE" >> "$GITHUB_ENV"
          fi
          node --version

      - name: Run e2e tests
        # Every grouped member retains its own filters and required-tool
        # guards; vlt members additionally pass the leg-manifest checker.
        # The runner reports each failure and continues through later suites.
        env:
          E2E_ROW_JSON: ${{ toJSON(matrix) }}
        run: python3 scripts/ci-e2e-run.py

      - name: Upload the Gradle probe reports
        if: always() && matrix.gradle != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: gradle-probe-pr-${{ matrix.os }}-${{ matrix.gradle }}-${{ strategy.job-index }}
          path: target/gradle-probe/
          if-no-files-found: ignore
          retention-days: 14

  # The PM-version legs with no boundary of their own: the middle uv lines,
  # Pipenv releases and .NET SDK majors, and bundler 2.7. Skipped
  # on pull_request (the `e2e` rows keep every named boundary, the oldest
  # and newest release of each tool and every vlt era there); main pushes,
  # v5 landings, the nightly schedule and dispatch run them with the `e2e`
  # steps.

  # Each OS consumes only its own build. A queued macOS runner must not
  # delay Linux or Windows, and a Windows compile must not delay Gradle.
  # Middle Gradle lines are required in the merge queue; every PR still
  # runs every suite on the oldest/newest line. Main reuses the queue verdict.
  e2e-gradle-mid:
    name: e2e-gradle-mid (${{ matrix.os }}, ${{ matrix.ci_group }})
    if: github.event_name != 'pull_request' && needs.e2e-build.outputs.reuse != 'true'
    needs: [e2e-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: 'ubuntu-latest', suite: 'e2e_gradle_discovery_build e2e_gradle_agent_build e2e_redirect_gradle_build', parallel_suites: 'true', jvm_tool: 'gradle', gradle: '7.6.6', java: '17', test_filter: '--ignored gradle_agent_ gradle_hosted_3 gradle_hosted_4 gradle_hosted_5', ci_group: '7.6.6-7.6.6-1'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gradle_build', jvm_tool: 'gradle', gradle: '7.6.6', java: '17', test_filter: '--ignored gradle_hosted_b gradle_hosted_c gradle_hosted_d gradle_hosted_e gradle_hosted_f gradle_hosted_l gradle_hosted_m gradle_hosted_n gradle_hosted_o gradle_hosted_p --skip gradle_hosted_config_cache_second_row --skip gradle_hosted_fallback_snippet_compiles_kotlin', ci_group: '7.6.6-7.6.6-2'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gradle_build', jvm_tool: 'gradle', gradle: '7.6.6', java: '17', test_filter: '--ignored gradle_hosted_ --skip gradle_hosted_3 --skip gradle_hosted_4 --skip gradle_hosted_5 --skip gradle_hosted_b --skip gradle_hosted_c --skip gradle_hosted_d --skip gradle_hosted_e --skip gradle_hosted_f --skip gradle_hosted_l --skip gradle_hosted_m --skip gradle_hosted_n --skip gradle_hosted_o --skip gradle_hosted_p --skip gradle_hosted_config_cache_second_row --skip gradle_hosted_fallback_snippet_compiles_kotlin --skip gradle_hosted_vendored_takeover_and_eject', ci_group: '7.6.6-7.6.6-3'}
          - {os: 'ubuntu-latest', suite: 'e2e_vendor_gradle_build e2e_vendor_jvm_build e2e_redirect_gradle_build', jvm_tool: 'gradle', gradle: '7.6.6', java: '17', test_filter: '--ignored gradle_vendor_ gradle_multi_project gradle_hosted_config_cache_second_row gradle_hosted_fallback_snippet_compiles_kotlin gradle_hosted_vendored_takeover_and_eject', ci_group: '7.6.6-7.6.6-4'}
          - {os: 'ubuntu-latest', suite: 'e2e_gradle_discovery_build e2e_gradle_agent_build e2e_redirect_gradle_build', parallel_suites: 'true', jvm_tool: 'gradle', gradle: '8.14.3', java: '21', test_filter: '--ignored gradle_agent_ gradle_hosted_3 gradle_hosted_4 gradle_hosted_5', ci_group: '8.14.3-8.14.3-5'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gradle_build', jvm_tool: 'gradle', gradle: '8.14.3', java: '21', test_filter: '--ignored gradle_hosted_b gradle_hosted_c gradle_hosted_d gradle_hosted_e gradle_hosted_f gradle_hosted_l gradle_hosted_m gradle_hosted_n gradle_hosted_o gradle_hosted_p --skip gradle_hosted_config_cache_second_row --skip gradle_hosted_fallback_snippet_compiles_kotlin', ci_group: '8.14.3-8.14.3-6'}
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gradle_build', jvm_tool: 'gradle', gradle: '8.14.3', java: '21', test_filter: '--ignored gradle_hosted_ --skip gradle_hosted_3 --skip gradle_hosted_4 --skip gradle_hosted_5 --skip gradle_hosted_b --skip gradle_hosted_c --skip gradle_hosted_d --skip gradle_hosted_e --skip gradle_hosted_f --skip gradle_hosted_l --skip gradle_hosted_m --skip gradle_hosted_n --skip gradle_hosted_o --skip gradle_hosted_p --skip gradle_hosted_config_cache_second_row --skip gradle_hosted_fallback_snippet_compiles_kotlin --skip gradle_hosted_vendored_takeover_and_eject', ci_group: '8.14.3-8.14.3-7'}
          - {os: 'ubuntu-latest', suite: 'e2e_vendor_gradle_build e2e_vendor_jvm_build e2e_redirect_gradle_build', jvm_tool: 'gradle', gradle: '8.14.3', java: '21', test_filter: '--ignored gradle_vendor_ gradle_multi_project gradle_hosted_config_cache_second_row gradle_hosted_fallback_snippet_compiles_kotlin gradle_hosted_vendored_takeover_and_eject', ci_group: '8.14.3-8.14.3-8'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env: *e2e-env
    steps: *e2e-steps

  e2e-windows:
    name: e2e-windows (${{ matrix.os }}, ${{ matrix.ci_group }})
    if: needs.e2e-build-windows.outputs.reuse != 'true'
    needs: [e2e-build-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: 'windows-latest', bun: '1.4.2', suite: 'e2e_safety_pnpm e2e_redirect_npm_build e2e_redirect_rush_sim e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun', cases: '[{"os":"windows-latest","suite":"e2e_safety_pnpm"},{"os":"windows-latest","suite":"e2e_redirect_npm_build","npm_required":"1"},{"os":"windows-latest","suite":"e2e_redirect_rush_sim"},{"os":"windows-latest","suite":"e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun","bun":"1.4.2","test_filter":"--include-ignored"}]', ci_group: 'node20-1.4.2-1'}
          - {os: 'windows-latest', vlt: '1.2.0', suite: 'e2e_redirect_vlt_build e2e_vendor_vlt_build mode_migration_vlt e2e_safety_vlt e2e_vlt e2e_redirect_pnpm_build', cases: '[{"os":"windows-latest","suite":"e2e_redirect_vlt_build","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"windows-latest","suite":"e2e_vendor_vlt_build","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"windows-latest","suite":"mode_migration_vlt","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"windows-latest","suite":"e2e_safety_vlt","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix","vlt_store_linker":"hardlink"},{"os":"windows-latest","suite":"e2e_vlt","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"windows-latest","suite":"e2e_redirect_pnpm_build","test_filter":"--ignored --skip pnpm_pinned_matrix"}]', ci_group: 'node24-1.2.0-2'}
          - {os: 'windows-latest', vlt: '1.0.0-rc.14', suite: 'e2e_vendor_vlt_build mode_migration_vlt e2e_vlt', cases: '[{"os":"windows-latest","suite":"e2e_vendor_vlt_build","vlt":"1.0.0-rc.14","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"windows-latest","suite":"mode_migration_vlt","vlt":"1.0.0-rc.14","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"windows-latest","suite":"e2e_vlt","vlt":"1.0.0-rc.14","test_filter":"--include-ignored vlt_pinned_matrix"}]', ci_group: 'node24-1.0.0-rc.14-3'}
          - {os: 'windows-latest', suite: 'e2e_vendor_jvm_build', jvm_tool: 'maven', maven: '3.9.16', test_filter: '--ignored maven_reactor', ci_group: 'jvm-dotnet-3.9.16-4'}
          - {os: 'windows-latest', suite: 'e2e_vendor_jvm_build', jvm_tool: 'gradle', gradle: '8.14.3', java: '17', test_filter: '--ignored gradle_multi_project', ci_group: '8.14.3-8.14.3-5'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env: *e2e-env
    steps: *e2e-steps

  # The macOS rows run on main, the merge queue and nightly, not on every
  # PR push, so PRs stop queueing on the small macOS runner pool.
  e2e-macos:
    name: e2e-macos (${{ matrix.os }}, ${{ matrix.ci_group }})
    if: github.event_name != 'pull_request' && needs.e2e-build-macos.outputs.reuse != 'true'
    # These jobs consume e2e-build's binaries and can run alongside unit tests.
    needs: [e2e-build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: 'macos-latest', bun: '1.4.2', suite: 'e2e_safety_pnpm e2e_redirect_npm_build e2e_redirect_rush_sim e2e_redirect_bun_build e2e_vendor_bun_build mode_migration_bun', cases: '[{"os":"macos-latest","suite":"e2e_safety_pnpm"},{"os":"macos-latest","suite":"e2e_redirect_npm_build","npm_required":"1"},{"os":"macos-latest","suite":"e2e_redirect_rush_sim"},{"os":"macos-latest","suite":"e2e_redirect_bun_build","bun":"1.4.2","test_filter":"--include-ignored"},{"os":"macos-latest","suite":"e2e_vendor_bun_build","bun":"1.4.2","test_filter":"--include-ignored"},{"os":"macos-latest","suite":"mode_migration_bun","bun":"1.4.2","test_filter":"--include-ignored"}]', ci_group: 'node20-1.4.2-1'}
          - {os: 'macos-latest', vlt: '1.2.0', suite: 'e2e_redirect_vlt_build e2e_vendor_vlt_build mode_migration_vlt e2e_safety_vlt e2e_vlt e2e_redirect_pnpm_build', cases: '[{"os":"macos-latest","suite":"e2e_redirect_vlt_build","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"macos-latest","suite":"e2e_vendor_vlt_build","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"macos-latest","suite":"mode_migration_vlt","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"macos-latest","suite":"e2e_safety_vlt","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix","vlt_store_linker":"hardlink"},{"os":"macos-latest","suite":"e2e_vlt","vlt":"1.2.0","test_filter":"--include-ignored vlt_pinned_matrix"},{"os":"macos-latest","suite":"e2e_redirect_pnpm_build","test_filter":"--ignored --skip pnpm_pinned_matrix"}]', ci_group: 'node24-1.2.0-2'}
          - {os: 'macos-latest', uv: '0.12.17', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"macos-latest","suite":"e2e_redirect_uv_build","uv":"0.12.17"},{"os":"macos-latest","suite":"e2e_vendor_pypi_build","uv":"0.12.17","test_filter":"--include-ignored"}]', ci_group: 'uv-0.12.17-3'}
          - {os: 'macos-latest', poetry: '2.4.3', pdm: '2.29.2', hatch: '1.18.1', suite: 'e2e_vex_build', cases: '[{"os":"macos-latest","suite":"e2e_vex_build","test_filter":"poetry:: --ignored","poetry":"2.4.3"},{"os":"macos-latest","suite":"e2e_vex_build","test_filter":"pdm:: --ignored","pdm":"2.29.2"},{"os":"macos-latest","suite":"e2e_vex_build","test_filter":"hatch:: --ignored","hatch":"1.18.1"}]', ci_group: 'python-2.4.3-2.29.2-1.18.1-4'}
          - {os: 'macos-latest', pipenv: '2022.12.19 2026.8.0', pip: '22 26', suite: 'e2e_vex_build', cases: '[{"os":"macos-latest","suite":"e2e_vex_build","test_filter":"pipenv:: --ignored","pipenv":"2022.12.19 2026.8.0"},{"os":"macos-latest","suite":"e2e_vex_build","test_filter":"pip:: --ignored","pip":"22 26"}]', ci_group: 'python-installers-2022.12.19 2026.8.0-22 26-5'}
          - {os: 'macos-latest', jvm_tool: 'maven', maven: '3.9.16', dotnet: '8', suite: 'e2e_redirect_maven_build e2e_vendor_maven_build e2e_vendor_jvm_build e2e_nuget_dotnet_build', cases: '[{"os":"macos-latest","suite":"e2e_redirect_maven_build","jvm_tool":"maven","maven":"3.9.16"},{"os":"macos-latest","suite":"e2e_vendor_maven_build","jvm_tool":"maven","maven":"3.9.16"},{"os":"macos-latest","suite":"e2e_vendor_jvm_build","jvm_tool":"maven","maven":"3.9.16","test_filter":"--ignored maven_reactor"},{"os":"macos-latest","suite":"e2e_nuget_dotnet_build","dotnet":"8"}]', ci_group: 'jvm-dotnet-3.9.16-8-6'}
    runs-on: ${{ matrix.os }}
    # The real-toolchain capstones loop several releases per leg (pip,
    # pipenv) or bootstrap a tool from PyPI before the suite (poetry, pdm,
    # hatch), hence more than the 25 minutes the older legs needed.
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    # e2e-full runs these same steps over its rows.
    steps: *e2e-steps

  e2e-full:
    name: e2e-full (${{ matrix.os }}, ${{ matrix.ci_group }})
    # merge_group runs the pull_request tier: the queue gates on ci-ok.
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.head_ref == 'release/v5-prerelease'
    needs: [e2e-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: 'ubuntu-latest', suite: 'e2e_redirect_gem_build e2e_vendor_gem_build', ruby: '3.3', bundler: '2.7.2', ci_group: 'e2e_redirect_gem_build e2e_vendor_gem_build-3.3-2.7.2-1'}
          - {os: 'ubuntu-latest', uv: '0.2.37', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.2.37"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.2.37","test_filter":"--include-ignored"}]', ci_group: 'uv-0.2.37-2'}
          - {os: 'ubuntu-latest', uv: '0.3.5', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.3.5"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.3.5","test_filter":"--include-ignored"}]', ci_group: 'uv-0.3.5-3'}
          - {os: 'ubuntu-latest', uv: '0.4.30', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.4.30"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.4.30","test_filter":"--include-ignored"}]', ci_group: 'uv-0.4.30-4'}
          - {os: 'ubuntu-latest', uv: '0.5.3', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.5.3"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.5.3","test_filter":"--include-ignored"}]', ci_group: 'uv-0.5.3-5'}
          - {os: 'ubuntu-latest', uv: '0.5.6', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.5.6"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.5.6","test_filter":"--include-ignored"}]', ci_group: 'uv-0.5.6-6'}
          - {os: 'ubuntu-latest', uv: '0.6.17', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.6.17"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.6.17","test_filter":"--include-ignored"}]', ci_group: 'uv-0.6.17-7'}
          - {os: 'ubuntu-latest', uv: '0.7.22', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.7.22"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.7.22","test_filter":"--include-ignored"}]', ci_group: 'uv-0.7.22-8'}
          - {os: 'ubuntu-latest', uv: '0.8.24', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.8.24"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.8.24","test_filter":"--include-ignored"}]', ci_group: 'uv-0.8.24-9'}
          - {os: 'ubuntu-latest', uv: '0.9.30', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.9.30"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.9.30","test_filter":"--include-ignored"}]', ci_group: 'uv-0.9.30-10'}
          - {os: 'ubuntu-latest', uv: '0.10.12', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.10.12"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.10.12","test_filter":"--include-ignored"}]', ci_group: 'uv-0.10.12-11'}
          - {os: 'ubuntu-latest', uv: '0.11.33', suite: 'e2e_redirect_uv_build e2e_vendor_pypi_build', cases: '[{"os":"ubuntu-latest","suite":"e2e_redirect_uv_build","uv":"0.11.33"},{"os":"ubuntu-latest","suite":"e2e_vendor_pypi_build","uv":"0.11.33","test_filter":"--include-ignored"}]', ci_group: 'uv-0.11.33-12'}
          - {os: 'ubuntu-latest', suite: 'e2e_vex_build', test_filter: 'pipenv:: --ignored', pipenv: '2023.12.1', ci_group: 'python-installers-2023.12.1-13'}
          - {os: 'ubuntu-latest', suite: 'e2e_vex_build', test_filter: 'pipenv:: --ignored', pipenv: '2024.4.1', ci_group: 'python-installers-2024.4.1-14'}
          - {os: 'ubuntu-latest', suite: 'e2e_vex_build', test_filter: 'pipenv:: --ignored', pipenv: '2025.1.3', ci_group: 'python-installers-2025.1.3-15'}
          - {os: 'ubuntu-latest', suite: 'e2e_nuget_dotnet_build', dotnet: '7', ci_group: 'jvm-dotnet-7-16'}
          - {os: 'ubuntu-latest', suite: 'e2e_nuget_dotnet_build', dotnet: '8', ci_group: 'jvm-dotnet-8-17'}
          - {os: 'ubuntu-latest', suite: 'e2e_nuget_dotnet_build', dotnet: '9', ci_group: 'jvm-dotnet-9-18'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    steps: *e2e-steps

  # ----------------------------------------------------------------------
  # Docker-driven real-package e2e suite.
  #
  # For each ecosystem, builds the shared base image (multi-stage:
  # Rust → debian + compiled socket-patch) and the per-ecosystem layer,
  # then runs the matching `docker_e2e_<eco>` test binary inside the
  # repo's checkout. Tests install real packages via real package
  # managers and run socket-patch against a wiremock-served fixture —
  # no real Socket API contact. Hermetic, reproducible.
  #
  # Nightly, on dispatch and on v5 landings only: coverage-docker runs these
  # suites on each push (with an instrumented binary mounted in); this job
  # is the one run of them against the base image's full-LTO release
  # binary. The `e2e` job above runs the `#[ignore]`-gated real-toolchain
  # capstones; the live-API smoke suites are run by hand (see the note in
  # its matrix).
  # ----------------------------------------------------------------------
  e2e-docker:
    # The v5 branch has no nightly of its own, so its landings (the
    # pull_request runs of its PR into main) run it too.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.head_ref == 'release/v5-prerelease'
    needs: docker-base
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.ecosystem == 'sbt' && 45 || 35 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [npm, pypi, gem, cargo, golang, maven, composer, nuget, deno, sbt]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # `driver: docker` — see the coverage-docker matching step above
        # for the rationale (the per-ecosystem image's `FROM
        # socket-patch-test-base:latest` only resolves when buildx talks
        # directly to the host docker daemon).
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - name: Install Rust
        run: rustup show

      # No `actions/cache` here intentionally. This job builds Docker
      # images and would be flagged by zizmor's cache-poisoning audit.

      - name: Download base image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-base-image*
          merge-multiple: true
          path: docker-base

      - name: Load base image
        run: docker load --input docker-base/socket-patch-test-base.tar

      - name: Build ${{ matrix.ecosystem }} image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: tests/docker/Dockerfile.${{ matrix.ecosystem }}
          tags: socket-patch-test-${{ matrix.ecosystem }}:latest
          load: true

      - name: Run ${{ matrix.ecosystem }} Docker e2e test
        # Every ecosystem is unconditionally compiled in; only the
        # `docker-e2e` feature is needed to compile the suite itself.
        # The composer/nuget/pypi vendored build-proof capstones (each
        # ending in the manifest-less VEX stage) ride the same image as
        # their ecosystem's main suite; the gem and maven vendor capstones
        # run only in coverage-docker.
        run: |
          EXTRA=""
          FILTER=""
          case "${{ matrix.ecosystem }}" in
            composer) EXTRA="--test docker_e2e_vendor_composer" ;;
            nuget)    EXTRA="--test docker_e2e_vendor_nuget" ;;
            pypi)     EXTRA="--test docker_e2e_vendor_pypi_pm" ;;
            # Every sbt / Mill / scala-cli agent cell (the full sbt version
            # x mode matrix is sbt-compatibility.yml).
            sbt)
              export SOCKET_PATCH_SBT_DOCKER_VERSIONS="1.2.8 1.13.0"
              export SOCKET_PATCH_DOCKER_E2E_REQUIRED=1
              FILTER="--test-threads=1" ;;
          esac
          # shellcheck disable=SC2086 # EXTRA and FILTER are intentionally word-split
          cargo test -p socket-patch-cli --features docker-e2e --test "docker_e2e_${{ matrix.ecosystem }}" $EXTRA -- $FILTER

  # ----------------------------------------------------------------------
  # Per-release real-toolchain matrices for the manifest-less VEX work that
  # loop several suites per release through a script (yarn) or need a
  # toolchain + lock-format axis (cargo). Each leg hard-fails on a skip.
  # ----------------------------------------------------------------------
  yarn-classic-matrix:
    name: yarn-classic ${{ matrix.release }}
    # No `needs: [test, coverage]`: nothing here consumes their outputs,
    # and waiting on the ~30 min windows `test` leg made this the merge
    # queue's critical path.
    # Dropping that `needs` also dropped the draft skip it inherited, so
    # gate on draft here directly (push/merge_group/schedule still run).
    # Only wait for the clippy preflight.
    if: github.event.pull_request.draft != true && needs.clippy.outputs.reuse != 'true'
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 1.0.2 oldest 1.x; 1.6.0 last that installs nothing for a `file:`
        # tarball; 1.7.0 first vendored-capable; 1.9.4 last without the
        # `integrity` line; 1.10.1 first with it; 1.22.22 current.
        release: ['1.0.2', '1.6.0', '1.7.0', '1.9.4', '1.10.1', '1.22.22']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: dev-ubuntu-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Manifest-less VEX over every real yarn classic flow
        # The script exports SOCKET_PATCH_YARN_E2E_REQUIRED=1 and
        # SOCKET_PATCH_YARN_CLASSIC_E2E_VERSION itself.
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          YARN_CLASSIC_RELEASE: ${{ matrix.release }}
        run: scripts/yarn-classic-vex-matrix.sh "$YARN_CLASSIC_RELEASE"

  yarn-berry-e2e:
    name: yarn-berry ${{ matrix.yarn }} (${{ matrix.os }})
    # No `needs: [test, coverage]`: nothing here consumes their outputs,
    # and waiting on the ~30 min windows `test` leg made this the merge
    # queue's critical path.
    # Dropping that `needs` also dropped the draft skip it inherited, so
    # gate on draft here directly (push/merge_group/schedule still run).
    # Only wait for the clippy preflight.
    if: github.event.pull_request.draft != true && needs.clippy.outputs.reuse != 'true'
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        # 4.0.2 bare-hex checksum writer (4.0.0-4.0.2), 4.1.0 first
        # `10c0/` writer, current, and 4.12.0 on macOS / Windows. The rest
        # of the spread (4.6.0, 4.12.0 on ubuntu) is yarn-berry-full.
        include:
          - {os: ubuntu-latest, yarn: '4.0.2'}
          - {os: ubuntu-latest, yarn: '4.1.0'}
          - {os: ubuntu-latest, yarn: '4.18.0'}
          - {os: windows-latest, yarn: '4.12.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: &yarn-berry-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: dev-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable corepack
        run: corepack enable
      - name: Yarn berry hosted/vendored + manifest-less VEX
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          SOCKET_PATCH_YARN_E2E_REQUIRED: '1' # the script also exports it
          YARN_BERRY_RELEASE: ${{ matrix.yarn }}
        run: scripts/yarn-berry-vex-matrix.sh "$YARN_BERRY_RELEASE"

  # Skipped on pull_request (except v5 landings), like e2e-full.

  # The macOS rows of `yarn-berry-e2e`: they run on main, the merge queue and
  # nightly, not on every PR push, so PRs stop queueing on the small
  # macOS runner pool.
  yarn-berry-e2e-macos:
    if: github.event_name != 'pull_request' && needs.clippy.outputs.reuse != 'true'
    name: yarn-berry ${{ matrix.yarn }} (${{ matrix.os }})
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        # 4.0.2 bare-hex checksum writer (4.0.0-4.0.2), 4.1.0 first
        # `10c0/` writer, current, and 4.12.0 on macOS / Windows. The rest
        # of the spread (4.6.0, 4.12.0 on ubuntu) is yarn-berry-full.
        include:
          - {os: macos-latest, yarn: '4.12.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: *yarn-berry-steps

  yarn-berry-full:
    name: yarn-berry ${{ matrix.yarn }} (${{ matrix.os }})
    # merge_group runs the pull_request tier: the queue gates on ci-ok.
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.head_ref == 'release/v5-prerelease'
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, yarn: '4.6.0'}
          - {os: ubuntu-latest, yarn: '4.12.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: *yarn-berry-steps

  # Every toolchain and every lock re-encoding at least once on PRs (the
  # toolchain's own lock is re-encoded as v1-v4 before socket-patch touches
  # it, the committed-lockfile case; '' keeps the toolchain's own format),
  # plus macOS and Windows; 1.93.1 with its own lock (on every OS) is the
  # pinned rust-toolchain.toml cell `cargo test` used to give
  # e2e_safety_cargo_build. cargo-vex-matrix-full runs the rest of the
  # toolchain x lock cross off pull_request. Each leg also runs
  # e2e_safety_cargo_build (its headline test honours the knobs).
  cargo-vex-matrix:
    if: needs.e2e-build.outputs.reuse != 'true'
    name: cargo ${{ matrix.toolchain }} lock-v${{ matrix.lock || 'own' }} (${{ matrix.os }})
    # e2e-build only (its binaries; only the matching OS build is needed);
    # see yarn-classic-matrix on test/coverage.
    needs: [e2e-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: ''}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '1'}
          - {os: ubuntu-latest, toolchain: stable, lock: '2'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '3'}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '4'}
    steps: &cargo-vex-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the e2e binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-bin-${{ matrix.os }}*
          merge-multiple: true
          path: target/e2e-archive
      - name: Unpack the e2e binaries
        shell: bash
        # Decompress to a file, not into `| tar -xf -`: a tar that exits at
        # the end-of-archive marker without draining stdin (macOS's does)
        # leaves zstd writing into a closed pipe, and pipefail turns its
        # "Broken pipe" into a failed leg that evicts the queue entry.
        run: |
          set -euo pipefail
          mkdir -p target/e2e-bin
          zstd -q -d -f target/e2e-archive/e2e-bin.tar.zst -o target/e2e-bin.tar
          tar -xf target/e2e-bin.tar -C target/e2e-bin
          rm target/e2e-bin.tar
      - name: Install Rust
        run: rustup show
      - name: Install the cargo under test
        # bash, not the Windows default pwsh: in PowerShell
        # "$CARGO_TEST_TOOLCHAIN" is an (unset) PowerShell variable, so the
        # windows-latest leg ran `rustup toolchain install ""`.
        shell: bash
        env:
          CARGO_TEST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$CARGO_TEST_TOOLCHAIN" --profile minimal
      - name: Real-cargo hosted/vendored + manifest-less VEX
        # The e2e-build binaries, run from the package root as `cargo test`
        # would (see the e2e job's staging step).
        shell: bash
        env:
          SOCKET_PATCH_CARGO_E2E_REQUIRED: '1'
          SOCKET_PATCH_CARGO_E2E_TOOLCHAIN: ${{ matrix.toolchain }}
          SOCKET_PATCH_CARGO_E2E_LOCK_VERSION: ${{ matrix.lock }}
        run: |
          set -euo pipefail
          exe=''
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          chmod +x target/e2e-bin/* || true
          mkdir -p target/debug target/tmp
          cp "target/e2e-bin/socket-patch$exe" "target/debug/socket-patch$exe"
          cd crates/socket-patch-cli
          export CARGO_MANIFEST_DIR="$PWD"
          status=0
          for suite in e2e_redirect_cargo_build e2e_redirect_cargo_shapes e2e_vendor_cargo_build mode_migration_cargo; do
            echo "::group::$suite"
            "../../target/e2e-bin/$suite$exe" || status=1
            echo "::endgroup::"
          done
          "../../target/e2e-bin/e2e_safety_cargo_build$exe" --ignored || status=1
          exit "$status"

  cargo-vex-matrix-windows:
    if: needs.e2e-build-windows.outputs.reuse != 'true'
    name: cargo ${{ matrix.toolchain }} lock-v${{ matrix.lock || 'own' }} (${{ matrix.os }})
    needs: [e2e-build-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env: *e2e-env
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, toolchain: stable, lock: '1'}
          - {os: windows-latest, toolchain: '1.93.1', lock: ''}
    steps: *cargo-vex-steps

  # The macOS rows run on main, the merge queue and nightly, not per PR push.
  cargo-vex-matrix-macos:
    if: github.event_name != 'pull_request' && needs.e2e-build-macos.outputs.reuse != 'true'
    name: cargo ${{ matrix.toolchain }} lock-v${{ matrix.lock || 'own' }} (${{ matrix.os }})
    needs: [e2e-build-macos]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, toolchain: stable, lock: '1'}
          - {os: macos-latest, toolchain: '1.93.1', lock: ''}
    steps: *cargo-vex-steps

  cargo-vex-matrix-full:
    name: cargo ${{ matrix.toolchain }} lock-v${{ matrix.lock || 'own' }} (${{ matrix.os }})
    # merge_group runs the pull_request tier: the queue gates on ci-ok.
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.head_ref == 'release/v5-prerelease'
    needs: [e2e-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # What .cargo/config.toml's [env] gives processes cargo launches; these
    # legs launch the test binaries themselves.
    env:
      SOCKET_NO_CONFIG: '1'
      SOCKET_NO_UPDATE_CHECK: '1'
      SOCKET_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '1'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '2'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: '4'}
          - {os: ubuntu-latest, toolchain: '1.82.0', lock: ''}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '2'}
          - {os: ubuntu-latest, toolchain: '1.93.1', lock: '3'}
          - {os: ubuntu-latest, toolchain: stable, lock: ''}
          - {os: ubuntu-latest, toolchain: stable, lock: '1'}
          - {os: ubuntu-latest, toolchain: stable, lock: '3'}
          - {os: ubuntu-latest, toolchain: stable, lock: '4'}
    steps: *cargo-vex-steps

  # Manifest `[patch]` + the tagged detached lock (the v5 vendored cargo
  # wiring) on cargo 1.41 and 1.56 — below / at the 1.56 floor of
  # config-file `[patch]`. The old-toolchain tests prefer the local
  # `rust:1.41-slim` / `rust:1.56-slim` docker images (run `--network none`;
  # they build AND run the consumer) and skip when no old cargo is
  # available; this leg pulls both images and requires them.
  cargo-old-toolchains:
    name: cargo old toolchains (manifest [patch])
    # No `needs: [test, coverage]`: nothing here consumes their outputs,
    # and waiting on the ~30 min windows `test` leg made this the merge
    # queue's critical path.
    # Dropping that `needs` also dropped the draft skip it inherited, so
    # gate on draft here directly (push/merge_group/schedule still run).
    # Only wait for the clippy preflight.
    if: github.event.pull_request.draft != true
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show
      - name: Pull the old cargos under test
        if: needs.clippy.outputs.reuse != 'true'
        run: |
          docker pull rust:1.41-slim
          docker pull rust:1.56-slim
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: dev-ubuntu-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Warm the shared Linux dev cache after merge-queue validation
        if: needs.clippy.outputs.reuse == 'true'
        run: cargo test --locked -p socket-patch-cli --test e2e_vendor_cargo_build --no-run

      - name: Vendored manifest [patch] on old cargo
        if: needs.clippy.outputs.reuse != 'true'
        shell: bash
        env:
          SOCKET_PATCH_CARGO_E2E_REQUIRED: '1'
          SOCKET_PATCH_CARGO_OLD_TOOLCHAINS_REQUIRED: '1'
        run: |
          set -euo pipefail
          cargo test -p socket-patch-cli --test e2e_vendor_cargo_build -- old_toolchain --nocapture

  # ----------------------------------------------------------------------
  # Hosted-mode production e2e — merge-blocking through `ci-ok`, with a kill
  # switch.
  #
  # Drives `scan --mode hosted` against the REAL production endpoints
  # (patches-api.socket.dev + patch.socket.dev) and the REAL upstream
  # registries, using patches that are actually published on production.
  # Nothing is mocked. Every other hosted-mode capstone in this repo
  # (e2e_redirect_*) points at a wiremock stand-in, so this job is the only
  # thing that would notice production drifting away from the CLI.
  #
  # The suite itself is `#[ignore]`-gated, so it stays OUT of the `test` and
  # `e2e` jobs and only runs where it is explicitly asked for — here.
  #
  # INVARIANTS (`ci-ok` needs this job, and older rulesets may still name the
  # check `hosted-e2e` directly):
  #   * NO job-level `if:` — a *skipped* required check is ambiguous to branch
  #     protection and can wedge a PR at "Expected — waiting for status".
  #     The kill switch gates the STEPS, never the job.
  #   * NO `needs:` — an upstream failure would skip this job, same wedge.
  #   * NO matrix and NO rename — the check name must stay `hosted-e2e`.
  #   * NO `continue-on-error` — a bypass must be visible, not invisible.
  # The job ALWAYS runs and ALWAYS reaches success or failure.
  #
  # ESCAPE HATCH — when production is down and this is blocking merges:
  #   Settings -> Secrets and variables -> Actions -> Variables ->
  #     HOSTED_E2E_DISABLED = true
  #   then "Re-run failed jobs" on any blocked PR. `vars` is read at job-run
  #   time, so no commit and no push is needed; the job goes green with a loud
  #   ::warning:: and a BYPASSED banner in the job summary. DELETE the variable
  #   to re-arm. For a one-off: Actions -> CI -> Run workflow ->
  #   hosted_e2e = force (ignore the variable) | skip (bypass this run).
  # ----------------------------------------------------------------------
  hosted-e2e:
    name: hosted-e2e            # may be a required check; do not rename
    if: github.event.pull_request.draft != true && needs.clippy.outputs.reuse != 'true'
    needs: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    concurrency:
      # These are real requests against a real production service — keep it to
      # one run per PR ref rather than one per push. Main pushes group per
      # commit like the workflow: a group holds ONE pending job, so a shared
      # main group cancelled queued pushes and ci-ok failed them.
      group: hosted-e2e-${{ (github.event_name == 'push' && github.sha) || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      HOSTED_E2E_DISABLED: ${{ vars.HOSTED_E2E_DISABLED }}
      # The `inputs` context is empty on push/pull_request, so default to auto.
      HOSTED_E2E_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.hosted_e2e) || 'auto' }}
    steps:
      - name: Resolve the kill switch
        id: gate
        run: |
          set -eu
          run=true; reason=''
          case "$HOSTED_E2E_MODE" in
            force) reason='workflow_dispatch hosted_e2e=force (kill switch ignored)' ;;
            skip)  run=false; reason='workflow_dispatch hosted_e2e=skip' ;;
            *)     if [ "${HOSTED_E2E_DISABLED:-}" = 'true' ]; then
                     run=false
                     reason='repository variable HOSTED_E2E_DISABLED=true'
                   fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = 'false' ]; then
            echo "::warning title=hosted-e2e BYPASSED::$reason"
            {
              echo '## :warning: hosted-e2e BYPASSED — no production coverage in this run'
              echo
              echo "Reason: $reason"
              echo
              echo 'Re-arm by deleting the HOSTED_E2E_DISABLED repository variable'
              echo '(Settings -> Secrets and variables -> Actions -> Variables).'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        if: steps.gate.outputs.run == 'true'
        run: rustup show

      - name: Cache cargo
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: dev-ubuntu-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24, NOT the 20.20.2 the other jobs pin. pnpm 10 imports
          # `node:sqlite` for its store index, which does not exist before
          # Node 22 (and is only stable in 24) — on 20 every `pnpm install`
          # dies with ERR_UNKNOWN_BUILTIN_MODULE. This suite drives real,
          # current package managers against production, so it tracks what
          # users actually run rather than the pin the offline suites need.
          node-version: '24.x'

      - name: Setup npm-family package managers
        if: steps.gate.outputs.run == 'true'
        env:
          # Every corepack shim invocation — including the suite's own
          # `has_command` probes — must be non-interactive, or the probe hangs
          # or exits non-zero and STRICT turns that into a failed leg.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        # corepack owns pnpm and both yarn flavors. `corepack enable` alone is
        # not enough: it installs the shims, but `pnpm --version` still fails
        # for a project with no `packageManager` field — exactly the pnpm
        # fixture's shape — because the shim has no version to resolve. The
        # `prepare … --activate` lines set that global default AND pre-download
        # each version, so the first invocation inside a test is not also a
        # network fetch.
        #
        # pnpm must NOT come from `npm install -g` here: corepack has already
        # created its shim at the same path, and npm refuses with EEXIST. Only
        # bun, which corepack does not manage, comes from npm.
        run: |
          set -eu
          corepack enable
          corepack prepare pnpm@10 --activate
          corepack prepare yarn@1.22.22 --activate
          corepack prepare yarn@4.6.0 --activate
          npm install -g bun@1
          # vlt: the same sha512-checked pack-and-install as the e2e rows.
          js=$(scripts/install-vlt.sh 1.2.0 "$RUNNER_TEMP/vlt-tool")
          {
            echo "SOCKET_PATCH_VLT_E2E_JS=$js"
            echo "SOCKET_PATCH_VLT_E2E_VERSION=1.2.0"
            echo "SOCKET_PATCH_VLT_E2E_REQUIRED=1"
            echo "SOCKET_PATCH_HOSTED_E2E_STRICT=1"
          } >> "$GITHUB_ENV"
          node --version
          npm --version
          pnpm --version
          bun --version
          node --no-warnings "$js" --version

      - name: Setup Python + uv
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.x'

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        run: scripts/pip-install-retry.sh uv && uv --version

      - name: Setup Ruby
        if: steps.gate.outputs.run == 'true'
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1.295.0
        with:
          ruby-version: '3.2.10'
          # The gem hosted rewrite pins into the Gemfile.lock CHECKSUMS
          # section, which `bundle lock --add-checksums` only emits on >= 2.6.
          bundler: '2.6'
          bundler-cache: false

      - name: Setup Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'
          cache: false

      - name: Run hosted-mode production e2e
        if: steps.gate.outputs.run == 'true'
        env:
          # A required check must never report green on an unexercised leg:
          # STRICT turns the suite's local "toolchain missing" soft-skips into
          # hard failures. Every toolchain it needs is installed above.
          SOCKET_PATCH_HOSTED_E2E_STRICT: '1'
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -u
          # The public proxy intermittently returns 503 "Service temporarily
          # over capacity" — that is the documented reason the older live-API
          # suites were pulled from the PR matrix (see the `e2e` job). Retry the
          # whole suite a couple of times before calling it a real failure, so a
          # transient 503 does not block merges through a required check.
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::hosted-e2e attempt $attempt"
            # The step shell runs with -e: keep a failed attempt from ending it.
            status=0
            cargo test -p socket-patch-cli --test e2e_hosted_production -- \
              --ignored --nocapture --test-threads=4 2>&1 | tee hosted-e2e.log || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              # The vlt leg (probe-driven: the clean refusal while the artifact
              # is content-encoded, the full install proof once it is not).
              python3 scripts/check-vlt-legs.py \
                --manifest crates/socket-patch-cli/tests/vlt-leg-manifest.json hosted-e2e.log
              exit $?
            fi
            echo "::warning title=hosted-e2e attempt $attempt failed::retrying"
            sleep $((attempt * 20))
          done
          echo "::error title=hosted-e2e::suite failed on all 3 attempts"
          exit 1

      - name: Run vendored-mode production e2e (vlt)
        if: steps.gate.outputs.run == 'true'
        # The vendored vlt install proof against production: the service's
        # directory artifact in the D19 layout, then a fresh `vlt ci`.
        env:
          SOCKET_PATCH_VENDORED_E2E_STRICT: '1'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::vendored vlt production attempt $attempt"
            status=0
            cargo test -p socket-patch-cli --test e2e_vendored_production -- \
              --include-ignored vlt_pinned_matrix --nocapture 2>&1 | tee vlt-vendored-production.log || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              python3 scripts/check-vlt-legs.py \
                --manifest crates/socket-patch-cli/tests/vlt-leg-manifest.json vlt-vendored-production.log
              exit $?
            fi
            echo "::warning title=vendored vlt production attempt $attempt failed::retrying"
            sleep $((attempt * 20))
          done
          echo "::error title=hosted-e2e::the vendored vlt production proof failed on all 3 attempts"
          exit 1

  # The aggregate required status check for the merge queue (and PRs). It needs
  # every job above, so adding a job here is how it becomes merge-blocking.
  # Skipped jobs (the nightly `full` tier) pass; failed or cancelled ones fail.
  ci-ok:
    name: ci-ok                 # registered as a required check; do not rename
    # A superseded PR must release its concurrency slot without waiting for
    # an aggregate runner. Keep an unconditional verdict in the merge queue
    # and on main: a cancelled dependency there must never pass the gate.
    if: ${{ always() && (github.event_name != 'pull_request' || !cancelled()) }}
    needs: [clippy, node-addon, lint-ecosystems, release-readiness, test, test-release, coverage, docker-base, coverage-docker, coverage-merge, dispatch-tests, e2e-build, e2e-build-windows, e2e-build-macos, e2e, e2e-gradle-mid, e2e-windows, e2e-full, e2e-docker, yarn-classic-matrix, yarn-berry-e2e, yarn-berry-full, cargo-vex-matrix, cargo-vex-matrix-windows, cargo-vex-matrix-full, cargo-old-toolchains, hosted-e2e, e2e-macos, yarn-berry-e2e-macos, cargo-vex-matrix-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every needed job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items()
                 if v["result"] not in ("success", "skipped")}
          for k, v in sorted(bad.items()):
              print(f"::error::{k}: {v}")
          sys.exit(1 if bad else 0)'
