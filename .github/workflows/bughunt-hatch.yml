name: bughunt-hatch
on:
  push:
    branches: ['bughunt/hatch/**']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build -p socket-patch-cli
      - name: Probe Hatch locked envs (pylock.toml)
        shell: bash
        run: |
          cat > mock.py <<'PY'
          import base64, hashlib, json, sys, io, zipfile, threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          ORG="test-org"; PURL="pkg:pypi/six@1.16.0"; UUID="5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d"; TOKEN="11111111-2222-4333-8444-555555555555"
          WHEEL="six-1.16.0-py2.py3-none-any.whl"
          PORT=int(sys.argv[1])
          orig=open(sys.argv[2],'rb').read(); patched=orig+b"\n# SOCKET-PATCHED\nSOCKET_PATCHED = 1\n"
          def gh(b): return hashlib.sha256(b"blob %d\0"%len(b)+b).hexdigest()
          def d(b): return base64.urlsafe_b64encode(hashlib.sha256(b).digest()).rstrip(b"=").decode()
          meta=b"Metadata-Version: 2.1\nName: six\nVersion: 1.16.0\nSummary: x\n"
          wh=b"Wheel-Version: 1.0\nGenerator: t\nRoot-Is-Purelib: true\nTag: py2-none-any\nTag: py3-none-any\n"
          mem=[("six.py",patched),("six-1.16.0.dist-info/METADATA",meta),("six-1.16.0.dist-info/WHEEL",wh)]
          rec="".join(f"{n},sha256={d(b)},{len(b)}\n" for n,b in mem)+"six-1.16.0.dist-info/RECORD,,\n"
          buf=io.BytesIO(); z=zipfile.ZipFile(buf,"w")
          for n,b in mem+[("six-1.16.0.dist-info/RECORD",rec.encode())]: z.writestr(n,b)
          z.close(); wheel=buf.getvalue(); SHA=hashlib.sha256(wheel).hexdigest(); S512="sha512-"+base64.b64encode(hashlib.sha512(wheel).digest()).decode()
          BASE=f"http://127.0.0.1:{PORT}"; APATH=f"/patch/pypi/six/1.16.0/{TOKEN}/{UUID}/{WHEEL}"; URL=BASE+APATH
          VIEW={"uuid":UUID,"purl":PURL,"publishedAt":"Fri, 27 Mar 2026 00:00:00 GMT","files":{"six.py":{"beforeHash":gh(orig),"afterHash":gh(patched),"blobContent":base64.b64encode(patched).decode()}},"vulnerabilities":{"GHSA-real-pypi-0001":{"cves":["CVE-2026-7201"],"summary":"s","severity":"high","description":"d"}},"description":"d","license":"MIT","tier":"free"}
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): sys.stderr.write("REQ "+self.command+" "+self.path+"\n")
              def j(self,o):
                  b=json.dumps(o).encode(); self.send_response(200); self.send_header("content-type","application/json"); self.send_header("content-length",str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("content-length",0)))
                  if self.path==f"/v0/orgs/{ORG}/patches/batch":
                      return self.j({"packages":[{"purl":PURL,"patches":[{"uuid":UUID,"purl":PURL,"tier":"free","cveIds":["CVE-2026-7201"],"ghsaIds":["GHSA-real-pypi-0001"],"severity":"high","title":"t"}]}],"canAccessPaidPatches":False})
                  if self.path==f"/v0/orgs/{ORG}/patches/package":
                      return self.j({"results":{UUID:{"status":"granted","url":URL,"purl":PURL,"artifacts":[{"kind":"tarball","url":URL,"integrity":{"sha256":SHA,"sha512":S512}}],"registryOverride":None}}})
                  self.send_response(404); self.end_headers()
              def do_GET(self):
                  p=self.path.split("?")[0]
                  if p.startswith(f"/v0/orgs/{ORG}/patches/by-package/"):
                      return self.j({"patches":[{"uuid":UUID,"purl":PURL,"publishedAt":"2026-03-27T00:00:00Z","description":"x","license":"MIT","tier":"free","vulnerabilities":{}}],"canAccessPaidPatches":False})
                  if p in (f"/patch/view/{UUID}",f"/v0/orgs/{ORG}/patches/view/{UUID}"): return self.j(VIEW)
                  if p.startswith(f"/v0/orgs/{ORG}/patches/blob/") or p.startswith("/patch/blob/"):
                      h=p.rsplit("/",1)[1]
                      for b in (orig,patched):
                          if gh(b)==h:
                              self.send_response(200); self.send_header("content-length",str(len(b))); self.end_headers(); self.wfile.write(b); return
                  if p==APATH:
                      self.send_response(200); self.send_header("content-type","application/octet-stream"); self.send_header("content-length",str(len(wheel))); self.end_headers(); self.wfile.write(wheel); return
                  self.send_response(404); self.end_headers()
              def do_HEAD(self):
                  p=self.path.split("?")[0]
                  if p==APATH:
                      self.send_response(200); self.send_header("content-type","application/octet-stream"); self.send_header("content-length",str(len(wheel))); self.end_headers(); return
                  self.send_response(404); self.end_headers()
          print("SHA",SHA,flush=True)
          ThreadingHTTPServer(("127.0.0.1",PORT),H).serve_forever()
          PY
          cat > probe_lock.py <<'PY'
          import json, os, subprocess, sys, shutil
          SP, W, VER, MODE = os.path.abspath(sys.argv[1]), os.path.abspath(sys.argv[2]), sys.argv[3], sys.argv[4]
          API = "http://127.0.0.1:18080"
          SPA = ["--api-url", API, "--api-token", "fake", "--org", "test-org", "--patch-server-url", API, "--ecosystems", "pypi"]
          shutil.rmtree(W, ignore_errors=True); proj = os.path.join(W, "app"); os.makedirs(os.path.join(proj, "src", "app"))
          open(os.path.join(proj, "src", "app", "__init__.py"), "w").close()
          open(os.path.join(proj, "pyproject.toml"), "w").write('[build-system]\nrequires = ["hatchling"]\nbuild-backend = "hatchling.build"\n\n[project]\nname = "app"\nversion = "0.1.0"\ndependencies = ["six==1.16.0"]\n\n[tool.hatch.envs.default]\nlocked = true\ninstaller = "uv"\n')
          env = dict(os.environ, SOCKET_NO_CONFIG="1", SOCKET_TELEMETRY_DISABLED="1", SOCKET_NO_UPDATE_CHECK="1", SOCKET_PATCH_SERVER_URL=API)
          for k in ("VIRTUAL_ENV", "UV", "UV_INTERNAL__PARENT_INTERPRETER"): env.pop(k, None)
          H = [os.path.abspath(sys.argv[5])]
          def run(cmd, data):
              return subprocess.run(cmd, cwd=proj, env=dict(env, HATCH_DATA_DIR=os.path.join(W, data)), capture_output=True, text=True, encoding="utf-8", errors="replace")
          def chk(data):
              r = run(H + ["run", "python", "-c", CHK], data)
              return r.stdout.strip()[-40:] or ("ERR " + r.stderr.strip()[-200:])
          CHK = 'import six;print("PATCHED" if hasattr(six,"SOCKET_PATCHED") else "UNPATCHED")'
          r = run(H + ["lock"], "d1"); print("hatch lock", r.returncode, (r.stderr or "")[-200:] if r.returncode else "")
          lock = os.path.join(proj, "pylock.toml")
          print("before scan:", chk("d1"))
          r = run([SP, "scan", "--mode", MODE, "--yes", "--json"] + SPA, "d1")
          try:
              d = json.loads(r.stdout[r.stdout.find("{"):]); sec = d.get("redirect") or d.get("vendor") or {}
              print("scan exit", r.returncode, "status", d.get("status"), "rewritten", sec.get("rewrittenFiles"), "summary", sec.get("summary"), "warnings", [w.get("code") for w in sec.get("warnings", [])])
          except Exception: print("scan raw", r.stdout[-400:], r.stderr[-400:])
          wired = open(lock, encoding="utf-8").read()
          print("pylock wired after scan:", ("127.0.0.1" in wired) or (".socket/vendor" in wired), "| pyproject rewritten:", "six @" in open(os.path.join(proj, "pyproject.toml"), encoding="utf-8").read())
          print("existing env:", chk("d1"))
          r = run(H + ["dep", "lock", "--check"], "d1"); print("lock --check exit", r.returncode)
          print("fresh env:", chk("d2"))
          after = open(lock, encoding="utf-8").read()
          print("pylock regenerated by hatch:", after != wired, "| still wired:", ("127.0.0.1" in after) or (".socket/vendor" in after))
          PY
          python -m pip install -q uv
          python -m pip download -q --no-deps six==1.16.0 -d sixdl
          python -c "import zipfile,glob;open('six.py','wb').write(zipfile.ZipFile(glob.glob('sixdl/*.whl')[0]).read('six.py'))"
          python mock.py 18080 six.py > mock.log 2>&1 &
          sleep 3
          cli=$PWD/target/debug/socket-patch; [ "$RUNNER_OS" = Windows ] && cli=$PWD/target/debug/socket-patch.exe
          for v in 1.17.0 1.18.1; do
            td="$RUNNER_TEMP/tools-$v"; bd="$RUNNER_TEMP/bin-$v"
            UV_TOOL_DIR="$td" UV_TOOL_BIN_DIR="$bd" python -m uv tool install -q "hatch==$v"
            hb="$bd/hatch"; [ "$RUNNER_OS" = Windows ] && hb="$bd/hatch.exe"
            for m in hosted vendored; do
              echo "################ $RUNNER_OS Hatch $v $m"
              if [ "$RUNNER_OS" = Windows ]; then
                python probe_lock.py "$(cygpath -w "$cli")" "$RUNNER_TEMP/l-$v-$m" "$v" "$m" "$(cygpath -w "$hb")" || echo "probe exit $?"
              else
                python probe_lock.py "$cli" "$RUNNER_TEMP/l-$v-$m" "$v" "$m" "$hb" || echo "probe exit $?"
              fi
            done
          done
