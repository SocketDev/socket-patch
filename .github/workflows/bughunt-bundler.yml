name: bughunt bundler probe
on:
  push:
    branches: ['bughunt/bundler/**']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup show
      - name: Build
        run: cargo build -p socket-patch-cli
      - name: Write mock
        run: |
          mkdir -p "$RUNNER_TEMP/w"
          cat > "$RUNNER_TEMP/w/mock.py" <<'PY'
          import hashlib, json, sys, base64
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          W=sys.argv[2]; PORT=int(sys.argv[1])
          UUID="7c8d9e0f-1a2b-4a1b-8c2d-3e4f5a6b7c8d"; PURL="pkg:gem/colorize@0.8.1"
          def gitsha(b): return hashlib.sha256(b"blob %d\0"%len(b)+b).hexdigest()
          orig=open(W+"/orig_colorize.rb","rb").read(); pat=orig+b"SOCKET_PATCHED_COLORIZE = true\n"
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): sys.stderr.write("%s %s\n"%(self.command,self.path))
              def send(self,body):
                  body=body.encode()
                  self.send_response(200); self.send_header("Content-Type","application/json"); self.send_header("Content-Length",str(len(body))); self.end_headers(); self.wfile.write(body)
              def do_POST(self):
                  n=int(self.headers.get("Content-Length",0)); self.rfile.read(n)
                  if self.path.split("?")[0].endswith("/patches/batch"):
                      return self.send(json.dumps({"packages":[{"purl":PURL,"patches":[{"uuid":UUID,"purl":PURL,"tier":"free","cveIds":[],"ghsaIds":[],"severity":"high","title":"t"}]}],"canAccessPaidPatches":False}))
                  self.send_response(404); self.end_headers()
              def do_GET(self):
                  p=self.path.split("?")[0]
                  if "/patches/by-package/" in p:
                      return self.send(json.dumps({"patches":[{"uuid":UUID,"purl":PURL,"publishedAt":"2026-01-01T00:00:00Z","description":"x","license":"MIT","tier":"free","vulnerabilities":{}}],"canAccessPaidPatches":False}))
                  if p.endswith("/patches/view/"+UUID):
                      return self.send(json.dumps({"uuid":UUID,"purl":PURL,"publishedAt":"2026-01-01T00:00:00Z","files":{"lib/colorize.rb":{"beforeHash":gitsha(orig),"afterHash":gitsha(pat),"blobContent":base64.b64encode(pat).decode(),"beforeBlobContent":base64.b64encode(orig).decode()}},"vulnerabilities":{"GHSA-xxxx-yyyy-zzzz":{"cves":["CVE-2026-1"],"summary":"s","severity":"high","description":"d"}},"description":"x","license":"MIT","tier":"free"}))
                  self.send_response(404); self.end_headers()
          ThreadingHTTPServer(("127.0.0.1",PORT),H).serve_forever()
          PY
          cd "$RUNNER_TEMP/w"
          gem fetch colorize -v 0.8.1
          gem unpack colorize-0.8.1.gem && cp colorize-0.8.1/lib/colorize.rb orig_colorize.rb
          ls -la
      - name: Probe cells
        run: |
          set +e
          W="$RUNNER_TEMP/w"
          BIN="$GITHUB_WORKSPACE/target/debug/socket-patch"; [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          PYEXE=python3; command -v python3 >/dev/null || PYEXE=python
          $PYEXE "$W/mock.py" 18777 "$W" > "$W/mock.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:18777/v0/orgs/org/patches/view/7c8d9e0f-1a2b-4a1b-8c2d-3e4f5a6b7c8d && break; sleep 1; done
          A="--api-url http://127.0.0.1:18777 --org org --api-token fake"
          probe() { # $1 ruby exe, rest: extra -g args
            local RB="$1"; shift
            "$RB" -e 'require "colorize"; puts "loaded=#{$LOADED_FEATURES.grep(/colorize\.rb/).first} patched=#{defined?(SOCKET_PATCHED_COLORIZE) ? 1 : 0}"' 2>&1 | tail -1
          }
          cycle() { # $1 label, $2 ruby exe, rest: -g args
            local L="$1" RB="$2"; shift 2
            local D="$W/cwd-$L"; rm -rf "$D"; mkdir -p "$D"; cd "$D"
            echo "::group::$L"
            "$BIN" scan -g --mode agent --json "$@" $A > scan.json 2>scan.err; echo "scan exit $?"; grep -E '"(scannedPackages|packagesWithPatches)"' scan.json; tail -3 scan.err
            "$BIN" get -g pkg:gem/colorize@0.8.1 --yes --json "$@" $A > get.json 2>get.err; echo "get exit $?"; grep -E '"(applied|failed|status)"' get.json | head -4; grep -i -E "denied|error" get.json get.err | head -5
            echo "after get: $(probe "$RB")"
            "$BIN" vex -g --product pkg:gem/app@1 --output v.json "$@" > vex.out 2>&1; echo "vex exit $?"; $PYEXE -c "import json;d=json.load(open('v.json'));print('VEX', [s['status'] for s in d['statements']])" 2>&1 | tail -1
            "$BIN" rollback -g --yes --json "$@" $A > rb.json 2>rb.err; echo "rollback exit $?"; grep -E '"(rolledBack|failed)"' rb.json | head -2
            echo "after rollback: $(probe "$RB")"
            echo "::endgroup::"
            echo "CELL $L: scan=$(grep -o '"packagesWithPatches": [0-9]*' scan.json) get=$(grep -o '"applied": [0-9]*' get.json | head -1) $(probe "$RB")"
            cd "$W"
          }
          if [ "$RUNNER_OS" = macOS ]; then
            # Cell 1: macOS system ruby, --user-install
            /usr/bin/ruby -v; /usr/bin/gem env | grep -A4 "GEM PATHS"
            /usr/bin/gem install --user-install colorize -v 0.8.1 --no-document
            PATH="/usr/bin:$PATH" cycle sys-user /usr/bin/ruby
            /usr/bin/gem uninstall --user-install colorize -x -a >/dev/null 2>&1
            # Cell 2: system ruby, root-owned /Library/Ruby/Gems (non-writable)
            sudo /usr/bin/gem install colorize -v 0.8.1 --no-document
            SG=$(/usr/bin/ruby -e 'print Gem.default_dir')
            ls -ld "$SG/gems"
            PATH="/usr/bin:$PATH" cycle sys-root /usr/bin/ruby
            PATH="/usr/bin:$PATH" cycle sys-root-prefix /usr/bin/ruby --global-prefix "$SG/gems"
            sudo /usr/bin/gem uninstall colorize -x -a >/dev/null 2>&1
            # Cell 3: Homebrew ruby
            brew install ruby >/dev/null 2>&1 || brew install ruby
            BR="$(brew --prefix ruby)/bin"; "$BR/ruby" -v
            "$BR/gem" install colorize -v 0.8.1 --no-document
            PATH="$BR:$PATH" cycle brew "$BR/ruby"
            PATH="$BR:$PATH" cycle brew-prefix "$BR/ruby" --global-prefix "$("$BR/ruby" -e 'print Gem.dir')/gems"
          fi
          RB=$(command -v ruby); ruby -v
          # Cell 4: unicode + space --global-prefix (GEM_HOME)
          GH="$RUNNER_TEMP/gh ü"; mkdir -p "$GH"
          gem install --install-dir "$GH" colorize -v 0.8.1 --no-document
          GEM_HOME="$GH" GEM_PATH="$GH" cycle unicode "$RB" --global-prefix "$GH/gems"
          # Cell 5: -g from inside a bundler project (vendor/bundle copy must stay untouched)
          gem install colorize -v 0.8.1 --no-document
          P="$W/proj"; mkdir -p "$P"; cd "$P"; printf 'source "https://rubygems.org"\ngem "colorize", "0.8.1"\n' > Gemfile
          bundle config set --local path vendor/bundle; bundle install --quiet
          cd "$P"; "$BIN" scan -g --mode agent --json $A > scan.json 2>&1; grep -E '"(scannedPackages|packagesWithPatches)"' scan.json
          "$BIN" get -g pkg:gem/colorize@0.8.1 --yes --json $A > get.json 2>&1; grep -E '"applied"' get.json
          echo "CELL in-project global: $(probe "$RB")"
          echo "CELL in-project bundle: $(bundle exec ruby -e 'require "colorize"; puts "loaded=#{$LOADED_FEATURES.grep(/colorize\.rb/).first} patched=#{defined?(SOCKET_PATCHED_COLORIZE) ? 1 : 0}"' 2>&1 | tail -1)"
          git -C "$GITHUB_WORKSPACE" status --short | head
          ls "$P" "$P/.socket" 2>&1 | head
          "$BIN" rollback -g --yes --json $A > rb.json 2>&1; grep -E '"rolledBack"' rb.json
          echo "CELL in-project after rollback: $(probe "$RB")"
          echo "=== mock log"; tail -20 "$W/mock.log"
