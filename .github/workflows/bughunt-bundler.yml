name: bughunt-bundler
on:
  push:
    branches: ['bughunt/bundler/**']
permissions:
  contents: read
jobs:
  agent:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        bundler: ['4.0.22', '2.6.9']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: false
          key: bughunt-${{ matrix.os }}
      - uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1.295.0
        with:
          ruby-version: '3.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build CLI
        run: cargo build --release -p socket-patch-cli
      - name: Probe
        env:
          BV: ${{ matrix.bundler }}
        run: |
          set +e
          T="$RUNNER_TEMP"; command -v cygpath >/dev/null && T=$(cygpath -m "$RUNNER_TEMP"); W="$T/bh"; mkdir -p "$W"; cd "$W"
          BIN="$GITHUB_WORKSPACE/target/release/socket-patch"
          R(){ echo "RESULT ${{ matrix.os }} bundler-$BV $1=$2"; }
          gem install bundler -v "$BV" --no-document >/dev/null; B="bundle _${BV}_"
          ruby -v; $B --version
          cat > mk.py <<'PY'
          import hashlib, json, os, sys
          proj, purl, rel, orig = sys.argv[1:5]
          o=open(orig,'rb').read(); p=o+b"\n$SOCKET_PATCHED = true\n"
          gh=lambda b: hashlib.sha256(b"blob %d\0"%len(b)+b).hexdigest()
          bh,ah=gh(o),gh(p); os.makedirs(f"{proj}/.socket/blobs",exist_ok=True)
          open(f"{proj}/.socket/blobs/{ah}",'wb').write(p); open(f"{proj}/.socket/blobs/{bh}",'wb').write(o)
          m={"patches":{purl:{"uuid":"11111111-2222-4333-8444-555555555555","exportedAt":"2024-01-01T00:00:00Z","files":{rel:{"beforeHash":bh,"afterHash":ah}},"vulnerabilities":{"GHSA-aaaa-bbbb-cccc":{"cves":[],"summary":"x","severity":"high","description":"x"}},"description":"x","license":"MIT","tier":"free"}}}
          json.dump(m,open(f"{proj}/.socket/manifest.json","w"))
          PY
          gem fetch colorize -v 0.8.1 >/dev/null && gem unpack colorize-0.8.1.gem --target pk >/dev/null
          ORIG="$W/pk/colorize-0.8.1/lib/colorize.rb"
          runtime(){ $B exec ruby -e 'require "colorize"; puts(defined?($SOCKET_PATCHED) ? "PATCHED" : "UNPATCHED")' 2>&1 | tail -1; }
          # --- 952: moved BUNDLE_GEMFILE, relative path in gemfiles/.bundle/config
          for spell in fwd back; do
            P="$W/m952-$spell"; mkdir -p "$P/gemfiles/.bundle"; cd "$P"
            printf 'source "https://rubygems.org"\ngem "colorize", "0.8.1"\n' > Gemfile; cp Gemfile gemfiles/alt.gemfile
            printf -- '---\nBUNDLE_PATH: "vendor/bundle"\n' > gemfiles/.bundle/config
            if [ $spell = back ]; then export BUNDLE_GEMFILE='gemfiles\alt.gemfile'; else export BUNDLE_GEMFILE=gemfiles/alt.gemfile; fi
            $B install >/dev/null 2>&1; echo "install rc=$?"
            $B exec ruby -e 'require "colorize"; puts Gem.loaded_specs["colorize"].full_gem_path'
            python "$W/mk.py" "$P" pkg:gem/colorize@0.8.1 lib/colorize.rb "$ORIG"
            "$BIN" apply --offline --json --cwd "$P" > a.json 2>a.err; echo "apply rc=$?"; head -c 1500 a.json; echo
            R "952-$spell-runtime" "$(runtime)"
            "$BIN" vex --cwd "$P" --product pkg:gem/app@1.0.0 --output v.json > /dev/null 2>v.err; R "952-$spell-vex-rc" "$?"
            python -c "import json; print('vex', [s['status'] for s in json.load(open('v.json'))['statements']])" 2>&1 | tail -1
            unset BUNDLE_GEMFILE; cd "$W"
          done
          # --- 1295: stale plugin registration
          P="$W/p1295"; mkdir -p "$P/.socket/bundler-plugin"; cd "$P"
          printf 'Gem::Specification.new do |s| s.name="socket-patch"; s.version="0.0.1"; s.summary="x"; s.authors=["x"]; s.files=["plugins.rb"]; end\n' > .socket/bundler-plugin/socket-patch.gemspec
          echo 'Bundler::Plugin.add_hook("before-install-all") { |d| }' > .socket/bundler-plugin/plugins.rb
          printf 'source "https://rubygems.org"\nplugin "socket-patch", path: ".socket/bundler-plugin"\ngem "colorize", "0.8.1"\n' > Gemfile
          $B config set --local path vendor/bundle >/dev/null; $B install >/dev/null 2>&1; cat .bundle/plugin/index
          rm -rf .socket/bundler-plugin; printf 'source "https://rubygems.org"\ngem "colorize", "0.8.1"\n' > Gemfile
          $B install > i.log 2>&1; R 1295-bundle-install-rc "$?"
          python "$W/mk.py" "$P" pkg:gem/colorize@0.8.1 lib/colorize.rb "$ORIG"
          "$BIN" apply --offline --json --cwd "$P" > a.json 2>a.err
          R 1295-warning "$(python -c "import json; print([w['code'] for w in json.load(open('a.json')).get('warnings',[])])")"
          cd "$W"
          # --- 1092: two builds of ffi side by side in one GEM_HOME
          export GEM_HOME="$W/ffihome"; export GEM_PATH="$GEM_HOME"
          gem install ffi -v 1.17.2 --platform ruby --no-document > f1.log 2>&1; echo "ruby build rc=$?"; tail -3 f1.log
          gem install ffi -v 1.17.2 --no-document > f2.log 2>&1; echo "native build rc=$?"
          gem install bundler -v "$BV" --no-document >/dev/null
          ls "$GEM_HOME/gems"
          P="$W/p1092"; mkdir -p "$P"; cd "$P"
          printf 'source "https://rubygems.org"\ngem "ffi", "1.17.2"\n' > Gemfile; $B lock >/dev/null 2>&1
          python "$W/mk.py" "$P" pkg:gem/ffi@1.17.2 lib/ffi/version.rb "$GEM_HOME/gems/ffi-1.17.2/lib/ffi/version.rb"
          "$BIN" apply --offline --json --cwd "$P" > a.json 2>a.err; R 1092-apply-rc "$?"; head -c 1500 a.json; echo; cat a.err | head -5
          for d in "$GEM_HOME"/gems/ffi-1.17.2*; do R "1092-patched-$(basename $d)" "$(grep -c SOCKET_PATCHED $d/lib/ffi/version.rb)"; done
          R 1092-runtime "$($B exec ruby -e 'require "ffi"; puts Gem.loaded_specs["ffi"].full_name + " " + (defined?($SOCKET_PATCHED) ? "PATCHED" : "UNPATCHED")' 2>&1 | tail -1)"
          "$BIN" vex --cwd "$P" --product pkg:gem/app@1.0.0 --output v.json > /dev/null 2>v.err; R 1092-vex-rc "$?"; cat v.err | tail -3
          "$BIN" rollback --offline --json --cwd "$P" > r.json 2>&1; R 1092-rollback-rc "$?"
          for d in "$GEM_HOME"/gems/ffi-1.17.2*; do R "1092-after-rollback-$(basename $d)" "$(grep -c SOCKET_PATCHED $d/lib/ffi/version.rb)"; done
          exit 0
