name: Publish RubyGems
run-name: "Publish RubyGems ${{ inputs.version }}${{ inputs.distinct-id != '' && format(' [{0}]', inputs.distinct-id) || '' }}"

# Publishes the CLI launcher gem (gem/socket-patch) via OIDC trusted
# publishing. The gem downloads the prebuilt binary from the GitHub release
# at its own version, so this workflow only needs the GitHub release +
# SHA256SUMS to exist. (The socket-patch-bundler plugin gem is no longer
# published: `setup` was removed in v5.)
#
# Dispatched two ways, both as a plain workflow_dispatch run:
#   - by release.yml (scripts/dispatch-publish.sh), as one leg of the
#     single-dispatch release fan-out — distinct-id carries the release
#     run's correlation id into this run's name;
#   - manually (Actions → Publish RubyGems → Run workflow), to retry just
#     this registry after a mid-release failure: fix the cause, enter the
#     release version, leave distinct-id blank.
# Every run checks out refs/tags/v<version>, so a manual retry publishes
# exactly what the release run would have.
#
# Idempotent: already-published versions are probed and skipped, so re-runs
# and partial-failure retries are safe.
#
# OIDC trusted publishing: the RubyGems trusted publisher on each gem is
# keyed on this repo + THIS file's name (publish-rubygems.yml) + environment
# `rubygems`. Because this workflow only ever runs as its own top-level
# workflow_dispatch run (never as a called reusable workflow), the OIDC
# token's workflow_ref and job_workflow_ref claims both name this file — one
# publisher registration covers every path.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z; the v<version> GitHub release must exist — the launcher gem downloads its binary from it)'
        required: true
        type: string
      distinct-id:
        description: 'Correlation id set by release.yml to track its dispatched run — leave blank for manual runs'
        required: false
        default: ''
        type: string

# Serialize same-version runs: the already-published probes below are
# check-then-act, so two CONCURRENT runs for one version could both pass a
# probe and the loser would hard-fail on the registry ("Repushing of gem
# versions is not allowed"). Serialized, a duplicate (e.g. re-dispatched by
# a release-run watcher whose `gh run watch` timed out while this run was
# still going) waits behind the live run and then no-ops. NOTE: the group
# holds at most ONE waiting run — a further same-version dispatch displaces
# (cancels) the waiting duplicate, and a watcher following the displaced
# run reports that as a failure; the publish itself is unaffected (the
# surviving runs no-op or publish).
concurrency:
  group: publish-rubygems-${{ inputs.version }}

permissions: {}

jobs:
  rubygems-publish:
    runs-on: ubuntu-latest
    # Bounds how long a wedged run (hung registry call) can hold this
    # workflow's per-version concurrency group before retries can proceed.
    # (A pending environment approval pauses the run BEFORE the job starts,
    # so it does not consume this timeout.)
    timeout-minutes: 45
    # OIDC trusted publishing scoped to a deployment environment; also lets a
    # maintainer gate publishing with required reviewers. Auto-created with no
    # protection rules until configured. NOTE: if required reviewers are ever
    # configured, a pending approval pauses THIS run while the release run's
    # watcher counts toward its own timeout-minutes — approve promptly. If
    # the watcher timed out, re-running it dispatches a NEW run that needs
    # its own approval before it can no-op; this run is unaffected either way.
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${VERSION}' is not a plain X.Y.Z release version"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      # Ruby is pre-installed on ubuntu-latest; no setup action needed.
      - name: Lint + version-check the launcher gem
        working-directory: gem/socket-patch
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ruby -c lib/socket_patch/launcher.rb
          ruby -c exe/socket-patch
          # The gemspec version is baked at the tag by scripts/version-sync.sh.
          gemver="$(ruby -e 'print Gem::Specification.load("socket-patch.gemspec").version')"
          if [ "$gemver" != "$EXPECTED_VERSION" ]; then
            echo "::error::gemspec version $gemver != release $EXPECTED_VERSION (run scripts/version-sync.sh before tagging)"
            exit 1
          fi

      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish socket-patch to RubyGems
        working-directory: gem/socket-patch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          gem build socket-patch.gemspec
          # `gem list -r -e -a` prints `socket-patch (3.3.0, 3.2.0, ...)`; match
          # this version as a precise list element (preceded by `(`/space,
          # followed by `,`/`)`).
          if gem list --remote --exact --all socket-patch 2>/dev/null | grep -qE "[ (]${VERSION}[,)]"; then
            echo "socket-patch ${VERSION} already on RubyGems; skipping."
            exit 0
          fi
          gem push "socket-patch-${VERSION}.gem"
