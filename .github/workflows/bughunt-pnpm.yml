name: bughunt pnpm virtual store probe

on:
  push:
    branches: ['bughunt/pnpm/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build CLI
        run: cargo build --release -p socket-patch-cli
      - name: Write probe scripts
        run: |
          mkdir -p "$RUNNER_TEMP/p"
          cat > "$RUNNER_TEMP/p/stage.py" <<'PYEOF'
          #!/usr/bin/env python3
          # stage.py PROJ PURL FILEKEY ORIGFILE  -> writes .socket/manifest.json + blob; patched = marker + orig
          import sys,json,hashlib,os
          proj,purl,key,orig=sys.argv[1:5]
          before=open(orig,'rb').read()
          after=b"/*SOCKET_PATCHED*/\n"+before
          h=lambda b: hashlib.sha256(b"blob %d\0"%len(b)+b).hexdigest()
          s=os.path.join(proj,'.socket');os.makedirs(s+'/blobs',exist_ok=True)
          m={"patches":{purl:{"uuid":"11111111-2222-4333-8444-555555555555","exportedAt":"2026-01-01T00:00:00Z",
           "files":{key:{"beforeHash":h(before),"afterHash":h(after)}},
           "vulnerabilities":{"GHSA-xxxx-pnpm-hunt":{"cves":["CVE-2024-99999"],"summary":"s","severity":"high","description":"d"}},
           "description":"marker","license":"MIT","tier":"free"}},"setup":{"manual":["npm"]}}
          open(s+'/manifest.json','w').write(json.dumps(m,indent=2))
          open(s+'/blobs/'+h(after),'wb').write(after)
          open(s+'/blobs/'+h(before),'wb').write(before)
          PYEOF
          cat > "$RUNNER_TEMP/p/gvs_repro.sh" <<'SHEOF'
          #!/usr/bin/env bash
          # usage: gvs_repro.sh PNPM_BIN SOCKET_PATCH_BIN
          set -u; HERE=$(cd "$(dirname "$0")" && pwd); PNPM=$1; SP=$2; export SOCKET_NO_CONFIG=1 SOCKET_NO_UPDATE_CHECK=1
          T=$(mktemp -d); cd "$T"
          # a and b use socket-patch; c never does. All three share one store with the global virtual store on.
          for p in a b c; do mkdir $p; echo '{"name":"'$p'","version":"0.0.0","private":true,"dependencies":{"left-pad":"1.3.0"}}' > $p/package.json
            printf 'enableGlobalVirtualStore: true\n' > $p/pnpm-workspace.yaml
            (cd $p && "$PNPM" install --store-dir "$T/store" >/dev/null 2>&1) || { echo "install failed"; exit 3; }; done
          echo "pnpm $("$PNPM" -v): a/node_modules/left-pad -> $(readlink a/node_modules/left-pad)"
          for p in a b; do python3 "$HERE/stage.py" $p pkg:npm/left-pad@1.3.0 package/index.js a/node_modules/left-pad/index.js; done
          echo "b apply: $(cd b && "$SP" apply --offline --json </dev/null | grep -o '"action": "[a-z_]*"')"
          echo "c (never ran socket-patch) after b's apply: $(head -c 18 c/node_modules/left-pad/index.js)"
          echo "a apply: $(cd a && "$SP" apply --offline --json </dev/null | grep -o '"action": "[a-z_]*"')"
          echo "a rollback: $(cd a && "$SP" rollback --json </dev/null | grep -o '"status": "[a-z_]*"' | head -1)"
          echo "b after a's rollback: $(head -c 18 b/node_modules/left-pad/index.js)  (b manifest entries: $(grep -c pkg:npm/left-pad b/.socket/manifest.json))"
          echo "b vex: $(cd b && "$SP" vex --offline --output v.json </dev/null 2>&1 | head -1)"
          rm -rf "$T"
          SHEOF
          cat > "$RUNNER_TEMP/p/vsd_repro.sh" <<'SHEOF'
          #!/usr/bin/env bash
          # usage: vsd_repro.sh PNPM_BIN SOCKET_PATCH_BIN MODE   (MODE: custom|gvs|default)
          set -u; HERE=$(cd "$(dirname "$0")" && pwd); PNPM=$1; SP=$2; MODE=$3; export SOCKET_NO_CONFIG=1 SOCKET_NO_UPDATE_CHECK=1
          T=$(mktemp -d); cd "$T"; mkdir p; cd p
          echo '{"name":"p","version":"0.0.0","private":true,"dependencies":{"is-odd":"3.0.1"}}' > package.json
          case $MODE in custom) printf 'virtual-store-dir=.vstore\n' > .npmrc; printf 'virtualStoreDir: .vstore\n' > pnpm-workspace.yaml;; gvs) printf 'enable-global-virtual-store=true\n' > .npmrc; printf 'enableGlobalVirtualStore: true\n' > pnpm-workspace.yaml;; esac
          "$PNPM" install --store-dir "$T/store" >/dev/null 2>&1 || { echo "install failed"; exit 3; }
          F=$(find "$T" -path '*/is-number/index.js' -not -path '*/.pnpm/node_modules/*' | head -1)
          python3 "$HERE/stage.py" . pkg:npm/is-number@6.0.0 package/index.js "$F"
          echo "pnpm $("$PNPM" -v) [$MODE] is-number at ${F#$T/}"
          "$SP" apply --offline --json </dev/null | grep -Eo '"(status|action|errorCode)": "[A-Za-z_]*"' | tr '\n' ' '; echo
          echo "node sees: $(node -e "console.log(require('fs').readFileSync(require.resolve('is-number',{paths:[require('path').dirname(require.resolve('is-odd'))]}),'utf8').slice(0,18))")"
          rm -rf "$T"
          SHEOF
          sed -i.bak 's/^          //' "$RUNNER_TEMP/p/"*.sh "$RUNNER_TEMP/p/stage.py"
          chmod +x "$RUNNER_TEMP/p/"*.sh
      - name: Probe
        run: |
          SP="$PWD/target/release/socket-patch"; [ -f "$SP.exe" ] && SP="$SP.exe"
          for v in 10.34.5 11.27.0 12.8.1; do
            npm install --prefix "$RUNNER_TEMP/pnpm-$v" --no-audit --no-fund "pnpm@$v" >/dev/null 2>&1
            PN="$RUNNER_TEMP/pnpm-$v/node_modules/.bin/pnpm"
            echo "=== gvs cross-project, pnpm $v"; "$RUNNER_TEMP/p/gvs_repro.sh" "$PN" "$SP" || true
            for m in default custom gvs; do echo "=== virtualStoreDir $m, pnpm $v"; "$RUNNER_TEMP/p/vsd_repro.sh" "$PN" "$SP" $m || true; done
          done
