name: bughunt yarn-classic probe
on:
  push:
    branches: ['bughunt/yarn-classic/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        yarn: ['1.10.1', '1.22.22']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build socket-patch
        run: cargo build --release -p socket-patch-cli
      - name: Install yarn
        run: npm install --prefix "$RUNNER_TEMP/y" yarn@${{ matrix.yarn }} && node "$RUNNER_TEMP/y/node_modules/yarn/bin/yarn.js" --version
      - name: Write harness
        run: |
          mkdir -p "$RUNNER_TEMP/h"
          cat > "$RUNNER_TEMP/h/mock.py" <<'MOCKEOF'
          #!/usr/bin/env python3
          """Minimal Socket patch API mock: left-pad@1.3.0 patch (prepends a marker to index.js)."""
          import base64, gzip, hashlib, io, json, os, sys, tarfile, urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          
          PORT = int(sys.argv[1]) if len(sys.argv) > 1 else 8787
          SRC = sys.argv[2] if len(sys.argv) > 2 else None   # optional local left-pad-1.3.0.tgz
          BASE = f"http://127.0.0.1:{PORT}"
          NAME, VER = "left-pad", "1.3.0"
          PURL = f"pkg:npm/{NAME}@{VER}"
          UUID = "11111111-2222-4333-8444-555555555555"
          MARKER = b"/* SOCKET-PATCHED-MOCK */\n"
          
          raw = open(SRC, "rb").read() if SRC else urllib.request.urlopen(
              f"https://registry.npmjs.org/{NAME}/-/{NAME}-{VER}.tgz").read()
          files = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as t:
              for m in t.getmembers():
                  if m.isfile():
                      files[m.name] = t.extractfile(m).read()
          orig = files["package/index.js"]
          patched = MARKER + orig
          files["package/index.js"] = patched
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w", format=tarfile.USTAR_FORMAT) as t:
              for n in sorted(files):
                  ti = tarfile.TarInfo(n); ti.size = len(files[n]); ti.mtime = 0; ti.mode = 0o644
                  t.addfile(ti, io.BytesIO(files[n]))
          gz = io.BytesIO()
          with gzip.GzipFile(fileobj=gz, mode="wb", mtime=0) as g:
              g.write(buf.getvalue())
          TGZ = gz.getvalue()
          
          def gsha(b): return hashlib.sha256(b"blob %d\0" % len(b) + b).hexdigest()
          BLOBS = {gsha(orig): orig, gsha(patched): patched}
          SRI = "sha512-" + base64.b64encode(hashlib.sha512(TGZ).digest()).decode()
          SHA1 = hashlib.sha1(TGZ).hexdigest()
          ART = f"{BASE}/artifacts/{UUID}/{NAME}-{VER}.tgz"
          SUMMARY = {"uuid": UUID, "purl": PURL, "tier": "free", "cveIds": ["CVE-2026-0001"],
                     "ghsaIds": ["GHSA-aaaa-bbbb-cccc"], "severity": "high", "title": "mock"}
          VIEW = {"uuid": UUID, "purl": PURL, "publishedAt": "2026-01-01T00:00:00Z",
                  "files": {"package/index.js": {"beforeHash": gsha(orig), "afterHash": gsha(patched),
                                                 "blobContent": base64.b64encode(patched).decode()}},
                  "vulnerabilities": {"GHSA-aaaa-bbbb-cccc": {"cves": ["CVE-2026-0001"], "summary": "s",
                                                               "severity": "high", "description": "d"}},
                  "description": "x", "license": "MIT", "tier": "free"}
          GRANT = {"status": "granted", "purl": PURL, "url": ART,
                   "artifacts": [{"kind": "tarball", "url": ART, "integrity": {"sha512": SRI, "sha1": SHA1}}],
                   "registryOverride": None}
          
          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): sys.stderr.write("MOCK %s\n" % (a[0] % a[1:]))
              def send(self, code, body, ctype="application/json"):
                  if not isinstance(body, bytes): body = json.dumps(body).encode()
                  self.send_response(code); self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              def do_GET(self):
                  p = self.path.split("?")[0]
                  if p.startswith(f"/artifacts/{UUID}/"): return self.send(200, TGZ, "application/octet-stream")
                  if "/by-package/" in p:
                      return self.send(200, {"patches": [dict(SUMMARY, publishedAt="2026-01-01T00:00:00Z",
                               description="x", license="MIT", vulnerabilities={})], "canAccessPaidPatches": False})
                  if p.endswith(f"/view/{UUID}"): return self.send(200, VIEW)
                  if "/blob/" in p:
                      h = p.rsplit("/", 1)[1]
                      return self.send(200, BLOBS[h], "application/octet-stream") if h in BLOBS else self.send(404, {})
                  self.send(404, {"error": "nf"})
              def do_POST(self):
                  p = self.path.split("?")[0]
                  body = self.rfile.read(int(self.headers.get("Content-Length") or 0)).decode("utf-8", "replace")
                  if p.endswith("/patches/batch") or p.endswith("/patch/batch"):
                      pk = [{"purl": PURL, "patches": [SUMMARY]}] if (NAME + "@" + VER) in body.replace("%40", "@") else []
                      return self.send(200, {"packages": pk, "canAccessPaidPatches": False})
                  if p.endswith("/package"):
                      return self.send(200, {"results": {UUID: GRANT} if UUID in body else {}})
                  self.send(404, {"error": "nf"})
          
          if __name__ == "__main__":
              print(json.dumps({"sri": SRI, "sha1": SHA1, "after": gsha(patched)}), flush=True)
              ThreadingHTTPServer(("127.0.0.1", PORT), H).serve_forever()
          MOCKEOF
          cat > "$RUNNER_TEMP/h/probe.sh" <<'PROBEEOF'
          #!/usr/bin/env bash
          set -u
          BIN="$1"; Y="node $2"
          T="$(cd "$RUNNER_TEMP" && pwd -W 2>/dev/null || pwd)"; W="$T/w"; rm -rf "$W"; mkdir -p "$W"
          API="--api-url http://127.0.0.1:8787 --org o --api-token x"
          export SOCKET_PATCH_SERVER_URL=http://127.0.0.1:8787 SOCKET_API_URL=http://127.0.0.1:8787 SOCKET_PROXY_URL=http://127.0.0.1:8787 SOCKET_TELEMETRY_DISABLED=1
          NODEBIN="$(node -p 'require("path").dirname(process.execPath)')"
          case "$RUNNER_OS" in Windows) PFX="$NODEBIN";; *) PFX="$(dirname "$NODEBIN")";; esac
          UH="$(node -p 'require("os").homedir()')"
          echo "prefix=$PFX userhome=$UH"
          cleanup(){ rm -f "$UH/.yarnrc" "$UH/.npmrc" "$PFX/etc/yarnrc" "$PFX/etc/npmrc"; [ "$(id -u)" = 0 ] && rm -f /usr/local/share/.yarnrc /usr/local/share/.npmrc; unset YARN_YARN_OFFLINE_MIRROR npm_config_yarn_offline_mirror; }
          cell(){ local N="$1" SETUP="$2"; cleanup; local D="$W/$N"; local M="$W/$N-mirror"; mkdir -p "$D/p" "$M"; cd "$D/p"
            echo '{"name":"p","version":"1.0.0","private":true,"dependencies":{"left-pad":"1.3.0"}}' > package.json
            eval "$SETUP"
            $Y install --no-progress --cache-folder "$D/c0" > "$D/i0.log" 2>&1 || { echo "RESULT $N BLOCKED initial-install"; tail -5 "$D/i0.log"; cleanup; return; }
            local ACTIVE; ACTIVE=$(ls "$M" | wc -l | tr -d ' ')
            "$BIN" scan --mode hosted --json --yes $API > "$D/scan.json" 2> "$D/scan.err"; local EX=$?
            local PIN; PIN=$(grep -c 8787 yarn.lock)
            local CODES; CODES=$(python -c "import json,sys;d=json.load(open(sys.argv[1]));r=d.get('redirect') or {};print(d.get('status'),[w['code'] for w in r.get('warnings',[])])" "$D/scan.json" 2>&1 | tr -d '\r')
            rm -rf node_modules; $Y install --frozen-lockfile --no-progress --cache-folder "$D/c1" > "$D/i1.log" 2>&1; local IE=$?
            local PT=UNPATCHED; grep -q SOCKET-PATCHED-MOCK node_modules/left-pad/index.js 2>/dev/null && PT=PATCHED
            local V="pass"
            if [ "$ACTIVE" != 0 ] && [ "$PIN" != 0 ]; then V="FAIL(pinned-under-active-mirror)"; fi
            if [ "$ACTIVE" = 0 ] && [ "$PIN" = 0 ]; then V="FAIL(refused-without-mirror)"; fi
            [ $IE -ne 0 ] && V="$V+install-failed"
            echo "RESULT $N $V mirror_active=$ACTIVE scan_exit=$EX pinned=$PIN [$CODES] frozen=$IE $PT"
            [ $IE -ne 0 ] && grep -i error "$D/i1.log" | head -3
            cd "$W"; cleanup; }
          MM='"$(cygpath -m "$M" 2>/dev/null || echo "$M")"'
          cell control ':'
          cell user-yarnrc-config-set '$Y config set yarn-offline-mirror "$(cygpath -m "$M" 2>/dev/null || echo "$M")" >/dev/null'
          cell user-npmrc 'echo "yarn-offline-mirror=$(cygpath -m "$M" 2>/dev/null || echo "$M")" > "$UH/.npmrc"'
          cell prefix-etc-yarnrc 'mkdir -p "$PFX/etc"; echo "yarn-offline-mirror \"$(cygpath -m "$M" 2>/dev/null || echo "$M")\"" > "$PFX/etc/yarnrc"'
          cell parent-yarnrc 'echo "yarn-offline-mirror \"$(cygpath -m "$M" 2>/dev/null || echo "$M")\"" > ../.yarnrc'
          cell env-yarn 'export YARN_YARN_OFFLINE_MIRROR="$(cygpath -m "$M" 2>/dev/null || echo "$M")"'
          cell env-npm 'export npm_config_yarn_offline_mirror="$(cygpath -m "$M" 2>/dev/null || echo "$M")"'
          cell bom-project-yarnrc 'printf "\xef\xbb\xbfyarn-offline-mirror \"%s\"\r\n" "$(cygpath -m "$M" 2>/dev/null || echo "$M")" > .yarnrc'
          if [ "$RUNNER_OS" = Windows ]; then
            cell ps51-bom-project-yarnrc 'powershell -NoProfile -Command "Set-Content -Path .yarnrc -Encoding utf8 -Value (\"yarn-offline-mirror \" + [char]34 + \"$(cygpath -m "$M")\" + [char]34)"; od -c .yarnrc | head -2'
            cell ps51-bom-user-yarnrc 'powershell -NoProfile -Command "Set-Content -Path \"$(cygpath -w "$UH")\\.yarnrc\" -Encoding utf8 -Value (\"yarn-offline-mirror \" + [char]34 + \"$(cygpath -m "$M")\" + [char]34)"'
            cell backslash-path-yarnrc 'echo "yarn-offline-mirror \"$(cygpath -w "$M" | sed "s/\\\\/\\\\\\\\/g")\"" > .yarnrc; cat .yarnrc'
          fi
          cell npm-false-yarn-path 'echo "yarn-offline-mirror \"$(cygpath -m "$M" 2>/dev/null || echo "$M")\"" > .yarnrc; echo "yarn-offline-mirror=false" > .npmrc'
          echo DONE
          PROBEEOF
      - name: Probe
        run: |
          python "$RUNNER_TEMP/h/mock.py" 8787 > "$RUNNER_TEMP/mock.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null -XPOST http://127.0.0.1:8787/x/package -d '{}' && break; sleep 1; done
          for i in 1 2 3 4 5; do curl -s -o /dev/null -XPOST http://127.0.0.1:8787/x/package -d '{}'; done
          BIN="$GITHUB_WORKSPACE/target/release/socket-patch"; [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          cd "$RUNNER_TEMP" && bash "$RUNNER_TEMP/h/probe.sh" "$BIN" "$RUNNER_TEMP/y/node_modules/yarn/bin/yarn.js" 2>&1 | grep -v '^Warning: --api-token\|Got: x' | tee "$RUNNER_TEMP/probe.log"
          echo "===== SUMMARY ${{ matrix.os }} yarn ${{ matrix.yarn }}"; grep '^RESULT' "$RUNNER_TEMP/probe.log"
