name: bughunt yarn-classic probe
on:
  push:
    branches: ['bughunt/yarn-classic/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pm: ['yarn@1.0.2', 'yarn@1.7.0', 'yarn@1.10.1', 'yarn@1.22.22', 'npm-control']
        image: ['node:22-alpine', 'node:22-bookworm-slim']
    steps:
      - name: Probe wrapper under ${{ matrix.pm }} on ${{ matrix.image }}
        run: |
          cat > probe.sh <<'PROBEEOF'
          set -u
          PM="$1"
          echo "libc: $(ldd --version 2>&1 | head -1)"; node --version
          mkdir -p /p && cd /p && echo '{"name":"p","version":"1.0.0","private":true}' > package.json
          if [ "$PM" = npm-control ]; then
            npm --version; npm install -D --no-audit --no-fund @socketsecurity/socket-patch@4.0.0 > /tmp/i.log 2>&1; echo "install exit $?"
          else
            V="${PM#yarn@}"; npm install --prefix /y --no-audit --no-fund "yarn@$V" > /dev/null 2>&1
            Y="node /y/node_modules/yarn/bin/yarn.js"; $Y --version
            $Y add -D @socketsecurity/socket-patch@4.0.0 --no-progress > /tmp/i.log 2>&1; echo "install exit $?"
          fi
          tail -3 /tmp/i.log
          echo "installed platform packages: $(ls node_modules/@socketsecurity | tr '\n' ' ')"
          node node_modules/@socketsecurity/socket-patch/bin/socket-patch --version > /tmp/o.txt 2> /tmp/e.txt; rc=$?
          echo "wrapper --version exit $rc stdout=[$(cat /tmp/o.txt)] stderr=[$(cat /tmp/e.txt)]"
          node -e 'const r=require("child_process").spawnSync(require("path").join(process.cwd(),"node_modules/@socketsecurity/socket-patch-linux-x64-gnu/socket-patch"),["--version"]);console.log("direct gnu spawn: status",r.status,"error",r.error&&r.error.code)' 2>&1 || true
          [ -x node_modules/@socketsecurity/socket-patch-linux-x64-musl/socket-patch ] && echo "direct musl: $(node_modules/@socketsecurity/socket-patch-linux-x64-musl/socket-patch --version 2>&1)"
          if [ "$PM" != npm-control ]; then
            $Y socket-patch --version > /tmp/o2.txt 2>&1; echo "yarn run socket-patch --version exit $? out=[$(tr '\n' ' ' < /tmp/o2.txt | cut -c1-300)]"
          fi
          echo "RESULT $PM $(cat /etc/os-release | grep ^ID= ) wrapper_exit=$rc"
          PROBEEOF
          docker run --rm -v "$PWD/probe.sh:/probe.sh:ro" ${{ matrix.image }} sh /probe.sh '${{ matrix.pm }}'
