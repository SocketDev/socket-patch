name: bughunt yarn-classic probe
on:
  push:
    branches: ['bughunt/yarn-classic/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        yarn: ['1.10.1', '1.22.22']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build socket-patch
        run: cargo build --release -p socket-patch-cli
      - name: Install yarn
        run: npm install --prefix "$RUNNER_TEMP/y" yarn@${{ matrix.yarn }} && node "$RUNNER_TEMP/y/node_modules/yarn/bin/yarn.js" --version
      - name: Write harness
        run: |
          mkdir -p "$RUNNER_TEMP/h"
          cat > "$RUNNER_TEMP/h/mock.py" <<'MOCKEOF'
          #!/usr/bin/env python3
          """Minimal Socket patch API mock: left-pad@1.3.0 patch (prepends a marker to index.js)."""
          import base64, gzip, hashlib, io, json, os, sys, tarfile, urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          
          PORT = int(sys.argv[1]) if len(sys.argv) > 1 else 8787
          SRC = sys.argv[2] if len(sys.argv) > 2 else None   # optional local left-pad-1.3.0.tgz
          BASE = f"http://127.0.0.1:{PORT}"
          NAME, VER = "left-pad", "1.3.0"
          PURL = f"pkg:npm/{NAME}@{VER}"
          UUID = "11111111-2222-4333-8444-555555555555"
          MARKER = b"/* SOCKET-PATCHED-MOCK */\n"
          
          raw = open(SRC, "rb").read() if SRC else urllib.request.urlopen(
              f"https://registry.npmjs.org/{NAME}/-/{NAME}-{VER}.tgz").read()
          files = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as t:
              for m in t.getmembers():
                  if m.isfile():
                      files[m.name] = t.extractfile(m).read()
          orig = files["package/index.js"]
          patched = MARKER + orig
          files["package/index.js"] = patched
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w", format=tarfile.USTAR_FORMAT) as t:
              for n in sorted(files):
                  ti = tarfile.TarInfo(n); ti.size = len(files[n]); ti.mtime = 0; ti.mode = 0o644
                  t.addfile(ti, io.BytesIO(files[n]))
          gz = io.BytesIO()
          with gzip.GzipFile(fileobj=gz, mode="wb", mtime=0) as g:
              g.write(buf.getvalue())
          TGZ = gz.getvalue()
          
          def gsha(b): return hashlib.sha256(b"blob %d\0" % len(b) + b).hexdigest()
          BLOBS = {gsha(orig): orig, gsha(patched): patched}
          SRI = "sha512-" + base64.b64encode(hashlib.sha512(TGZ).digest()).decode()
          SHA1 = hashlib.sha1(TGZ).hexdigest()
          ART = f"{BASE}/artifacts/{UUID}/{NAME}-{VER}.tgz"
          SUMMARY = {"uuid": UUID, "purl": PURL, "tier": "free", "cveIds": ["CVE-2026-0001"],
                     "ghsaIds": ["GHSA-aaaa-bbbb-cccc"], "severity": "high", "title": "mock"}
          VIEW = {"uuid": UUID, "purl": PURL, "publishedAt": "2026-01-01T00:00:00Z",
                  "files": {"package/index.js": {"beforeHash": gsha(orig), "afterHash": gsha(patched),
                                                 "blobContent": base64.b64encode(patched).decode()}},
                  "vulnerabilities": {"GHSA-aaaa-bbbb-cccc": {"cves": ["CVE-2026-0001"], "summary": "s",
                                                               "severity": "high", "description": "d"}},
                  "description": "x", "license": "MIT", "tier": "free"}
          GRANT = {"status": "granted", "purl": PURL, "url": ART,
                   "artifacts": [{"kind": "tarball", "url": ART, "integrity": {"sha512": SRI, "sha1": SHA1}}],
                   "registryOverride": None}
          
          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): sys.stderr.write("MOCK %s\n" % (a[0] % a[1:]))
              def send(self, code, body, ctype="application/json"):
                  if not isinstance(body, bytes): body = json.dumps(body).encode()
                  self.send_response(code); self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              def do_GET(self):
                  p = self.path.split("?")[0]
                  if p.startswith(f"/artifacts/{UUID}/"): return self.send(200, TGZ, "application/octet-stream")
                  if "/by-package/" in p:
                      return self.send(200, {"patches": [dict(SUMMARY, publishedAt="2026-01-01T00:00:00Z",
                               description="x", license="MIT", vulnerabilities={})], "canAccessPaidPatches": False})
                  if p.endswith(f"/view/{UUID}"): return self.send(200, VIEW)
                  if "/blob/" in p:
                      h = p.rsplit("/", 1)[1]
                      return self.send(200, BLOBS[h], "application/octet-stream") if h in BLOBS else self.send(404, {})
                  self.send(404, {"error": "nf"})
              def do_POST(self):
                  p = self.path.split("?")[0]
                  body = self.rfile.read(int(self.headers.get("Content-Length") or 0)).decode("utf-8", "replace")
                  if p.endswith("/patches/batch") or p.endswith("/patch/batch"):
                      pk = [{"purl": PURL, "patches": [SUMMARY]}] if (NAME + "@" + VER) in body.replace("%40", "@") else []
                      return self.send(200, {"packages": pk, "canAccessPaidPatches": False})
                  if p.endswith("/package"):
                      return self.send(200, {"results": {UUID: GRANT} if UUID in body else {}})
                  self.send(404, {"error": "nf"})
          
          if __name__ == "__main__":
              print(json.dumps({"sri": SRI, "sha1": SHA1, "after": gsha(patched)}), flush=True)
              ThreadingHTTPServer(("127.0.0.1", PORT), H).serve_forever()
          MOCKEOF
          cat > "$RUNNER_TEMP/h/probe.sh" <<'PROBEEOF'
          #!/usr/bin/env bash
          # usage: probe.sh <socket-patch bin> <yarn.js>
          set -u
          BIN="$1"; YJS="$2"; Y(){ node "$YJS" "$@"; }
          W="${PROBE_WORK:-$PWD/work}"; rm -rf "$W"; mkdir -p "$W"
          export SOCKET_API_URL=http://127.0.0.1:8787 SOCKET_PROXY_URL=http://127.0.0.1:8787 SOCKET_PATCH_SERVER_URL=http://127.0.0.1:8787 SOCKET_API_TOKEN=x SOCKET_ORG_SLUG=o
          res(){ echo "RESULT $1 $2 ${3:-}"; }
          patched(){ grep -q SOCKET-PATCHED-MOCK "$1/node_modules/left-pad/index.js" 2>/dev/null; }
          eolsig(){ python -c "import sys;t=open(sys.argv[1],'rb').read();print(t.count(b'\r\n'),t.count(b'\n')-t.count(b'\r\n'))" "$1"; }
          # shape: native | lf | crlf | mixed | bomcrlf
          mk(){ local n="$1" shape="$2"; local d="$W/$n"; mkdir -p "$d"; cd "$d"
            echo '{"name":"p","version":"1.0.0","private":true,"dependencies":{"is-number":"^7.0.0","left-pad":"1.3.0","ms":"2.1.3"}}' > package.json
            Y install --no-progress --cache-folder "$W/cache" > "$W/$n.i.log" 2>&1 || { res "$n" BLOCKED install; return 1; }
            rm -rf node_modules
            python - "$shape" <<'PY'
          import sys
          s=sys.argv[1]; t=open('yarn.lock','rb').read().decode().replace('\r\n','\n')
          if s=='native': sys.exit(0)
          if s=='lf': out=t
          elif s=='crlf': out=t.replace('\n','\r\n')
          elif s=='bomcrlf': out='﻿'+t.replace('\n','\r\n')
          elif s=='mixed':
              a,b=t.split('left-pad@',1); out=a.replace('\n','\r\n')+'left-pad@'+b.replace('\n','\r\n',0)
              # keep left-pad block LF, rest CRLF
              lp,rest=b.split('\n\n',1); out=a.replace('\n','\r\n')+'left-pad@'+lp+'\n\n'+rest.replace('\n','\r\n')
          open('yarn.lock','wb').write(out.encode())
          PY
            cp yarn.lock "$W/$n.orig"; echo "$n orig eol(crlf,lf)=$(eolsig yarn.lock)"; }
          fresh(){ local n="$1"; local f="$W/$n-fresh-$RANDOM"; mkdir -p "$f"; cp package.json yarn.lock "$f/"; [ -d .socket ] && cp -r .socket "$f/"
            (cd "$f" && Y install --frozen-lockfile --no-progress --cache-folder "$W/cache-$n-$RANDOM" > "$W/$n.fresh.log" 2>&1); local e=$?; patched "$f" && echo "PATCHED:$e" || echo "UNPATCHED:$e"; }
          for shape in native lf crlf mixed bomcrlf; do for mode in hosted vendored; do
            n="$mode-$shape"; mk "$n" "$shape" || continue
            extra=""; [ $mode = vendored ] && extra="--vendor-source service"
            "$BIN" scan --mode $mode $extra --json --yes > "$W/$n.scan.json" 2>"$W/$n.scan.err"; se=$?
            echo "$n after-scan eol=$(eolsig yarn.lock)"; diff "$W/$n.orig" yarn.lock | cat -A | head -12
            st=$(fresh "$n"); [ "${st%%:*}" = PATCHED ] && [ $se = 0 ] && res "$n-install" PASS "$st" || { tail -5 "$W/$n.scan.err" "$W/$n.fresh.log"; res "$n-install" FAIL "scan=$se $st"; }
            # only the left-pad block may differ, and line endings must be unchanged outside it
            python - "$W/$n.orig" yarn.lock <<'PY' && res "$n-untouched-bytes" PASS || res "$n-untouched-bytes" FAIL
          import sys
          a=open(sys.argv[1],'rb').read().split(b'\n'); b=open(sys.argv[2],'rb').read().split(b'\n')
          if len(a)!=len(b): print('line count',len(a),len(b)); sys.exit(1)
          bad=[(i,x,y) for i,(x,y) in enumerate(zip(a,b)) if x!=y and not (b'resolved ' in x and b'resolved ' in y) and not (b'integrity ' in x and b'integrity ' in y)]
          eol=[(i,x,y) for i,(x,y) in enumerate(zip(a,b)) if x.endswith(b'\r')!=y.endswith(b'\r')]
          for r in (bad+eol)[:5]: print(r)
          sys.exit(1 if bad or eol else 0)
          PY
            "$BIN" rollback --json --yes > "$W/$n.rb.json" 2>&1; re=$?
            if [ $mode = vendored ]; then cmp -s "$W/$n.orig" yarn.lock && res "$n-rollback" PASS || { diff "$W/$n.orig" yarn.lock | cat -A | head; res "$n-rollback" FAIL "rb=$re"; }
            else st=$(fresh "$n-rb"); [ $re = 0 ] && [ "${st%%:*}" = UNPATCHED ] && [ "${st##*:}" = 0 ] && res "$n-rollback" PASS "eol=$(eolsig yarn.lock)" || { head -30 "$W/$n.rb.json"; res "$n-rollback" FAIL "rb=$re $st"; }; fi
          done; done
          # fork shapes (B16): Windows-style backslash file: tarball and URL forks must be left alone
          for spec in 'file:forks\\left-pad-1.3.0.tgz' 'file:./forks/left-pad-1.3.0.tgz'; do for mode in hosted vendored; do
            n="fork-$mode-$(echo "$spec" | tr -dc 'a-z' | cut -c1-8)$RANDOM"; d="$W/$n"; mkdir -p "$d/forks"; cd "$d"
            cp "$W/../fork.tgz" forks/left-pad-1.3.0.tgz
            printf '{"name":"p","version":"1.0.0","private":true,"dependencies":{"left-pad":"%s"}}\n' "$spec" > package.json
            Y install --no-progress --cache-folder "$W/cache-fork" > "$W/$n.i.log" 2>&1 || { tail -3 "$W/$n.i.log"; res "$n" BLOCKED install; continue; }
            head -12 yarn.lock | tail -4; cp yarn.lock "$W/$n.orig"
            extra=""; [ $mode = vendored ] && extra="--vendor-source service"
            "$BIN" scan --mode $mode $extra --json --yes > "$W/$n.scan.json" 2>&1; se=$?
            codes=$(grep -o '"[a-zA-Z]*[cC]ode": "[a-z_]*"' "$W/$n.scan.json" | cut -d'"' -f4 | sort -u | tr '\n' ' ')
            cmp -s "$W/$n.orig" yarn.lock && grep -q "non_registry\|not_rewritable" "$W/$n.scan.json" && res "$n" PASS "$codes" || { diff "$W/$n.orig" yarn.lock; res "$n" FAIL "scan=$se $codes"; }
          done; done
          echo DONE
          PROBEEOF
          curl -sS -o "$RUNNER_TEMP/lp.tgz" https://registry.npmjs.org/left-pad/-/left-pad-1.3.0.tgz
          python - "$RUNNER_TEMP/lp.tgz" "$RUNNER_TEMP/fork.tgz" <<'PY'
          import sys, tarfile, io
          src = tarfile.open(sys.argv[1]); out = tarfile.open(sys.argv[2], 'w:gz')
          for m in src.getmembers():
              data = src.extractfile(m).read() if m.isfile() else None
              if m.name == 'package/index.js': data = b'/* USER-FORK */\n' + data; m.size = len(data)
              out.addfile(m, io.BytesIO(data) if data is not None else None)
          out.close()
          PY
      - name: Probe
        run: |
          python "$RUNNER_TEMP/h/mock.py" 8787 "$RUNNER_TEMP/lp.tgz" > "$RUNNER_TEMP/mock.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null -XPOST http://127.0.0.1:8787/x/package -d '{}' && break; sleep 1; done
          for i in 1 2 3 4 5; do curl -s -o /dev/null -XPOST http://127.0.0.1:8787/v0/orgs/o/patches/batch -d '{}'; done
          BIN="$GITHUB_WORKSPACE/target/release/socket-patch"; [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          cd "$RUNNER_TEMP" && PROBE_WORK="$RUNNER_TEMP/w" bash "$RUNNER_TEMP/h/probe.sh" "$BIN" "$RUNNER_TEMP/y/node_modules/yarn/bin/yarn.js" 2>&1 | grep -v '^Warning: SOCKET_API_TOKEN\|Got: x' | tee "$RUNNER_TEMP/probe.log"
          echo "===== SUMMARY ${{ matrix.os }} yarn ${{ matrix.yarn }}"; grep '^RESULT' "$RUNNER_TEMP/probe.log"
