name: bughunt yarn-classic windows paths probe
on:
  push:
    branches: ['bughunt/yarn-classic/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: build
        run: cargo build --release -p socket-patch-cli
      - name: probe
        env:
          KIT: 
          ONLY_BASE: "1"
        run: |
          set +e -u
          RT=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          M="$RT/kit"; mkdir -p "$M"; echo "$KIT" | base64 -d | tar -xzf - -C "$M"
          SP="$PWD/target/release/socket-patch"; [ -f "$SP.exe" ] && SP="$SP.exe"
          for YV in 1.10.1 1.22.22; do
            T="$RT/t$YV"; mkdir -p "$T"
            SP="$SP" M="$M" T="$T" YV="$YV" bash "$M/probe.sh" 2>&1 | tee "$RT/out$YV.txt"
          done
          echo "=== SUMMARY"; grep -h RESULT "$RT"/out*.txt
