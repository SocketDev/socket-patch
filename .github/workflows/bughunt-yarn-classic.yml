name: bughunt yarn-classic member install probe
on:
  push:
    branches: ['bughunt/yarn-classic/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        yarn: ['1.7.0', '1.10.1', '1.22.22']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: probe
        env:
          YV: ${{ matrix.yarn }}
          TGZ: 
        run: |
          set +e -u
          T="$RUNNER_TEMP"
          npm i --silent --no-audit --no-fund --prefix "$T/y" "yarn@$YV" >/dev/null 2>&1
          Y() { node "$T/y/node_modules/yarn/bin/yarn.js" "$@"; }
          echo "yarn $(Y -v)"
          mk() {
            D="$T/$1"; rm -rf "$D"; mkdir -p "$D/a" "$D/b" "$D/.socket/vendor/npm/2b3c4d5e-6f7a-4b2c-9d3e-123456789abc"
            echo '{"name":"root","private":true,"workspaces":["a","b"]}' > "$D/package.json"
            echo '{"name":"a","version":"1.0.0","dependencies":{"left-pad":"^1.1.0"}}' > "$D/a/package.json"
            echo '{"name":"b","version":"1.0.0","dependencies":{"isarray":"2.0.5"}}' > "$D/b/package.json"
            echo "$TGZ" | base64 -d > "$D/.socket/vendor/npm/2b3c4d5e-6f7a-4b2c-9d3e-123456789abc/left-pad-1.3.0.tgz" 2>/dev/null || echo "$TGZ" | base64 -D > "$D/.socket/vendor/npm/2b3c4d5e-6f7a-4b2c-9d3e-123456789abc/left-pad-1.3.0.tgz"
            { printf '# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.\n# yarn lockfile v1\n\n\n'
              printf 'isarray@2.0.5:\n  version "2.0.5"\n  resolved "https://registry.yarnpkg.com/isarray/-/isarray-2.0.5.tgz#8af1e4c1221244cc62459faf38940d4e644a5723"\n  integrity sha512-xHjhDr3cNBK0BzdUJSPXZntQUx/mwMS5Rw4A7lPJ90XGAO6ISP/ePDNuo0vhqOZU+UD5JoodwCAAoZQd3FeAKw==\n\n'
              if [ "$2" = vendored ]; then
                printf 'left-pad@^1.1.0:\n  version "1.3.0"\n  resolved "file:./.socket/vendor/npm/2b3c4d5e-6f7a-4b2c-9d3e-123456789abc/left-pad-1.3.0.tgz#8d2ec97166e1c4e2bd92f19a305dfd2f820d65d0"\n  integrity sha512-PLM41HqSfDrekm31LuXwqnwntwUmYqEl85mLyS8+QibYlNfAtfb/It6cNNdmpNFPRCgfPabtyVycGtUe2K0Nmg==\n'
              else
                printf 'left-pad@^1.1.0:\n  version "1.3.0"\n  resolved "https://registry.yarnpkg.com/left-pad/-/left-pad-1.3.0.tgz#5b8a3a7765dfe001261dde915589e782f8c94d1e"\n  integrity sha512-XI5MPzVNApjAyhQzphX8BkmKsKUxD4LdyK24iZeQGinBN9yTQT3bFlCBy/aVx2HrNcqQGsdot8ghrjyrvMCoEA==\n'
              fi; } > "$D/yarn.lock"
          }
          res() { if [ "$2" = 0 ]; then r=pass; else r="FAIL($2) $(grep -o 'Tarball is not in network' "$3" | head -1)"; fi; echo "RESULT os=$RUNNER_OS yarn=$YV cell=$1 -> $r"; }
          mk vroot vendored; (cd "$T/vroot" && YARN_CACHE_FOLDER="$T/c1" Y install --frozen-lockfile --no-progress > "$T/l1" 2>&1); res vendored-root-install $? "$T/l1"
          head -c 40 "$T/vroot/node_modules/left-pad/index.js"; echo
          mk vmem vendored; (cd "$T/vmem/b" && YARN_CACHE_FOLDER="$T/c2" Y install --frozen-lockfile --no-progress > "$T/l2" 2>&1); res vendored-member-install $? "$T/l2"
          mk vcwd vendored; (cd "$T/vcwd" && YARN_CACHE_FOLDER="$T/c3" Y --cwd b install --frozen-lockfile --no-progress > "$T/l3" 2>&1); res vendored-cwd-member-install $? "$T/l3"
          mk vws vendored; (cd "$T/vws" && YARN_CACHE_FOLDER="$T/c5" Y workspace b add is-number@7.0.0 --no-progress > "$T/l5" 2>&1); res vendored-workspace-b-add $? "$T/l5"
          mk rmem registry; (cd "$T/rmem/b" && YARN_CACHE_FOLDER="$T/c4" Y install --frozen-lockfile --no-progress > "$T/l4" 2>&1); res baseline-registry-member-install $? "$T/l4"
          tail -5 "$T/l2"
