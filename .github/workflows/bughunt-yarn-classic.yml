name: bughunt yarn-classic probe
on:
  push:
    branches: ['bughunt/yarn-classic/**']
permissions:
  contents: read
jobs:
  probe:
    name: global ${{ matrix.os }} yarn ${{ matrix.yarn }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        yarn: ['1.0.2', '1.10.1', '1.22.22']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: bughunt-yarn-classic
          save-if: false
      - name: Build
        shell: bash
        run: cargo build --release -p socket-patch-cli
      - name: Install yarn via npm
        shell: bash
        run: npm i -g yarn@${{ matrix.yarn }} && yarn --version
      - name: Probe
        shell: bash
        env:
          YV: ${{ matrix.yarn }}
          BH: 
        run: |
          mkdir -p .bh && echo "$BH" | base64 -d | tar xz -C .bh --strip-components=1
          bash .bh/probe.sh
