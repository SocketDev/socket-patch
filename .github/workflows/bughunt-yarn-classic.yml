name: bughunt yarn-classic probe
on:
  push:
    branches: ['bughunt/yarn-classic/**']
permissions:
  contents: read
jobs:
  probe:
    name: macdiag ${{ matrix.os }} ${{ matrix.ref }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        ref: ['045d7ec783d788bf3c5a1310724b51e09fb6505d', '6cd37540b61920f13cbef47f0c4a2d6bfde9df20', 'bf0e0d14dc20f69c40c5bf7744e1545aeb055877']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: bughunt-yarn-classic
          save-if: false
      - name: Build
        shell: bash
        run: cargo build --release -p socket-patch-cli
      - name: Install yarn via npm
        shell: bash
        run: npm i -g yarn@1.22.22 && yarn --version
      - name: Probe
        shell: bash
        env:
          BH: 
        run: |
          mkdir -p .bh && echo "$BH" | base64 -d | tar xz
          bash .bh/probe.sh
