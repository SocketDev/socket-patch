name: bughunt-gradle probe
on:
  push:
    branches: ['bughunt/gradle/**']
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.os }} gradle ${{ matrix.gradle }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        gradle: ['6.9.4', '7.6.6', '9.8.0']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup show
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.gradle == '6.9.4' && '11' || (matrix.gradle == '7.6.6' && '17' || '21') }}
      - name: Tools
        shell: bash
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
        run: |
          set -euo pipefail
          url="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          launcher="$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle"
          mvnurl="https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz"
          curl -fsSL --retry 3 "$mvnurl" -o "$RUNNER_TEMP/maven.tgz"
          python -m tarfile -e "$RUNNER_TEMP/maven.tgz" "$RUNNER_TEMP"
          mvn="$RUNNER_TEMP/apache-maven-3.9.11/bin/mvn"
          if [ "$RUNNER_OS" = Windows ]; then launcher="${launcher}.bat"; mvn="${mvn}.cmd"; fi
          echo "BH_GRADLE=$launcher" >> "$GITHUB_ENV"
          echo "MVN=$mvn" >> "$GITHUB_ENV"
          git config --show-origin --get core.autocrlf || echo "autocrlf unset"
      - name: Unpack harness
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,sys; open(sys.argv[1],'wb').write(base64.b64decode(sys.argv[2]))" "$RUNNER_TEMP/pkg.tgz" ''
          mkdir -p "$RUNNER_TEMP/pkg"
          python -m tarfile -e "$RUNNER_TEMP/pkg.tgz" "$RUNNER_TEMP/pkg"
          cp "$RUNNER_TEMP/pkg/zz_bughunt_gradle.rs" crates/socket-patch-cli/tests/
          mkdir -p "$RUNNER_TEMP/seed" "$RUNNER_TEMP/m2" "$RUNNER_TEMP/ghome" "$RUNNER_TEMP/t"
          cd "$RUNNER_TEMP/seed"
          for a in org.apache.commons:commons-text:1.10.0 org.junit:junit-bom:5.9.0:module org.junit:junit-bom:5.9.1:module; do
            "$MVN" -B -q "-Dmaven.repo.local=$RUNNER_TEMP/m2" org.apache.maven.plugins:maven-dependency-plugin:3.6.1:get "-Dartifact=$a" -Dtransitive=false || "$MVN" -B -q "-Dmaven.repo.local=$RUNNER_TEMP/m2" org.apache.maven.plugins:maven-dependency-plugin:3.6.1:get "-Dartifact=$a"
          done
          "$MVN" -B -q "-Dmaven.repo.local=$RUNNER_TEMP/m2" org.apache.maven.plugins:maven-dependency-plugin:3.6.1:get -Dartifact=org.apache.commons:commons-text:1.10.0
      - name: Build harness
        shell: bash
        run: cargo test -p socket-patch-cli --test zz_bughunt_gradle --no-run
      - name: Run scenarios
        shell: bash
        run: |
          export BH_M2="$RUNNER_TEMP/m2" BH_GHOME="$RUNNER_TEMP/ghome" TMPDIR="$RUNNER_TEMP/t"
          for s in s1 s2 s6 s9 s12 s14; do
            echo "################ SCENARIO $s"
            BH_SCEN="$RUNNER_TEMP/pkg/scen/$s" BH_WORK="$RUNNER_TEMP/work/$s" BH_REVERT=1 \
              cargo test -q -p socket-patch-cli --test zz_bughunt_gradle bh -- --exact --ignored --nocapture 2>&1 \
              | grep -E "VENDOR exit|\"status\"|errorCode|\"error\"|CHECK|autocrlf|^0000|GRADLE|CP |What went wrong|socket-patch:|REVERT exit|^ ?[MDA?]{1,2} " || true
          done
