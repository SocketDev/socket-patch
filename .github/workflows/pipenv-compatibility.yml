name: Pipenv compatibility

# Drives the real CLI and real Pipenv releases through hosted, vendored,
# agent and out-of-tree agent mode on Linux and macOS (the `test` job already
# runs the in-process hosted Pipenv CLI tests on all three platforms,
# Windows included). The pre-2018 releases need Docker and stay in the local
# matrix (`docs/testing/pipenv-compatibility.md`). Needs network (PyPI + the
# public patch service); no Socket token.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only this ecosystem's own files. A change to shared engine code
    # (vendor/, patch/, vex/, scan/, Cargo.lock, ...) runs the full matrix on
    # push to main (when it is in the push filter below) or nightly, or on
    # demand via workflow_dispatch on the PR branch;
    # ci.yml's per-ecosystem blocking slice still runs on every PR and in
    # the merge queue (#1198).
    paths:
      - '.github/actions/upload-artifact/**'
      - '.github/workflows/pipenv-compatibility.yml'
      - 'crates/*/src/**/*pipenv*'
      - 'crates/*/src/**/*pipenv*/**'
      - 'crates/socket-patch-core/src/vendor/pypi.rs'
      - 'crates/socket-patch-core/src/crawlers/python_crawler.rs'
      - 'scripts/backtest-pipenv.py'
      - 'scripts/tests/test_backtest_harnesses.py'
  push:
    branches: [main]
    # The ecosystem's pre-#1198 relevance set (the shared engine code its
    # cells run through), its PR paths and the toolchain files. A main
    # push outside this set waits for the nightly run below.
    paths:
      - '.github/actions/upload-artifact/**'
      - 'crates/socket-patch-core/src/patch/redirect/pipenv.rs'
      - 'crates/socket-patch-core/src/vendor/pypi_pipenv.rs'
      - 'crates/socket-patch-core/src/vendor/pypi.rs'
      - 'crates/socket-patch-core/src/vendor/lock_inventory/**'
      - 'crates/socket-patch-core/src/crawlers/python_crawler.rs'
      - 'crates/socket-patch-core/src/utils/pipenv.rs'
      - 'crates/socket-patch-cli/src/commands/scan/hosted.rs'
      - 'crates/socket-patch-cli/src/commands/vendor.rs'
      - 'crates/socket-patch-cli/src/commands/rollback.rs'
      - 'crates/socket-patch-cli/src/commands/vex.rs'
      - 'crates/socket-patch-core/src/patch/redirect/replay.rs'
      - 'scripts/backtest-pipenv.py'
      - 'scripts/tests/test_backtest_harnesses.py'
      - 'crates/socket-patch-core/src/vex/**'
      - 'crates/socket-patch-cli/src/commands/vex_sources.rs'
      - '.github/workflows/pipenv-compatibility.yml'
      - 'crates/*/src/**/*pipenv*'
      - 'crates/*/src/**/*pipenv*/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/*/Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
  schedule:
    # Nightly full matrix, so a main change outside the push filter
    # still gets a run within a day.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Every other event
# gets its own group (run_id), so no main push is cancelled, even while
# pending behind another.
concurrency:
  group: pipenv-compat-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every 2018+ major, plus the shapes that exercise the relock and
          # line-ending paths on the newest and the last Python-3.8 release.
          - os: ubuntu-latest
            versions: 2018.11.26 2020.11.15 2021.11.23 2022.12.19 2023.12.1 2024.4.1 2025.1.3 2026.8.0
            shapes: direct
          - os: ubuntu-latest
            versions: 2022.12.19 2026.8.0
            shapes: crlf marker-excluded extras category
    runs-on: ${{ vars.DISABLE_DEPOT_RUNNERS != 'true' && (matrix.os == 'ubuntu-latest' && 'depot-ubuntu-24.04-4' || matrix.os == 'ubuntu-22.04' && 'depot-ubuntu-22.04-4') || matrix.os }}
    timeout-minutes: 60
    steps: &matrix-steps
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: dev-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install the Pythons the Pipenv releases run on
        run: uv python install 3.8 3.12
      - name: Build the CLI
        run: |
          cargo build --locked -p socket-patch-cli
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/socket-patch "$RUNNER_TEMP/bin/socket-patch"
      - name: Harness unit tests
        run: python3 -m unittest scripts/tests/test_backtest_harnesses.py
      - name: Run the Pipenv matrix
        env:
          SOCKET_NO_CONFIG: '1'
          SOCKET_NO_UPDATE_CHECK: '1'
          SOCKET_TELEMETRY_DISABLED: '1'
          # The runners carry whatever patch release uv ships; the harness
          # only needs one 3.8 and one 3.12.
          BACKTEST_PY38: '3.8'
          BACKTEST_PY312: '3.12'
          PIPENV_VERSIONS: ${{ matrix.versions }}
          PIPENV_SHAPES: ${{ matrix.shapes }}
        run: |
          # shellcheck disable=SC2086
          python3 scripts/backtest-pipenv.py \
            --socket-patch "$RUNNER_TEMP/bin/socket-patch" \
            --socket-patch-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/pipenv-compat" \
            --versions $PIPENV_VERSIONS \
            --shapes $PIPENV_SHAPES \
            --modes hosted vendored agent agent-oot \
            --jobs 4
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: pipenv-compat-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/pipenv-compat/summary.json
            ${{ runner.temp }}/pipenv-compat/summary.md
          if-no-files-found: warn
          retention-days: 7

  # The macOS rows of `matrix`: they run on push to main (and nightly
  # where scheduled), not on every PR push, so PRs stop queueing on the
  # small macOS runner pool.
  matrix-macos:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            versions: 2018.11.26 2022.12.19 2023.12.1 2026.8.0
            shapes: direct
    runs-on: ${{ vars.DISABLE_DEPOT_RUNNERS != 'true' && (matrix.os == 'ubuntu-latest' && 'depot-ubuntu-24.04-4' || matrix.os == 'ubuntu-22.04' && 'depot-ubuntu-22.04-4') || matrix.os }}
    timeout-minutes: 60
    steps: *matrix-steps
