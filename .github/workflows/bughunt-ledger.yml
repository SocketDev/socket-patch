name: bughunt ledger to discussions

on:
  push:
    branches: [bughunt/ledger]

permissions:
  contents: read
  discussions: write

concurrency:
  group: bughunt-ledger
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: bughunt/ledger
          persist-credentials: false
      # tools/mirror.py reconciles the whole branch tip against the
      # discussions instead of diffing one push. The concurrency group above
      # keeps only the newest pending run, and with the old per-push diff a
      # cancelled run's entries were never posted. Now the next run posts
      # anything missing. --since skips entries from before this change; all
      # of those were verified posted.
      - name: Mirror entries and state to discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/mirror.py --since 20261002T000000Z
