name: janitor ledger to discussions

# Cloud agent sessions can't use GitHub GraphQL. The issue & discussion
# janitor routine pushes ops/*.json here. This workflow applies them with
# the Actions token, then commits a fresh snapshot of every discussion
# (snapshot/) back to this branch for the routine to read with git. Pushes
# made with GITHUB_TOKEN don't trigger workflows, so there's no loop. Ops
# are idempotent and tracked in applied.json, so a cancelled run is
# recovered by the next one.

on:
  push:
    branches: [janitor/ledger]

permissions:
  contents: write
  discussions: write

concurrency:
  group: janitor-ledger
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: janitor/ledger
      - name: Apply ops and snapshot discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/janitor_sync.py
      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add snapshot applied.json
          git diff --cached --quiet && exit 0
          git commit -q -m "snapshot: $(jq -r .generated_at snapshot/meta.json)"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:janitor/ledger && exit 0
            git pull -q --rebase origin janitor/ledger
          done
          exit 1
