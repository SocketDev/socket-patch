name: bughunt-bun probe
on:
  push:
    branches: ['bughunt/bun/**']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ['1.2.23', '1.3.14', '1.4.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: build
        run: cargo build --release -p socket-patch-cli
      - name: probe
        run: |
          set +e -x +o pipefail
          ROOT="$PWD"; SP="$ROOT/target/release/socket-patch"; [ -f "$SP.exe" ] && SP="$SP.exe"
          W="$RUNNER_TEMP/w"; mkdir -p "$W/patches"
          cat > "$W/mkpatch.py" <<'PY'
          import sys, io, tarfile, gzip, hashlib, base64, json, urllib.request, os
          name, ver, rel, uuid, out = sys.argv[1:6]
          raw = urllib.request.urlopen(f"https://registry.npmjs.org/{name}/-/{name}-{ver}.tgz").read()
          tin = tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz'); MARK=f"/* SOCKET-PATCHED {uuid} */\n".encode()
          buf = io.BytesIO(); tout = tarfile.open(fileobj=buf, mode='w', format=tarfile.USTAR_FORMAT)
          for m in tin.getmembers():
              data = tin.extractfile(m).read() if m.isfile() else None
              if m.isfile() and m.name.split('/',1)[1] == rel:
                  orig = data; data = MARK + data; patched = data; m.size = len(data)
              m.mtime = 0; tout.addfile(m, io.BytesIO(data) if data is not None else None)
          tout.close(); gz = io.BytesIO()
          with gzip.GzipFile(fileobj=gz, mode='wb', mtime=0) as g: g.write(buf.getvalue())
          tgz = gz.getvalue(); gs = lambda b: hashlib.sha256(b"blob %d\0" % len(b) + b).hexdigest()
          open(os.path.join(out, uuid+".tgz"),'wb').write(tgz)
          json.dump(dict(name=name,version=ver,uuid=uuid,purl=f"pkg:npm/{name}@{ver}",file=rel,beforeHash=gs(orig),afterHash=gs(patched),
            before=base64.b64encode(orig).decode(),after=base64.b64encode(patched).decode(),
            sri="sha512-"+base64.b64encode(hashlib.sha512(tgz).digest()).decode(),tgz=uuid+".tgz"), open(os.path.join(out, uuid+".json"),'w'))
          PY
          sed -i.bak 's/^          //' "$W/mkpatch.py"
          python "$W/mkpatch.py" is-number 7.0.0 index.js 22222222-2222-4222-8222-222222222222 "$W/patches"
          python "$W/mkpatch.py" left-pad 1.3.0 index.js 11111111-1111-4111-8111-111111111111 "$W/patches"
          echo "$MOCK_B64" | base64 -d > "$W/mock.py"
          (python "$W/mock.py" 18080 "$W/patches" > "$W/mock.log" 2>&1 &)
          sleep 3
          export SOCKET_PATCH_SERVER_URL=http://127.0.0.1:18080
          API="--api-url http://127.0.0.1:18080 --org org --api-token fake"
          for case in iso-bunfig ws-default hoisted-control; do
            P="$W/$case"; mkdir -p "$P"; cd "$P"
            case $case in
              iso-bunfig) echo '{"name":"app","version":"1.0.0","dependencies":{"to-regex-range":"5.0.1"}}' > package.json; printf '[install]\nlinker = "isolated"\n' > bunfig.toml;;
              hoisted-control) echo '{"name":"app","version":"1.0.0","dependencies":{"to-regex-range":"5.0.1"}}' > package.json; printf '[install]\nlinker = "hoisted"\n' > bunfig.toml;;
              ws-default) echo '{"name":"app","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > package.json; mkdir -p packages/a; echo '{"name":"a","version":"1.0.0","dependencies":{"to-regex-range":"5.0.1","left-pad":"1.3.0"}}' > packages/a/package.json;;
            esac
            BUN_INSTALL_CACHE_DIR="$P.cache" bun install > "$P.install.log" 2>&1; echo "RESULT $case install-exit=$?"
            "$SP" scan --mode hosted --json --yes $API > "$P.scan.json" 2>"$P.scan.err"; echo "RESULT $case scan-exit=$?"
            f=$(ls node_modules/.bun/is-number*/node_modules/is-number/index.js node_modules/is-number/index.js 2>/dev/null | head -1)
            echo "RESULT $case installed=$f marker=$(grep -c SOCKET-PATCHED "$f")"
            "$SP" vex --json --output out.vex.json $API > "$P.vex.json" 2>"$P.vex.err"; echo "RESULT $case vex-exit=$?"
            python -c "import json,sys,os;d=json.load(open(sys.argv[1]));[print('RESULT',sys.argv[2],'event',e['action'],e['purl'],e.get('errorCode')) for e in d['events']]
          if os.path.exists('out.vex.json'):
            [print('RESULT',sys.argv[2],'STMT',s['status'],s['products'][0]['subcomponents'][0]['@id']) for s in json.load(open('out.vex.json'))['statements']]" "$P.vex.json" $case
            cd "$ROOT"
          done
        env:
          MOCK_B64: 
