name: Measure release code generation

on:
  push:
    branches: [experiment/release-codegen-measurement]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install comparison toolchains
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.93.1
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.99.0

      - name: Measure sequential clean-target builds
        run: python3 scripts/measure-release-codegen.py

      - name: Upload sanitized measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-codegen-${{ github.sha }}
          path: release-codegen-results.json
          if-no-files-found: warn
          retention-days: 30
