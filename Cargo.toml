[workspace]
members = [
    "crates/socket-patch-core",
    "crates/socket-patch-cli",
    "crates/socket-patch-node",
    "crates/socket-patch-bench",
]
# Bare `cargo build` (release.yml's per-target builds) skips the Node addon,
# which no release artifact ships; `--workspace` and `-p` still build it.
default-members = [
    "crates/socket-patch-core",
    "crates/socket-patch-cli",
]
resolver = "2"

[workspace.package]
version = "5.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SocketDev/socket-patch"

[workspace.dependencies]
socket-patch-core = { path = "crates/socket-patch-core", version = "=5.0.0" }
clap = { version = "=4.5.60", features = ["derive", "env"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order", "raw_value"] }
sha2 = "=0.10.9"
sha1 = "=0.10.6"
hex = "=0.4.3"
reqwest = { version = "=0.12.28", features = ["rustls-tls", "json"], default-features = false }
# Platform trust store (+ SSL_CERT_FILE / SSL_CERT_DIR) for every HTTPS
# client, alongside the bundled webpki roots (utils::http::client_builder).
# `rustls` and `webpki-roots` are the exact builds reqwest's `rustls-tls`
# already pulls in (ring provider); the shared client config is built
# from them directly.
rustls-native-certs = "=0.8.4"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.6"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "=1.50.0", features = ["full"] }
tokio-util = "=0.7.18"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
thiserror = "=2.0.18"
walkdir = "=2.5.0"
uuid = { version = "=1.21.0", features = ["v4"] }
console = "=0.15.11"
dialoguer = "=0.11.0"
tempfile = "=3.26.0"
regex = "=1.12.3"
aho-corasick = "=1.1.4"
glob = "=0.3.4"
toml_edit = "=0.25.12"
once_cell = "=1.21.3"
rayon = "=1.12.0"
tar = "=0.4.46"
flate2 = "=1.1.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
fs2 = "=0.4.3"
same-file = "=1.0.6"
libc = "=0.2.182"
windows-sys = "=0.59.0"
semver = "=1.0.27"
self-replace = "=1.5.0"
wiremock = "=0.6.5"
portable-pty = "=0.9.0"
base64 = "=0.22.1"
serial_test = "=3.4.0"
napi = { version = "=3.13.0", features = ["napi8", "tokio_rt"] }
napi-derive = "=3.6.9"
napi-build = "=2.5.0"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
ignore = "=0.4.33"

[profile.release]
strip = true
lto = true
opt-level = "s"

# Test release semantics without the cost of full-LTO links for every test binary.
# Shipped binaries still use [profile.release].
[profile.ci-release]
inherits = "release"
lto = false
strip = "none" # unstripped test binaries => usable backtraces on failure

# Benchmark with release codegen, faster thin-LTO links, and profiler symbols.
[profile.perf]
inherits = "release"
lto = "thin"
strip = "none"

# The Node addon (crates/socket-patch-node) for hosts that load it
# in-process: release semantics without the slow full-LTO link.
[profile.addon]
inherits = "release"
lto = "thin"

# Optimize dependencies for test speed. Workspace crates stay unoptimized;
# debug assertions and overflow checks remain enabled everywhere.
[profile.dev.package."*"]
opt-level = 1

# Fully optimize hashing and compression, the test fixtures' hot paths.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.cpufeatures]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3

# Keep backtraces readable without retaining full DWARF for every test binary.
# Use CARGO_PROFILE_DEV_DEBUG=full for debugger sessions.
[profile.dev]
debug = "line-tables-only"
