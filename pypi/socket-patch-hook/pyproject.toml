[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "socket-patch-hook"
version = "4.0.0"
description = "Auto-apply Socket security patches after install via a package-manager-agnostic .pth startup hook"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Socket Security" }
]
keywords = ["security", "patch", "hook", "dependencies", "pth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
# Intentionally NO dependency on socket-patch: the hook is version-agnostic. It
# runs the binary bundled in an installed `socket_patch` package, falls back to
# `socket-patch` on PATH, and no-ops if neither exists. Projects commit
# `socket-patch[hook]`, which pulls in both the CLI and this wheel.
# (The canonical build is scripts/build-pypi-wheels.py, which also lays down the
# startup .pth; this block keeps the directory a valid project for `pip install .`.)
dependencies = []

[project.urls]
Homepage = "https://github.com/SocketDev/socket-patch"
Repository = "https://github.com/SocketDev/socket-patch"

[tool.setuptools]
packages = ["socket_patch_hook"]
